<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Caudal</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0c11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Caudal">
<meta name="description" content="Finanzas personales: cuentas, gastos, objetivos, cripto y acciones en tiempo real.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Martian+Mono:wdth,wght@87.5..112.5,300..700&family=Onest:wght@400;500;600;700&display=swap">
<style>
/* Layout: una sola columna tipo app de teléfono — cabecera fija arriba, barra de pestañas abajo,
   contenido centrado a 760px en pantallas anchas. Oscuro por defecto (como tu pantalla de bloqueo), claro opcional. */
:root{
  --bg:#0e0c11; --surface:#17141b; --surface-2:#221e27; --line:#2d2833;
  --fg:#f2edf4; --muted:#9d94a4; --faint:#675f6e;
  --accent:#e4b3cb; --accent-ink:#1b0f16; --accent-soft:rgba(228,179,203,.14);
  --pos:#6fd49b; --neg:#ff8686; --warn:#f0c46a;
  --pos-soft:rgba(111,212,155,.14); --neg-soft:rgba(255,134,134,.14); --warn-soft:rgba(240,196,106,.16);
  --on-strong:#140d12; --scrim:rgba(6,4,9,.6);
  --shadow:0 12px 32px rgba(0,0,0,.45);
  --f-num:"Martian Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --f-body:"Onest", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r:16px; --r-sm:11px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]):not([data-theme="black"]){
    --bg:#f6f2f5; --surface:#ffffff; --surface-2:#f0e9ee; --line:#e2d8df;
    --fg:#1c1620; --muted:#6b6171; --faint:#a39aa8;
    --accent:#9b4873; --accent-ink:#ffffff; --accent-soft:rgba(155,72,115,.10);
    --pos:#1b8a4e; --neg:#c93838; --warn:#9b6b0c;
    --pos-soft:rgba(27,138,78,.10); --neg-soft:rgba(201,56,56,.10); --warn-soft:rgba(155,107,12,.12);
    --on-strong:#ffffff; --scrim:rgba(40,20,35,.35);
    --shadow:0 12px 32px rgba(70,25,55,.14);
    color-scheme:light;
  }
}
:root[data-theme="black"]{--bg:#000000; --surface:#0d0c0f; --surface-2:#18161b; --line:#25222a; --scrim:rgba(0,0,0,.72); color-scheme:dark}
:root[data-theme="light"]{
  --bg:#f6f2f5; --surface:#ffffff; --surface-2:#f0e9ee; --line:#e2d8df;
  --fg:#1c1620; --muted:#6b6171; --faint:#a39aa8;
  --accent:#9b4873; --accent-ink:#ffffff; --accent-soft:rgba(155,72,115,.10);
  --pos:#1b8a4e; --neg:#c93838; --warn:#9b6b0c;
  --pos-soft:rgba(27,138,78,.10); --neg-soft:rgba(201,56,56,.10); --warn-soft:rgba(155,107,12,.12);
  --on-strong:#ffffff; --scrim:rgba(40,20,35,.35);
  --shadow:0 12px 32px rgba(70,25,55,.14);
  color-scheme:light;
}

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font:15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;min-height:100vh;min-height:100dvh;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
img{max-width:100%}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{text-wrap:balance}

/* ---------- cabecera ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--bg);padding-top:env(safe-area-inset-top,0px);border-bottom:1px solid transparent;transition:border-color .2s}
@supports (backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px)){
  .top{background:color-mix(in srgb,var(--bg) 84%,transparent);backdrop-filter:saturate(1.3) blur(16px);-webkit-backdrop-filter:saturate(1.3) blur(16px)}
}
.top.scrolled{border-bottom-color:var(--line)}
.top-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:6px;padding:8px 12px 8px 16px;min-height:54px}
.top h1{font:650 20px/1.15 var(--f-body);margin:0;flex:1;min-width:0;letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;border:0;background:none;color:var(--fg);flex:none}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn svg{width:22px;height:22px}
.back-btn{margin-left:-8px;color:var(--accent)}
.live{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:none;font:500 10px/1 var(--f-num);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.live i{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.live.on{color:var(--pos)}
.live.on i{background:var(--pos);animation:pulse 2.2s infinite}
.live.warn i{background:var(--warn)}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--pos-soft)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}

/* ---------- contenido ---------- */
main{max-width:760px;margin:0 auto;padding:6px 16px calc(120px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:26px}
.banner{max-width:760px;margin:0 auto 4px;padding:0 16px}
.banner > div{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border-radius:var(--r-sm);background:var(--warn-soft);color:var(--fg);font-size:13.5px}
.banner b{font-weight:600}
.banner .btn{margin-left:auto}
section{display:flex;flex-direction:column;gap:10px;min-width:0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sec-h h2{font:650 16px/1.2 var(--f-body);margin:0;letter-spacing:-.01em}
.eyebrow{font:500 10.5px/1.2 var(--f-num);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.link{background:none;border:0;color:var(--accent);font-weight:550;font-size:14px;padding:6px 0;white-space:nowrap}
.num{font-family:var(--f-num);font-stretch:87.5%;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.pos{color:var(--pos)} .neg{color:var(--neg)} .warn{color:var(--warn)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.stack{display:flex;flex-direction:column;gap:10px}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.hstack{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.spacer{flex:1}
.empty{padding:26px 18px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:12px}
.empty b{color:var(--fg);font-weight:600;font-size:16px}
.note{font-size:12.5px;color:var(--muted);line-height:1.5}

/* privacidad: difumina importes */
body.privacy .amt{filter:blur(8px);user-select:none}
.amt{transition:filter .2s}

/* ---------- hero del resumen ---------- */
.hero{display:flex;flex-direction:column;gap:6px;padding-top:4px}
.hero-num{font:600 clamp(34px,11vw,56px)/1.04 var(--f-num);font-stretch:87.5%;letter-spacing:-.045em;font-variant-numeric:tabular-nums;color:var(--accent);word-break:break-word}
.hero-sub{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.spark{display:block;width:100%;height:56px;margin-top:4px}
.spark-line{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.spark-area{fill:var(--accent-soft);stroke:none}
.mission{font:500 10.5px/1.5 var(--f-num);letter-spacing:.2em;color:var(--faint);text-transform:uppercase;display:flex;flex-direction:column;gap:0;user-select:none}
.mission span:nth-child(2){color:var(--muted)}
.mission span:nth-child(3){color:var(--fg);font-weight:700}

.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 8px;border-radius:999px;font:500 11.5px/1.2 var(--f-num);font-stretch:87.5%;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.pos{background:var(--pos-soft);color:var(--pos)}
.chip.neg{background:var(--neg-soft);color:var(--neg)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}

/* ---------- selector de periodo / segmentos ---------- */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);background:var(--surface-2);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:none;padding:8px 4px;border-radius:9px;font-weight:600;font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 4px rgba(0,0,0,.18)}

/* ---------- tarjetas de cifras ---------- */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .k-l{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.kpi .k-v{font:600 19px/1.15 var(--f-num);font-stretch:87.5%;letter-spacing:-.03em;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .k-s{font-size:12px;color:var(--muted)}
.kpi.wide{grid-column:1/-1}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--accent));flex:none;display:inline-block}

/* ---------- grupos ---------- */
.groups{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:620px){.groups{grid-template-columns:repeat(3,minmax(0,1fr))}}
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:6px;text-align:left;min-width:0;color:var(--fg)}
.gcard:hover{border-color:var(--faint)}
.gcard .g-n{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.gcard .g-v{font:600 18px/1.15 var(--f-num);font-stretch:87.5%;letter-spacing:-.03em;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:4px;border-radius:3px;background:var(--surface-2);overflow:hidden;display:flex}
.bar > i{display:block;height:100%;background:var(--c,var(--accent));border-radius:3px}
.gcard.add{border-style:dashed;background:transparent;align-items:center;justify-content:center;color:var(--muted);font-weight:550;min-height:84px}

/* ---------- objetivos ---------- */
.goal{display:flex;flex-direction:column;gap:8px}
.goal-top{display:flex;align-items:center;gap:12px}
.goal .bar{height:8px}
.goal-meta{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}

/* ---------- listas ---------- */
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;min-height:58px;width:100%;background:none;border:0;border-top:1px solid var(--line);text-align:left;color:var(--fg)}
.row:first-child{border-top:0}
button.row:hover,.row.tap:hover{background:var(--surface-2)}
.ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:18px;flex:none;background:color-mix(in srgb,var(--c,var(--accent)) 20%,transparent);color:var(--c,var(--accent));color:color-mix(in srgb,var(--c,var(--accent)) 62%,var(--fg));font-family:var(--f-num);font-weight:600;font-stretch:87.5%;letter-spacing:-.03em}
.ico.sm{width:30px;height:30px;border-radius:9px;font-size:15px}
.ico.txt{font-size:12px}
.row-m{flex:1;min-width:0}
.row-t{font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-s{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-r{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:2px;max-width:55%}
.row-r .num{white-space:nowrap}
.day-h{display:flex;justify-content:space-between;align-items:baseline;padding:14px 4px 6px;font-size:13px;color:var(--muted);font-weight:550}
.chev{color:var(--faint);flex:none;width:18px;height:18px}
.ico svg{width:20px;height:20px}
.ico.sm svg{width:16px;height:16px}
.catline{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;padding:2px 0;text-align:left;color:var(--fg);min-width:0}
.catline .bar{margin-top:5px}
.bar.budget{position:relative;overflow:visible;height:6px}
.bar.budget > i{background:var(--c)}
.bar.budget > b{position:absolute;top:-4px;bottom:-4px;width:2px;border-radius:1px;background:var(--fg);opacity:.35;transform:translateX(-1px)}
.reorder{display:flex;flex-direction:column;gap:2px}
.reorder button{width:30px;height:22px;border:0;background:var(--surface-2);border-radius:6px;display:grid;place-items:center;color:var(--muted)}
.reorder svg{width:14px;height:14px}

@keyframes flashUp{from{background:var(--pos-soft)}to{background:transparent}}
@keyframes flashDown{from{background:var(--neg-soft)}to{background:transparent}}
.flash-up{animation:flashUp 1.2s ease-out}
.flash-down{animation:flashDown 1.2s ease-out}

/* ---------- barras de reparto ---------- */
.alloc{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--surface-2);gap:2px}
.alloc i{display:block;height:100%;background:var(--c)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* ---------- gráficos ---------- */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--muted);font:500 9.5px var(--f-num);font-stretch:87.5%}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:var(--accent-soft)}
.chart .inc{fill:var(--pos)}
.chart .exp{fill:var(--neg)}
.chart .end{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.chart .zero{stroke:var(--faint);stroke-dasharray:3 3}
.donut-wrap{display:grid;grid-template-columns:1fr;gap:18px;align-items:center}
.donut-wrap .donut{max-width:190px;margin:0 auto}
@media (min-width:560px){.donut-wrap{grid-template-columns:180px minmax(0,1fr)}}
.donut{position:relative;width:100%;aspect-ratio:1;max-width:100%}
.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2px}
.donut .c b{font:600 14px/1.1 var(--f-num);font-stretch:87.5%;letter-spacing:-.03em}
.donut .c span{font-size:11px;color:var(--muted)}

/* ---------- botones ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);font-weight:600;font-size:14.5px;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--neg);background:transparent;border-color:color-mix(in srgb,var(--neg) 45%,transparent)}
.btn.armed{background:var(--neg);border-color:var(--neg);color:var(--on-strong)}
.btn.block{width:100%}
.btn.sm{min-height:34px;padding:0 12px;font-size:13px;border-radius:10px}
.btn svg{width:18px;height:18px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ---------- formularios ---------- */
.form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field > span,.lbl{font-size:12.5px;color:var(--muted);font-weight:550}
.inp,.form input[type=text],.form input[type=date],.form input[type=url],.form input[type=password],.form input[type=search],.form textarea,.sel select{width:100%;min-height:46px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);font-size:16px;outline:none;-webkit-appearance:none;appearance:none}
input[type=date]{min-width:0}
.sel{position:relative;min-width:0}
.sel select{padding-right:34px;text-overflow:ellipsis}
.sel::after{content:"";position:absolute;right:14px;top:50%;width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.inp:focus,.form input:focus,.form textarea:focus,.sel select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.amount-wrap{display:flex;align-items:baseline;justify-content:center;gap:8px;padding:6px 0 2px;border-bottom:1px solid var(--line)}
.amount-input{font:600 38px/1.1 var(--f-num)!important;font-stretch:87.5%!important;letter-spacing:-.04em;text-align:center;background:transparent!important;border:0!important;box-shadow:none!important;min-height:58px!important;width:100%;max-width:280px;padding:0!important;color:var(--fg)}
.amount-input:focus-visible{outline:none}
.amount-ccy{font:500 14px var(--f-num);color:var(--muted)}
.catgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (min-width:480px){.catgrid{grid-template-columns:repeat(5,minmax(0,1fr))}}
.catbtn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 4px 7px;border-radius:12px;border:1.5px solid transparent;background:var(--surface-2);font-size:11.5px;min-width:0;color:var(--fg)}
.catbtn .e{font-size:20px;line-height:1}
.catbtn .t{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.catbtn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.check{display:flex;align-items:center;gap:12px;padding:10px 2px;font-size:15px}
.check input{width:22px;height:22px;accent-color:var(--accent);flex:none;margin:0}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.swatches button{width:32px;height:32px;border-radius:50%;border:2px solid transparent;background:var(--c);box-shadow:inset 0 0 0 2px var(--surface)}
.swatches button[aria-pressed="true"]{border-color:var(--fg)}
.emojis{display:flex;flex-wrap:wrap;gap:6px}
.emojis button{width:40px;height:40px;border-radius:10px;border:1.5px solid transparent;background:var(--surface-2);font-size:19px}
.emojis button[aria-pressed="true"]{border-color:var(--accent)}
.err{color:var(--neg);font-size:13px;min-height:0}
.results{display:flex;flex-direction:column;max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:12px}
.results .row{min-height:52px;padding:8px 12px}
.toolbar{display:flex;gap:8px;align-items:center}
.toolbar .inp{flex:1}
.filters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.filters .sel select{min-height:40px;font-size:14px;padding:8px 28px 8px 10px}
.month-nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.month-nav b{font-weight:650;font-size:15px}
.month-nav .icon-btn{background:var(--surface-2)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;border-top:1px solid var(--line);text-align:left;white-space:nowrap}
thead th{border-top:0;color:var(--muted);font-weight:550;background:var(--surface-2)}
td.r,th.r{text-align:right}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 14px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;line-height:1.5}
code{font:12.5px var(--f-num);background:var(--surface-2);padding:1px 5px;border-radius:5px;word-break:break-all}

/* ---------- pestañas + botón añadir ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
@supports (backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px)){
  .tabs{background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:saturate(1.3) blur(16px);-webkit-backdrop-filter:saturate(1.3) blur(16px)}
}
.tabs-in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 7px;background:none;border:0;color:var(--muted);font-size:0;gap:0;padding:12px 0;font-weight:550}
.tab svg{width:23px;height:23px}
.tab[aria-current="page"]{color:var(--accent)}
.fab{position:fixed;right:max(16px,calc(50% - 364px));bottom:calc(74px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:19px;background:var(--accent);color:var(--accent-ink);border:0;box-shadow:var(--shadow);z-index:25;display:grid;place-items:center}
.fab svg{width:26px;height:26px}

/* ---------- hoja inferior ---------- */
#sheetWrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:var(--scrim);animation:fade .2s ease-out}
.sheet{position:relative;width:100%;max-width:560px;max-height:92vh;max-height:92dvh;overflow:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:0 16px calc(24px + env(safe-area-inset-bottom,0px));animation:up .28s cubic-bezier(.2,.8,.2,1);overscroll-behavior:contain;box-shadow:var(--shadow)}
@media (min-width:700px){#sheetWrap{align-items:center}.sheet{border-radius:22px;max-height:88vh}}
.sheet-head{position:sticky;top:0;background:var(--surface);display:flex;align-items:center;gap:8px;padding:14px 0 10px;z-index:2}
.sheet-head h2{flex:1;margin:0;font:650 18px/1.2 var(--f-body);letter-spacing:-.01em;min-width:0}
.sheet-grip{width:38px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 0}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}

#toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);opacity:0;background:var(--fg);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:550;font-size:14px;pointer-events:none;transition:opacity .25s,transform .25s;z-index:60;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}


/* ---------- v2: tamaño de letra, avisos, plantillas, calendario, bloqueo ---------- */
main,#sheetBody{zoom:var(--z,1)}
#toast{display:flex;align-items:center;gap:12px;width:max-content}
#toast span{flex:1}
.top.sub .live span{display:none}
.top.sub .live{padding:6px 8px}
#toast.has-act{pointer-events:auto}
.toast-btn{background:none;border:0;color:var(--bg);font-weight:700;text-decoration:underline;padding:4px 2px;white-space:nowrap}
.chips-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
.chips-row::-webkit-scrollbar{display:none}
.qchip{flex:none;display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-width:104px;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);text-align:left}
.qchip .e{font-size:20px;line-height:1}
.qchip .t{font-weight:600;font-size:13.5px;white-space:nowrap;max-width:130px;overflow:hidden;text-overflow:ellipsis}
.qchip .num{color:var(--muted)}
.qchip:active{transform:scale(.97)}
.qchip.add{justify-content:center;align-items:center;border-style:dashed;background:transparent;color:var(--muted);font-weight:600}
.catbtn.sub{background:color-mix(in srgb,var(--surface-2) 60%,transparent);border-style:dashed;border-color:var(--line)}
.catbtn.sub[aria-pressed="true"]{border-style:solid;border-color:var(--accent)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-h{text-align:center;font:600 10.5px var(--f-num);color:var(--muted);padding-bottom:4px}
.cday{aspect-ratio:1/1.08;border-radius:10px;border:1px solid transparent;background:color-mix(in srgb,var(--neg) var(--k,0%),var(--surface-2));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:2px;min-width:0;position:relative;color:var(--fg)}
.cday b{font:600 12.5px var(--f-num);font-stretch:87.5%}
.cday span{font:500 9px var(--f-num);font-stretch:87.5%;color:var(--fg);opacity:.85;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cday.future{opacity:.45}
.cday.is-today{border-color:var(--accent)}
.cday.is-sel{outline:2px solid var(--fg);outline-offset:-2px}
.inc-dot{position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--pos)}
.swatches .custom-color{display:inline-flex;align-items:center;gap:6px;padding:0 10px 0 4px;height:32px;border-radius:16px;border:1px solid var(--line);font-size:13px;color:var(--muted)}
.custom-color input{width:24px;height:24px;border:0;padding:0;background:none;border-radius:50%}
.code-box{display:flex;align-items:center;gap:8px;background:var(--surface-2);border-radius:10px;padding:8px 8px 8px 12px}
.code-box code{flex:1;min-width:0;background:none;padding:0;font-size:11.5px;line-height:1.5}
.chart .ln.down{stroke:var(--neg)} .chart .ar.down{fill:var(--neg-soft)}
.chart.scrubbable{touch-action:pan-y;cursor:crosshair}
.chart .scrub-l{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.chart .scrub-c{fill:var(--accent);stroke:var(--surface);stroke-width:2}
#lock{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px))}
html.locked body > :not(#lock){visibility:hidden}
.lock-in{display:flex;flex-direction:column;align-items:center;gap:16px;width:100%;max-width:300px}
.lock-in h2{font:600 18px var(--f-body);margin:0}
.lock-mark{display:flex;flex-direction:column;gap:5px;align-items:center;margin-bottom:6px}
.lock-mark i{display:block;height:5px;border-radius:3px;background:var(--faint);width:56px}
.lock-mark i:nth-child(2),.lock-mark i:nth-child(4){background:var(--muted);width:62px}
.lock-mark i:nth-child(3){background:var(--accent);width:70px}
.pin-dots{display:flex;gap:14px}
.pin-dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--muted)}
.pin-dots i.on{background:var(--accent);border-color:var(--accent)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;margin-top:8px}
.keypad button{height:64px;border-radius:50%;border:0;background:var(--surface-2);color:var(--fg);font:500 24px var(--f-num);aspect-ratio:1;justify-self:center;width:64px}
.keypad button[data-k="x"],.keypad button[data-k="del"]{background:none;font:600 14px var(--f-body);color:var(--muted)}

/* ---------- Liquid Glass (estilo iOS 26), activo con html.glass ----------
   Superficies translúcidas con desenfoque, borde de luz y brillo arriba.
   Barra de pestañas y botón + flotantes; la hoja inferior flota separada de los bordes.
   Un fondo de color difuminado detrás da algo que "refractar" al cristal. */
:root{
  --g-fill:rgba(255,255,255,.06); --g-fill-2:rgba(255,255,255,.10); --g-strong:rgba(28,24,34,.52);
  --g-edge:rgba(255,255,255,.14); --g-hi:rgba(255,255,255,.22); --g-lo:rgba(255,255,255,.04);
  --g-blur:saturate(1.8) blur(22px); --g-blur-strong:saturate(1.9) blur(34px);
  --g-shadow:0 10px 30px rgba(0,0,0,.35); --g-glow-1:30%; --g-glow-2:18%;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]):not([data-theme="black"]){
    --g-fill:rgba(255,255,255,.55); --g-fill-2:rgba(255,255,255,.72); --g-strong:rgba(255,255,255,.62);
    --g-edge:rgba(255,255,255,.85); --g-hi:rgba(255,255,255,.95); --g-lo:rgba(120,70,100,.08);
    --g-shadow:0 10px 30px rgba(70,25,55,.12); --g-glow-1:22%; --g-glow-2:14%;
  }
}
:root[data-theme="light"]{
  --g-fill:rgba(255,255,255,.55); --g-fill-2:rgba(255,255,255,.72); --g-strong:rgba(255,255,255,.62);
  --g-edge:rgba(255,255,255,.85); --g-hi:rgba(255,255,255,.95); --g-lo:rgba(120,70,100,.08);
  --g-shadow:0 10px 30px rgba(70,25,55,.12); --g-glow-1:22%; --g-glow-2:14%;
}
:root[data-theme="black"]{--g-fill:rgba(255,255,255,.05); --g-strong:rgba(10,9,12,.58); --g-edge:rgba(255,255,255,.11); --g-glow-1:20%; --g-glow-2:10%}

html.glass{--r:22px; --r-sm:16px}
html.glass body{background:transparent}
html.glass body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:
  radial-gradient(60% 40% at 12% 6%,color-mix(in srgb,var(--accent) var(--g-glow-1),transparent),transparent 70%),
  radial-gradient(55% 38% at 95% 42%,color-mix(in srgb,#7a8cff var(--g-glow-2),transparent),transparent 70%),
  radial-gradient(60% 40% at 25% 96%,color-mix(in srgb,var(--accent) var(--g-glow-2),transparent),transparent 70%),
  var(--bg)}

/* material base */
html.glass :is(.card,.list,.kpi,.gcard,.qchip,.results,.tbl-wrap){
  background:linear-gradient(180deg,var(--g-fill-2),var(--g-fill) 42%);
  border:1px solid var(--g-edge);
  box-shadow:inset 0 1px 0 var(--g-hi),inset 0 -1px 0 var(--g-lo),var(--g-shadow);
  -webkit-backdrop-filter:var(--g-blur);backdrop-filter:var(--g-blur)}
html.glass .row{border-top-color:color-mix(in srgb,var(--g-edge) 60%,transparent)}
html.glass button.row:hover,html.glass .row.tap:hover{background:var(--g-fill-2)}
html.glass :is(.row,.gcard,.kpi,.qchip):active{transform:scale(.985);transition:transform .15s}
html.glass :is(.gcard.add,.qchip.add){background:transparent;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;border-style:dashed}

/* controles */
html.glass .seg{background:var(--g-fill);border:1px solid var(--g-edge);border-radius:999px;box-shadow:inset 0 1px 0 var(--g-lo);-webkit-backdrop-filter:var(--g-blur);backdrop-filter:var(--g-blur)}
html.glass .seg button{border-radius:999px;transition:background .25s,color .25s}
html.glass .seg button[aria-pressed="true"]{background:var(--g-fill-2);box-shadow:inset 0 1px 0 var(--g-hi),0 2px 10px rgba(0,0,0,.18)}
html.glass .btn{border-radius:999px;background:var(--g-fill-2);border-color:var(--g-edge);box-shadow:inset 0 1px 0 var(--g-hi);-webkit-backdrop-filter:var(--g-blur);backdrop-filter:var(--g-blur)}
html.glass .btn.primary{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 85%,#fff),var(--accent));border-color:color-mix(in srgb,var(--accent) 70%,#fff);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 6px 18px color-mix(in srgb,var(--accent) 35%,transparent)}
html.glass :is(.btn.danger,.btn.ghost){background:transparent;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
html.glass .btn.armed{background:var(--neg);border-color:var(--neg)}
html.glass :is(.btn,.icon-btn,.tab,.fab,.seg button):active{transform:scale(.94);transition:transform .12s}
html.glass :is(.inp,.form input[type=text],.form input[type=date],.form input[type=url],.form input[type=password],.form input[type=search],.form textarea,.sel select){background:var(--g-fill);border-color:var(--g-edge);border-radius:14px}
html.glass :is(.catbtn,.emojis button,.code-box,.month-nav .icon-btn,.reorder button,.keypad button){background:var(--g-fill-2)}
html.glass .catbtn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
html.glass .chip{background:var(--g-fill-2);box-shadow:inset 0 0 0 1px var(--g-edge)}
html.glass :is(.chip.pos,.chip.neg,.chip.warn,.chip.acc){box-shadow:none}
html.glass :is(.bar,.alloc){background:var(--g-fill-2)}
html.glass .cday{background:color-mix(in srgb,var(--neg) var(--k,0%),var(--g-fill-2))}
html.glass thead th{background:var(--g-fill-2)}

/* cabecera: transparente; al hacer scroll, cristal */
html.glass .top{background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none;border-bottom:0}
html.glass .top.scrolled{background:color-mix(in srgb,var(--bg) 45%,transparent);-webkit-backdrop-filter:var(--g-blur);backdrop-filter:var(--g-blur)}
html.glass :is(.top .icon-btn,.live){background:var(--g-fill-2);border:1px solid var(--g-edge);border-radius:999px;box-shadow:inset 0 1px 0 var(--g-hi);-webkit-backdrop-filter:var(--g-blur);backdrop-filter:var(--g-blur)}
html.glass .top .icon-btn{width:38px;height:38px}

/* barra de pestañas flotante (cápsula) + botón + circular al lado */
html.glass .tabs{bottom:calc(10px + env(safe-area-inset-bottom,0px));padding:0 16px;background:none;border:0;-webkit-backdrop-filter:none;backdrop-filter:none;pointer-events:none}
html.glass .tabs-in{pointer-events:auto;max-width:420px;margin:0 76px 0 auto;padding:5px;border-radius:999px;
  background:var(--g-strong);border:1px solid var(--g-edge);
  box-shadow:inset 0 1px 0 var(--g-hi),inset 0 -1px 0 var(--g-lo),0 14px 40px rgba(0,0,0,.35);
  -webkit-backdrop-filter:var(--g-blur-strong);backdrop-filter:var(--g-blur-strong)}
@media (min-width:560px){html.glass .tabs-in{margin:0 auto}}
html.glass .tab{border-radius:999px;padding:11px 0;font-size:0;gap:0;min-width:0;transition:background .3s,color .3s}
html.glass .tab svg{width:24px;height:24px}
html.glass .tab[aria-current="page"]{background:var(--g-fill-2);box-shadow:inset 0 1px 0 var(--g-hi),inset 0 0 0 1px var(--g-edge)}
html.glass .fab{right:16px;bottom:calc(12px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;
  background:radial-gradient(120% 90% at 50% 0%,color-mix(in srgb,var(--accent) 65%,#fff) 0%,var(--accent) 55%,color-mix(in srgb,var(--accent) 82%,#000) 100%);
  border:1px solid color-mix(in srgb,var(--accent) 60%,#fff);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 10px 28px color-mix(in srgb,var(--accent) 40%,transparent),0 4px 12px rgba(0,0,0,.3)}
@media (min-width:560px){html.glass .fab{right:max(16px,calc(50% - 290px))}}
html.glass main{padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
html.glass #toast{bottom:calc(86px + env(safe-area-inset-bottom,0px));border-radius:999px;background:var(--g-strong);color:var(--fg);border:1px solid var(--g-edge);
  box-shadow:inset 0 1px 0 var(--g-hi),var(--g-shadow);-webkit-backdrop-filter:var(--g-blur-strong);backdrop-filter:var(--g-blur-strong)}
html.glass .toast-btn{color:var(--accent)}

/* hoja inferior flotante */
html.glass .scrim{background:color-mix(in srgb,var(--scrim) 75%,transparent)}
html.glass #sheetWrap{padding:0 8px calc(8px + env(safe-area-inset-bottom,0px))}
html.glass .sheet{border-radius:32px;padding-bottom:20px;background:var(--g-strong);border:1px solid var(--g-edge);
  box-shadow:inset 0 1px 0 var(--g-hi),0 20px 60px rgba(0,0,0,.45);-webkit-backdrop-filter:var(--g-blur-strong);backdrop-filter:var(--g-blur-strong);
  max-height:calc(92dvh - env(safe-area-inset-bottom,0px))}
html.glass .sheet-head{background:transparent;margin:0 -16px;padding-left:16px;padding-right:16px;-webkit-backdrop-filter:var(--g-blur);backdrop-filter:var(--g-blur)}
html.glass .sheet-head .icon-btn{background:var(--g-fill-2);border:1px solid var(--g-edge);border-radius:999px;width:36px;height:36px}
html.glass .sheet-grip{background:var(--g-edge)}
html.glass .sheet :is(.card,.list,.kpi,.results){-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:inset 0 1px 0 var(--g-hi)}

/* PIN */
html.glass #lock{background:color-mix(in srgb,var(--bg) 55%,transparent);-webkit-backdrop-filter:blur(40px);backdrop-filter:blur(40px)}
html.glass .keypad button:not([data-k="x"]):not([data-k="del"]){border:1px solid var(--g-edge);box-shadow:inset 0 1px 0 var(--g-hi)}

@media (prefers-reduced-transparency:reduce){
  html.glass :is(.card,.list,.kpi,.gcard,.qchip,.tabs-in,.sheet,#toast,.btn,.seg){background:var(--surface)!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<header class="top" id="top">
  <div class="top-in">
    <button class="icon-btn back-btn" id="backBtn" data-action="back" aria-label="Volver" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <h1 id="viewTitle">Resumen</h1>
    <button class="live" id="liveBtn" data-action="price-status" aria-label="Estado de los precios"><i></i><span id="liveTxt">Precios</span></button>
    <button class="icon-btn" data-action="toggle-theme" aria-label="Cambiar tema" id="themeBtn"></button>
    <button class="icon-btn" data-action="privacy" aria-label="Ocultar importes" id="privacyBtn"></button>
  </div>
</header>
<div class="banner" id="demoBanner" hidden>
  <div><span><b>Datos de ejemplo.</b> Pruébalo todo y, cuando quieras, empieza con los tuyos.</span>
  <button class="btn sm" data-action="start-fresh">Empezar de cero</button></div>
</div>
<main id="view" aria-live="polite"></main>
<button class="fab" id="fab" data-action="add-tx" aria-label="Añadir movimiento">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>
<nav class="tabs" aria-label="Secciones">
  <div class="tabs-in">
    <button class="tab" data-tab="home" aria-label="Resumen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="4.5" rx="1.8"/><rect x="13.5" y="11" width="7" height="9.5" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/></svg>Resumen</button>
    <button class="tab" data-tab="txs" aria-label="Movimientos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1.2" fill="currentColor"/><circle cx="4" cy="12" r="1.2" fill="currentColor"/><circle cx="4" cy="18" r="1.2" fill="currentColor"/></svg>Movimientos</button>
    <button class="tab" data-tab="inv" aria-label="Inversiones"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5.5-5.5 4 4L21 7"/><path d="M15 7h6v6"/></svg>Inversiones</button>
    <button class="tab" data-tab="stats" aria-label="Análisis"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 9 9h-9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg>Análisis</button>
    <button class="tab" data-tab="more" aria-label="Más"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="5" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="19" cy="12" r="1.6" fill="currentColor"/></svg>Más</button>
  </div>
</nav>
<div id="sheetWrap" hidden>
  <div class="scrim" data-action="close-sheet"></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-grip"></div>
    <div class="sheet-head"><h2 id="sheetTitle"></h2>
      <button class="icon-btn" data-action="close-sheet" aria-label="Cerrar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div id="sheetBody"></div>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="fileIn" hidden>
<script>
'use strict';
/* =====================================================================
   MISIÓN FINANZAS — núcleo: utilidades, estado, cálculos
   Todo se guarda en este dispositivo (localStorage). Haz copias en Más › Copia de seguridad.
   ===================================================================== */

const $ = (s, r = document) => r.querySelector(s);

function conv(n, from, to) {

/* ---------- inversiones ---------- */
function holding(a) {
  let qty = 0, cost = 0, realized = 0, invested = 0, fees = 0;
  const ops = (a.ops || []).slice().sort((x, y) => x.date < y.date ? -1 : x.date > y.date ? 1 : 0);
  for (const o of ops) {
    const px = conv(Number(o.price) || 0, o.ccy || S.settings.base);
    const fee = conv(Number(o.fee) || 0, o.ccy || S.settings.base);
    const q = Number(o.qty) || 0;
    fees += fee;
    if (o.side === 'buy') { qty += q; cost += q * px + fee; invested += q * px + fee; }
    else if (o.side === 'reward') { qty += q; }
    else if (o.side === 'sell') {
      const avg = qty > 0 ? cost / qty : 0; const s = Math.min(q, qty);
      realized += s * px - fee - s * avg; cost -= s * avg; qty -= s;
    }
    else if (o.side === 'out') { const avg = qty > 0 ? cost / qty : 0; const s = Math.min(q, qty); cost -= s * avg; qty -= s; }
  }
  if (Math.abs(qty) < 1e-12) { qty = 0; cost = 0; }
  return { qty, cost, avg: qty > 0 ? cost / qty : 0, realized, invested, fees };
}

function resolveProvider(a) {
  const st = S.settings;
  if (a.provider === 'manual') return 'manual';
  if (a.kind === 'crypto') {
    if (a.provider === 'coingecko') return (a.cgId || CG_IDS[a.symbol]) ? 'coingecko' : 'manual';
    if (a.cgId || CG_IDS[a.symbol] || st.binance) return 'crypto';
    return 'manual';
  }
  if (a.watch && a.provider === 'manual') return 'manual';
  if (a.provider === 'yahoo') return (st.yahooProxy || NATIVE) ? 'yahoo' : 'manual';
  if (a.provider === 'finnhub') return st.finnhubKey ? 'finnhub' : 'manual';
  if (st.yahooProxy || NATIVE) return 'yahoo';
  if (st.finnhubKey && !String(a.symbol).includes('.')) return 'finnhub';

}

/* ---------- saldos ---------- */
function balances(upto) {
  const m = {};
  for (const a of S.accounts) m[a.id] = Number(a.initial) || 0;
  for (const t of S.txs) {
    if (upto && t.date > upto) continue;
    if (m[t.accountId] != null) {
      if (t.type === 'expense') m[t.accountId] -= t.amount;
      else if (t.type === 'income') m[t.accountId] += t.amount;
      else if (t.type === 'transfer') m[t.accountId] -= t.amount;
      else if (t.type === 'adjust') m[t.accountId] += t.amount;
    }
    if (t.type === 'transfer' && m[t.toAccountId] != null) m[t.toAccountId] += (t.toAmount ?? t.amount);
  }
  for (const as of S.assets) for (const o of as.ops || []) {
    if (!o.cashAccountId || m[o.cashAccountId] == null) continue;
    if (upto && o.date > upto) continue;
    const acc = accById(o.cashAccountId);
    const gross = (Number(o.qty) || 0) * (Number(o.price) || 0), fee = Number(o.fee) || 0;
    const v = o.side === 'buy' ? -(gross + fee) : o.side === 'sell' ? (gross - fee) : 0;
    m[o.cashAccountId] += conv(v, o.ccy || acc.currency, acc.currency);
  }
  return m;
}

// Foto completa del patrimonio en la moneda base. Se calcula una vez por pintado.
function portfolio() {
  const bal = balances();
  const inTotalAcc = a => a && a.includeInTotal !== false && !a.archived;
  const accounts = S.accounts.filter(a => !a.archived).map(a => ({ a, bal: bal[a.id] || 0, base: conv(bal[a.id] || 0, a.currency), inTotal: inTotalAcc(a) }));
  const watch = S.assets.filter(x => !x.archived && x.watch).map(x => ({ x, pr: priceOf(x) }));
  const assets = S.assets.filter(x => !x.archived && !x.watch).map(x => {
    const h = holding(x); const pr = priceOf(x);
    const pBase = pr ? conv(pr.p, pr.ccy) : null;
    const value = pBase != null ? h.qty * pBase : h.cost;
    const dayChg = (pr && pr.ch != null && isFinite(pr.ch) && pr.src !== 'manual') ? value - value / (1 + pr.ch / 100) : 0;
    const pnl = value - h.cost;
    const acc = x.accountId ? accById(x.accountId) : null;
    return { x, h, pr, pBase, value, dayChg, pnl, pnlPct: h.cost > 0 ? pnl / h.cost * 100 : null, priced: pBase != null, inTotal: !acc || inTotalAcc(acc) };
  });
  const cashTotal = sum(accounts.filter(r => r.inTotal), r => r.base);

  return {

/* ---------- bloques (grupos) ---------- */
function groupMembers(g, P) {
  const acc = new Set(), ast = new Set();
  for (const it of g.items || []) {
    if (it.t === 'all') { P.accounts.forEach(r => r.inTotal && acc.add(r.a.id)); P.assets.forEach(r => r.inTotal && ast.add(r.x.id)); }
    else if (it.t === 'cash') P.accounts.forEach(r => r.inTotal && acc.add(r.a.id));
    else if (it.t === 'kind') P.assets.forEach(r => r.x.kind === it.v && ast.add(r.x.id));
    else if (it.t === 'atype') P.accounts.forEach(r => r.a.type === it.v && acc.add(r.a.id));
    else if (it.t === 'account') { acc.add(it.id); P.assets.forEach(r => r.x.accountId === it.id && ast.add(r.x.id)); }
    else if (it.t === 'asset') ast.add(it.id);
  }
  return { acc, ast };
}
function groupValue(g, P) {
  const { acc, ast } = groupMembers(g, P);
  const cash = sum(P.accounts.filter(r => acc.has(r.a.id)), r => r.base);
  const inv = P.assets.filter(r => ast.has(r.x.id));
  return { value: cash + sum(inv, r => r.value), cash, inv: sum(inv, r => r.value), pnl: sum(inv, r => r.pnl), day: sum(inv, r => r.dayChg), n: acc.size + ast.size, acc, ast };
}
function groupItemsLabel(g) {
  const parts = (g.items || []).map(it => {
    if (it.t === 'all') return 'Todo';
    if (it.t === 'cash') return 'Todas las cuentas';
    if (it.t === 'kind') return it.v === 'crypto' ? 'Toda la cripto' : 'Todas las acciones';
    if (it.t === 'atype') return ACC_TYPES[it.v];
    if (it.t === 'account') return accById(it.id)?.name;
    if (it.t === 'asset') return assetById(it.id)?.symbol;
  }).filter(Boolean);
  return parts.join(' · ') || 'Vacío';
}

/* ---------- objetivos ---------- */
function goalCurrent(g, P) {
  const s = g.source || { t: 'manual' };
  if (s.t === 'nw') return P.nw;
  if (s.t === 'group') { const gr = groupById(s.id); return gr ? groupValue(gr, P).value : 0; }
  if (s.t === 'account') { const b = P.byAcc(s.id); return b.cash + b.inv; }
  if (s.t === 'kind') return sum(P.assets.filter(r => r.x.kind === s.v), r => r.value);
  return conv(Number(g.manual) || 0, g.ccy || S.settings.base);
}
function goalInfo(g, P) {
  const target = conv(Number(g.target) || 0, g.ccy || S.settings.base);
  const cur = goalCurrent(g, P);
  const pct = target > 0 ? clamp(cur / target * 100, 0, 100) : 0;
  const left = Math.max(0, target - cur);
  let months = null, perMonth = null;
  if (g.deadline) {
    const d = parseYmd(g.deadline), n = new Date();
    months = (d.getFullYear() - n.getFullYear()) * 12 + (d.getMonth() - n.getMonth()) + (d.getDate() >= n.getDate() ? 0 : -1) + 1;
    months = Math.max(0, months);
    perMonth = months > 0 ? left / months : left;
  }
  return { target, cur, pct, left, months, perMonth, done: target > 0 && cur >= target };
}

/* ---------- mes financiero (puede empezar el día que cobras) ---------- */
function FR(mk) {
  const st = Math.min(28, Math.max(1, S.settings.monthStart || 1));
  if (st === 1) return { from: mk + '-01', to: monthEnd(mk) };
  return { from: `${mk}-${pad(st)}`, to: addDays(`${addMonths(mk, 1)}-${pad(st)}`, -1) };
}
function mkOf(date) { const st = S.settings.monthStart || 1; const mk = monthKey(date); return st > 1 && Number(String(date).slice(8, 10)) < st ? addMonths(mk, -1) : mk; }
const curMk = () => mkOf(today());
function finLabel(mk) {
  if ((S.settings.monthStart || 1) === 1) return monthLabel(mk);
  const R = FR(mk); const a = parseYmd(R.from), b = parseYmd(R.to);
  return `${a.getDate()} ${MONTHS_S[a.getMonth()]} – ${b.getDate()} ${MONTHS_S[b.getMonth()]}${b.getFullYear() !== new Date().getFullYear() ? ' ' + b.getFullYear() : ''}`;
}
const finShort = mk => { const R = FR(mk); const d = parseYmd((S.settings.monthStart || 1) > 15 ? R.to : R.from); return MONTHS_S[d.getMonth()].slice(0, 3); };

/* ---------- flujo (ingresos / gastos) ---------- */
function periodRange(p, ref = today()) {
  const d = parseYmd(ref);
  if (p === 'day') return { from: ref, to: ref, prevFrom: addDays(ref, -1), prevTo: addDays(ref, -1), label: 'hoy', prevLabel: 'ayer', days: 1 };
  if (p === 'week') {
    const ws = S.settings.weekStart ?? 1; const wd = (d.getDay() - ws + 7) % 7; const from = addDays(ref, -wd); const to = addDays(from, 6);
    return { from, to, prevFrom: addDays(from, -7), prevTo: addDays(ref, -7), label: 'esta semana', prevLabel: 'la semana pasada', days: wd + 1 };
  }
  if (p === 'year') {
    const y = d.getFullYear();
    return { from: `${y}-01-01`, to: `${y}-12-31`, prevFrom: `${y - 1}-01-01`, prevTo: `${y - 1}-${ref.slice(5)}`, label: `en ${y}`, prevLabel: `a estas alturas de ${y - 1}`, days: Math.round((d - new Date(y, 0, 1)) / 864e5) + 1, prevCmpTo: true };
  }
  const mk = mkOf(ref); const R = FR(mk), PR = FR(addMonths(mk, -1));
  const days = Math.round((parseYmd(ref) - parseYmd(R.from)) / 864e5) + 1;
  const pt = addDays(PR.from, days - 1); const prevTo = pt < PR.to ? pt : PR.to;
  return { from: R.from, to: R.to, prevFrom: PR.from, prevTo, label: (S.settings.monthStart || 1) > 1 ? 'este periodo' : 'este mes', prevLabel: 'a estas alturas del anterior', days };
}
// Reparte un movimiento entre categorías (movimientos divididos)
function txParts(t) {
  if (Array.isArray(t.splits) && t.splits.length) return t.splits.map(p => ({ categoryId: p.categoryId, amount: Number(p.amount) || 0 }));
  return [{ categoryId: t.categoryId, amount: t.amount }];
}
const parentOf = id => { const c = catById(id); return c && c.parentId && catById(c.parentId) ? c.parentId : id; };
function flows(from, to, filter) {
  let inc = 0, exp = 0; const byCat = {}, byParent = {}, incCat = {}; const list = [];
  for (const t of S.txs) {
    if (t.date < from || t.date > to) continue;
    if (t.type !== 'income' && t.type !== 'expense') continue;
    if (t.excl) continue;
    const acc = accById(t.accountId); if (!acc) continue;
    if (filter && !filter(t)) continue;
    for (const p of txParts(t)) {
      const v = conv(p.amount, acc.currency);
      if (t.type === 'income') { inc += v; incCat[p.categoryId] = (incCat[p.categoryId] || 0) + v; }
      else { exp += v; byCat[p.categoryId] = (byCat[p.categoryId] || 0) + v; const pid = parentOf(p.categoryId); byParent[pid] = (byParent[pid] || 0) + v; }
    }
    list.push(t);
  }
  return { inc, exp, net: inc - exp, byCat, byParent, incCat, list, rate: inc > 0 ? (inc - exp) / inc * 100 : null };
}
// Gasto de una categoría (incluye sus subcategorías)
function catSpend(catId, from, to) {
  const ids = new Set([catId, ...S.categories.filter(c => c.parentId === catId).map(c => c.id)]);
  let v = 0;
  for (const t of S.txs) {
    if (t.type !== 'expense' || t.excl || t.date < from || t.date > to) continue;
    const a = accById(t.accountId); if (!a) continue;
    for (const p of txParts(t)) if (ids.has(p.categoryId)) v += conv(p.amount, a.currency);
  }
  return v;
}
// Presupuesto disponible con arrastre del sobrante (hasta 12 periodos atrás)
function budgetAvail(c, mk, depth = 0) {
  const b = Number(c.budget) || 0; if (!b) return 0;
  if (!c.rollover || depth >= 12) return b;
  const pm = addMonths(mk, -1); const R = FR(pm);
  if (S.createdAt && R.to < S.createdAt) return b;
  return b + (budgetAvail(c, pm, depth + 1) - catSpend(c.id, R.from, R.to));
}

/* ---------- recurrentes ---------- */
function nextDate(d, freq, interval = 1, anchor) {
  const x = parseYmd(d);
  if (freq === 'daily') { x.setDate(x.getDate() + interval); return ymd(x); }
  if (freq === 'weekly') { x.setDate(x.getDate() + 7 * interval); return ymd(x); }
  const day = anchor || x.getDate();
  let y = x.getFullYear(), m = x.getMonth();
  if (freq === 'yearly') y += interval; else { m += interval; y += Math.floor(m / 12); m = ((m % 12) + 12) % 12; }
  return `${y}-${pad(m + 1)}-${pad(Math.min(day, daysInMonth(y, m)))}`;
}
function runRecurring() {
  const t = today(); let n = 0;
  for (const r of S.recurring) {
    if (!r.active) continue;
    let guard = 0;
    while (r.next && r.next <= t && guard++ < 500) {
      if (r.end && r.next > r.end) { r.active = false; break; }
      const acc = accById(r.tpl.accountId);
      if (r.tpl.type === 'invest') {
        // plan de inversión: compra por importe fijo al precio conocido (en vivo o el último guardado)
        const a = assetById(r.tpl.assetId), px = a && priceOf(a);
        if (!a || !px || !px.p) break;   // sin precio aún: se reintenta en el próximo arranque
        const amt = conv(r.tpl.amount, acc ? acc.currency : 'EUR', px.ccy);
        a.ops.push({ id: uid(), side: 'buy', qty: amt / px.p, price: px.p, fee: 0, ccy: px.ccy, date: r.next, cashAccountId: acc ? acc.id : '', recId: r.id });
        n++;
      } else if (acc) { S.txs.push(Object.assign({}, r.tpl, { id: uid(), date: r.next, recId: r.id })); n++; }
      r.next = nextDate(r.next, r.freq, r.interval || 1, r.day);
    }
  }
  if (n) { save(); setTimeout(() => toast(`${n} movimiento${n > 1 ? 's' : ''} recurrente${n > 1 ? 's' : ''} añadido${n > 1 ? 's' : ''}`), 600); }
}

/* ---------- histórico ---------- */
function cashHistory(months = 12, endMk = curMk()) {
  const out = [];
  for (let i = months - 1; i >= 0; i--) {
    const mk = addMonths(endMk, -i); let end = FR(mk).to; if (end > today()) end = today();
    const b = balances(end);
    const v = sum(S.accounts.filter(a => a.includeInTotal !== false && !a.archived), a => conv(b[a.id] || 0, a.currency));
    out.push({ mk, v });
  }
  return out;
}
function recordSnapshot(P) {
  const d = today(); const v = Math.round(P.nw * 100) / 100; const c = S.settings.base;
  const last = S.snapshots[S.snapshots.length - 1];
  if (last && last.d === d) { last.v = v; last.c = c; } else S.snapshots.push({ d, v, c });
  if (S.snapshots.length > 1500) S.snapshots.splice(0, S.snapshots.length - 1500);
}
function nwSeries(days = 30) {
  const from = addDays(today(), -days);
  const snaps = S.snapshots.filter(s => s.d >= from).map(s => conv(s.v, s.c || S.settings.base));
  if (snaps.length >= 2) return { vals: snaps, kind: 'snap' };
  // sin histórico todavía: saldo en cuentas día a día (exacto) de los últimos días
  const vals = [];
  for (let i = Math.min(days, 30); i >= 0; i -= 2) { const b = balances(addDays(today(), -i)); vals.push(sum(S.accounts.filter(a => a.includeInTotal !== false && !a.archived), a => conv(b[a.id] || 0, a.currency))); }
  return { vals, kind: 'cash' };
}

function niceTicks(min, max, n = 3) {
  if (min === max) { const d = Math.abs(min) || 1; min -= d * 0.1; max += d * 0.1; }
  const span = max - min; const raw = span / n; const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= raw) || raw;
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step;
  const out = []; for (let v = lo; v <= hi + step / 2; v += step) out.push(Math.round(v / step) * step);
  return out;
}
function axisFmt(v) {
  const a = Math.abs(v);
  if (a >= 1e6) return nf('ax6', { maximumFractionDigits: 1 }).format(v / 1e6) + ' M';
  if (a >= 1e4) return nf('ax3', { maximumFractionDigits: 0 }).format(v / 1e3) + ' k';
  if (a >= 1e3) return nf('ax3b', { maximumFractionDigits: 1 }).format(v / 1e3) + ' k';
  return nf('ax0', { maximumFractionDigits: a < 10 ? 2 : 0 }).format(v);
}

  const w = 300, min = Math.min(...vals), max = Math.max(...vals), span = (max - min) || Math.abs(max) * 0.01 || 1;
  const pts = vals.map((v, i) => [i / (vals.length - 1) * w, (h - 4) - (v - min) / span * (h - 10)]);
  const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><path class="spark-area" d="${d} L${w} ${h} L0 ${h} Z"/><path class="spark-line" d="${d}" vector-effect="non-scaling-stroke"/></svg>`;
}

// Línea con ejes: series = [{label, v}]
function lineChart(series, o = {}) {
  if (!series || series.length < 2) return '';
  const W = 340, H = o.h || 170, L = 44, R = 10, T = 12, B = 22;
  const vals = series.map(s => s.v); const ticks = niceTicks(Math.min(...vals, o.zero ? 0 : Infinity), Math.max(...vals));
  const y0 = ticks[0], y1 = ticks[ticks.length - 1];
  const X = i => L + i / (series.length - 1) * (W - L - R);
  const Y = v => T + (1 - (v - y0) / ((y1 - y0) || 1)) * (H - T - B);
  const d = series.map((s, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(s.v).toFixed(1)).join(' ');
  const grid = ticks.map(t => `<line class="grid" x1="${L}" x2="${W - R}" y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}"/><text x="${L - 6}" y="${(Y(t) + 3).toFixed(1)}" text-anchor="end">${axisFmt(t)}</text>`).join('');
  const every = Math.ceil(series.length / 6);
  const xl = series.map((s, i) => (i % every === 0 || i === series.length - 1) && (i === series.length - 1 || series.length - 1 - i >= every / 2) ? `<text x="${X(i).toFixed(1)}" y="${H - 6}" text-anchor="middle">${esc(s.label)}</text>` : '').join('');
  const last = series[series.length - 1];
  const sc = o.scrub ? ` data-pts='${JSON.stringify(series.map((p, i) => [+X(i).toFixed(1), +Y(p.v).toFixed(1)]))}' data-top="${T}" data-bot="${H - B}"` : '';
  const scEls = o.scrub ? `<line class="scrub-l" x1="0" x2="0" y1="${T}" y2="${H - B}" visibility="hidden"/><circle class="scrub-c" r="4.5" cx="0" cy="0" visibility="hidden"/>` : '';
  const lnCls = o.cls ? ` ${o.cls}` : '';
  return `<svg class="chart${o.scrub ? ' scrubbable' : ''}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria || 'Gráfico de evolución')}"${sc}>${grid}<path class="ar${lnCls}" d="${d} L${X(series.length - 1).toFixed(1)} ${Y(y0).toFixed(1)} L${L} ${Y(y0).toFixed(1)} Z"/><path class="ln${lnCls}" d="${d}"/><circle class="end" cx="${X(series.length - 1).toFixed(1)}" cy="${Y(last.v).toFixed(1)}" r="4"/>${xl}${scEls}</svg>`;
}

// Barras dobles ingresos / gastos: data = [{label, inc, exp}]
function barsChart(data, o = {}) {
  const W = 340, H = o.h || 180, L = 44, R = 6, T = 10, B = 22;
  const max = Math.max(1, ...data.map(d => Math.max(d.inc, d.exp)));
  const ticks = niceTicks(0, max); const y1 = ticks[ticks.length - 1];
  const Y = v => T + (1 - v / y1) * (H - T - B);
  const gw = (W - L - R) / data.length, bw = Math.max(3, Math.min(12, gw * 0.34));
  const grid = ticks.map(t => `<line class="grid" x1="${L}" x2="${W - R}" y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}"/><text x="${L - 6}" y="${(Y(t) + 3).toFixed(1)}" text-anchor="end">${axisFmt(t)}</text>`).join('');
  const bars = data.map((d, i) => {
    const cx = L + gw * i + gw / 2;
    const bi = `<rect class="inc" x="${(cx - bw - 1).toFixed(1)}" y="${Y(d.inc).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0, Y(0) - Y(d.inc)).toFixed(1)}" rx="2"><title>${esc(d.label)} · ingresos ${fmt(d.inc)}</title></rect>`;
    const be = `<rect class="exp" x="${(cx + 1).toFixed(1)}" y="${Y(d.exp).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0, Y(0) - Y(d.exp)).toFixed(1)}" rx="2"><title>${esc(d.label)} · gastos ${fmt(d.exp)}</title></rect>`;
    return bi + be + `<text x="${cx.toFixed(1)}" y="${H - 6}" text-anchor="middle">${esc(d.label)}</text>`;
  }).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Ingresos y gastos por mes">${grid}${bars}</svg>`;
}

// Donut: segs = [{v, color}]
function donut(segs, centerTop, centerSub) {
  const total = sum(segs, s => s.v); const R = 42, C = 2 * Math.PI * R; let off = 0;
  const gap = segs.length > 1 ? 1.2 : 0;
  const arcs = total > 0 ? segs.map(s => { const len = s.v / total * C; const a = `<circle r="${R}" cx="50" cy="50" fill="none" stroke="${s.color}" stroke-width="13" stroke-dasharray="${Math.max(0, len - gap).toFixed(2)} ${(C - Math.max(0, len - gap)).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}"/>`; off += len; return a; }).join('')
    : `<circle r="${R}" cx="50" cy="50" fill="none" stroke="var(--surface-2)" stroke-width="13"/>`;
  return `<div class="donut"><svg viewBox="0 0 100 100" aria-hidden="true">${arcs}</svg><div class="c"><b class="amt">${centerTop}</b><span>${centerSub}</span></div></div>`;
}

function bars1(data, o = {}) {

  const Y = v => T + (1 - v / y1) * (H - T - B); const gw = (W - L - R) / data.length, bw = Math.max(4, Math.min(16, gw * 0.6));
  const avg = o.avg != null ? `<line class="zero" x1="${L}" x2="${W - R}" y1="${Y(o.avg).toFixed(1)}" y2="${Y(o.avg).toFixed(1)}"/>` : '';
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria || 'Evolución')}">${ticks.map(t => `<line class="grid" x1="${L}" x2="${W - R}" y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}"/><text x="${L - 6}" y="${(Y(t) + 3).toFixed(1)}" text-anchor="end">${axisFmt(t)}</text>`).join('')}${data.map((d, i) => { const cx = L + gw * i + gw / 2; return `<rect x="${(cx - bw / 2).toFixed(1)}" y="${Y(d.v).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0, Y(0) - Y(d.v)).toFixed(1)}" rx="3" fill="${o.color || 'var(--accent)'}" opacity="${i === data.length - 1 ? 1 : .7}"><title>${esc(d.label)} · ${fmt(d.v)}</title></rect><text x="${cx.toFixed(1)}" y="${H - 6}" text-anchor="middle">${esc(d.label)}</text>`; }).join('')}${avg}</svg>`;

  const prevNote = v => v > 0 ? `<span class="amt">${fmt(v)}</span> ${R.prevLabel}` : '&nbsp;';
  return `<section>
    <div class="sec-h"><h2>Resumen ${R.label}</h2><button class="link" data-go="stats">Análisis</button></div>${p === 'month' && (S.settings.monthStart || 1) > 1 ? `<div class="note" style="margin-top:-6px">${finLabel(curMk())}</div>` : ''}

    <div class="kpis">
      <div class="kpi"><div class="k-l"><span class="dot" style="--c:var(--pos)"></span>Ganado</div><div class="k-v pos amt">${fmt(cur.inc)}</div><div class="k-s">${prevNote(prev.inc)}</div></div>
      <div class="kpi"><div class="k-l"><span class="dot" style="--c:var(--neg)"></span>Gastado</div><div class="k-v amt">${fmt(cur.exp)}</div><div class="k-s">${dExp != null ? `<span class="${dExp > 0 ? 'neg' : 'pos'}">${fmtPct(dExp)}</span> vs ${R.prevLabel}` : prevNote(prev.exp)}</div></div>
      <div class="kpi"><div class="k-l">Balance</div><div class="k-v ${pcls(cur.net)} amt">${fmt(cur.net, null, { sign: true })}</div><div class="k-s">${cur.rate != null ? `Ahorras el ${fmtPct(cur.rate, false)}` : 'Sin ingresos en el periodo'}</div></div>

    </div>

  </section>`;
};
function goalSrcLabel(g) {

HOME.groups = P => `<section><div class="sec-h"><h2>Tus bloques</h2><button class="link" data-go="more/groups">Personalizar</button></div>
  <div class="groups">${S.groups.map(g => groupCard(g, P)).join('')}<button class="gcard add" data-action="group-new">+ Nuevo bloque</button></div></section>`;
function allocHtml(rows, total) {

  <div class="legend">${top.map(r => `<span><span class="dot" style="--c:${r.c}"></span>${esc(r.l)} ${Math.round(r.v / total * 100)} %</span>`).join('')}</div>`;
}
HOME.invest = P => {
  if (!P.assets.length) return `<section><div class="sec-h"><h2>Inversiones</h2></div>${emptyCard('Aún no tienes inversiones', 'Añade tu cripto o tus acciones y verás su valor en tiempo real y lo que ganas o pierdes.', '<div class="hstack" style="justify-content:center"><button class="btn sm" data-action="asset-new" data-kind="crypto">Añadir cripto</button><button class="btn sm" data-action="asset-new" data-kind="stock">Añadir acción o ETF</button></div>')}</section>`;
  const pnlPct = P.cost > 0 ? P.pnl / P.cost * 100 : null;
  const ranked = P.assets.filter(r => r.pnlPct != null && r.priced && r.h.qty > 0).sort((a, b) => b.pnlPct - a.pnlPct);
  const best = ranked[0], worst = ranked.length > 1 ? ranked[ranked.length - 1] : null;
  const cr = sum(P.assets.filter(r => r.x.kind === 'crypto'), r => r.value), st = sum(P.assets.filter(r => r.x.kind === 'stock'), r => r.value);
  const mini = (r, lbl) => `<button class="row" data-action="asset-open" data-id="${r.x.id}">${ico(assetTag(r.x), assetColor(r.x), 'txt')}<div class="row-m"><div class="row-t">${esc(r.x.name || r.x.symbol)}</div><div class="row-s">${lbl}</div></div><div class="row-r"><span class="chip ${pcls(r.pnl)}">${fmtPct(r.pnlPct)}</span><span class="row-s amt ${pcls(r.pnl)}">${fmt(r.pnl, null, { sign: true })}</span></div></button>`;
  return `<section><div class="sec-h"><h2>Rendimiento de inversiones</h2><button class="link" data-go="inv">Cartera</button></div>
    <div class="kpis">
      <div class="kpi"><div class="k-l">Valor actual</div><div class="k-v amt">${fmt(P.assetsTotal)}</div><div class="k-s">Has puesto <span class="amt">${fmt(P.cost)}</span></div></div>
      <div class="kpi"><div class="k-l">Rentabilidad</div><div class="k-v ${pcls(P.pnl)} amt">${fmt(P.pnl, null, { sign: true })}</div><div class="k-s ${pcls(P.pnl)}">${fmtPct(pnlPct)}</div></div>
      <div class="kpi"><div class="k-l">Hoy</div><div class="k-v ${pcls(P.dayChg)} amt">${fmt(P.dayChg, null, { sign: true })}</div><div class="k-s">${P.assetsTotal - P.dayChg > 0 ? fmtPct(P.dayChg / (P.assetsTotal - P.dayChg) * 100) : '&nbsp;'}</div></div>
      <div class="kpi"><div class="k-l">Ganancia realizada</div><div class="k-v ${pcls(P.realized)} amt">${fmt(P.realized, null, { sign: true })}</div><div class="k-s">de lo que ya vendiste</div></div>

HOME.accounts = P => {

function budgetRows(mk) {
  const R = FR(mk); const isCur = mk === curMk();
  const span = (parseYmd(R.to) - parseYmd(R.from)) / 864e5 + 1;
  const dayPct = isCur ? ((parseYmd(today()) - parseYmd(R.from)) / 864e5 + 1) / span * 100 : 100;
  const row = (id, icon, color, name, spent, avail, action) => {
    const pct = avail > 0 ? spent / avail * 100 : 100;
    const st = pct >= 100 ? 'neg' : pct > dayPct + 8 ? 'warn' : 'pos';
    const left = avail - spent;
    return `<button class="row" ${action} style="align-items:flex-start">${icon ? ico(esc(icon), color, 'sm') : ico(svg('gauge'), 'var(--accent)', 'sm')}<div class="row-m stack" style="gap:6px"><div class="hstack"><span class="row-t">${esc(name)}</span><span class="spacer"></span><span class="num small"><span class="amt">${fmt(spent)}</span> <span class="muted">/ <span class="amt">${fmt(avail, null, { dec: 0 })}</span></span></span></div>
      <div class="bar budget" style="--c:var(--${st})"><i style="width:${clamp(pct, 0, 100).toFixed(1)}%"></i>${isCur ? `<b style="left:${dayPct.toFixed(1)}%" title="Hoy"></b>` : ''}</div>
      <div class="row-s ${st === 'pos' ? '' : st}">${left >= 0 ? `Te quedan <span class="amt">${fmt(left)}</span>${isCur && dayPct < 100 ? ` · <span class="amt">${fmt(left / Math.max(1, Math.ceil(span * (1 - dayPct / 100))))}</span>/día` : ''}` : `Te has pasado <span class="amt">${fmt(-left)}</span>`}</div></div></button>`;
  };
  let html = '';
  const tot = Number(S.settings.budgetTotal) || 0;
  if (tot > 0) html += row('', '', '', 'Todo el gasto', flows(R.from, R.to).exp, tot, 'data-go="stats"');
  const bs = S.categories.filter(c => c.kind === 'expense' && c.budget > 0 && !c.hidden).map(c => { const avail = budgetAvail(c, mk); const spent = catSpend(c.id, R.from, R.to); return { c, spent, avail, pct: avail > 0 ? spent / avail : 9 }; }).sort((a, b) => b.pct - a.pct);
  html += bs.map(({ c, spent, avail }) => row(c.id, c.icon, c.color, c.name + (c.rollover && avail !== c.budget ? ` (${avail > c.budget ? '+' : '−'}${fmt(Math.abs(avail - c.budget), null, { dec: 0 })} arrastrado)` : ''), spent, avail, `data-action="cat-txs" data-id="${c.id}" data-month="${mk}"`)).join('');
  return html;
}

HOME.today = P => {
  const t = today(); const f = flows(t, t); const R = periodRange('month');
  const m = flows(R.from, t); const avg = m.exp / Math.max(1, R.days);
  const tot = Number(S.settings.budgetTotal) || 0;

  return `<section><div class="sec-h"><h2>Hoy</h2><span class="small muted">${dayLabel(t) === 'Hoy' ? cap(WEEKDAYS[new Date().getDay()]) + ', ' + shortDate(t) : ''}</span></div>

  <div class="kpi"><div class="k-l">${safe != null ? 'Puedes gastar hoy' : 'Ganado hoy'}</div><div class="k-v amt ${safe != null ? (safe - f.exp < 0 ? 'neg' : 'pos') : 'pos'}">${safe != null ? fmt(Math.max(0, safe - f.exp)) : fmt(f.inc)}</div><div class="k-s">${safe != null ? 'para cumplir tu presupuesto' : f.list.length + ' movimiento' + (f.list.length === 1 ? '' : 's')}</div></div></div></section>`;

/* ---------- divisas ---------- */
function exposure(P) {
  const m = {};
  const add = (code, native, base, kind) => { const e = m[code] || (m[code] = { code, native: 0, base: 0, kind }); e.native += native; e.base += base; };
  for (const r of P.accounts) if (r.inTotal) add(r.a.currency, r.bal, r.base, 'fiat');
  for (const r of P.assets) {
    if (!r.inTotal) continue;
    if (r.x.kind === 'crypto') add(r.x.symbol, r.h.qty, r.value, 'crypto');
    else { const c = (r.pr && r.pr.ccy) || r.x.quoteCcy || S.settings.base; add(c, conv(r.value, S.settings.base, c), r.value, 'fiat'); }
  }
  return Object.values(m).filter(e => Math.abs(e.base) > 0.004).sort((a, b) => b.base - a.base);
}
function fxDyn(P) {
  const base = S.settings.base; const ex = exposure(P); const tot = sum(ex, e => Math.max(0, e.base));
  const favs = S.settings.favCcy.filter(c => c !== base);
  const fx = S.cache.fx;
  return `<section><div class="sec-h"><h2>Tu dinero por moneda</h2></div>
    ${ex.length ? `<div class="list">${ex.map(e => `<div class="row">${ico(esc(e.code), e.kind === 'crypto' ? PALETTE[5] : PALETTE[1], 'txt')}<div class="row-m"><div class="row-t">${esc(CCY_NAMES[e.code] || e.code)}</div><div class="row-s">${tot > 0 ? Math.round(Math.max(0, e.base) / tot * 100) : 0} % de tu patrimonio</div></div><div class="row-r"><span class="num amt">${fmt(e.native, e.code)}</span>${e.code !== base ? `<span class="row-s amt">≈ ${fmt(e.base)}</span>` : ''}</div></div>`).join('')}</div>
    ${allocHtml(ex.map((e, i) => ({ l: e.code, v: Math.max(0, e.base), c: PALETTE[i % PALETTE.length] })), tot)}` : emptyCard('Sin datos', 'Añade cuentas o inversiones.')}
    <div class="note">Las acciones cuentan en la moneda en la que cotizan (una acción de EE. UU. es exposición al dólar).</div></section>
  <section><div class="sec-h"><h2>Tu patrimonio en…</h2></div>
    <div class="list">${favs.map(c => `<div class="row">${ico(esc(c), isFiat(c) ? PALETTE[1] : PALETTE[5], 'txt')}<div class="row-m"><div class="row-t">${esc(CCY_NAMES[c] || c)}</div><div class="row-s">${canConv(c) ? `1 ${base} = ${fmtRate(conv(1, base, c))} ${c}` : 'Sin cotización todavía'}</div></div><span class="num amt">${canConv(c) ? fmt(conv(P.nw, base, c), c) : '—'}</span><button class="icon-btn" data-action="fav-del" data-c="${esc(c)}" aria-label="Quitar ${esc(c)}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"/></svg></button></div>`).join('')}</div>
  </section>
  <section><div class="sec-h"><h2>Tipos de cambio</h2><button class="link" data-action="fx-refresh">Actualizar</button></div>
    <div class="tbl-wrap"><table><thead><tr><th>Moneda</th><th class="r">1 ${base} =</th><th class="r">1 unidad =</th></tr></thead><tbody>
    ${COMMON_CCY.filter(c => c !== base && canConv(c)).map(c => `<tr><td><b>${c}</b> <span class="muted">${esc(CCY_NAMES[c] || '')}</span></td><td class="r num">${fmtRate(conv(1, base, c))}</td><td class="r num">${fmt(conv(1, c, base), base, { dec: 4 })}</td></tr>`).join('')}

    <div class="note">${fx ? `Fuente: ${esc(fx.src)} · descargado ${ago(fx.t)}. <a href="https://www.exchangerate-api.com" target="_blank" rel="noopener">Rates By Exchange Rate API</a>` : 'Usando tipos aproximados hasta conectar con internet.'}</div>
  </section>`;
}

function parseCSV(text) {
  text = String(text).replace(/^﻿/, '');
  const sample = text.split(/\r?\n/).slice(0, 15).join('\n');
  let delim = ';', best = -1;
  for (const c of [';', ',', '\t', '|']) { const n = sample.split(c).length - 1; if (n > best) { best = n; delim = c; } }
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
    else if (ch === '"') q = true;
    else if (ch === delim) { row.push(cell); cell = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += ch;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(c => String(c).trim() !== ''));
}

  if ((m = s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/))) return ok(+m[1], +m[2], +m[3]);
  if ((m = s.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{2,4})/))) { let y = +m[3]; if (y < 100) y += 2000; return ok(y, +m[2], +m[1]); }
  if (/^\d{5}(\.\d+)?$/.test(s)) { const d = new Date(Math.round((+s - 25569) * 864e5)); return ok(d.getUTCFullYear(), d.getUTCMonth() + 1, d.getUTCDate()); }

}

    existing.add(`${t.date}|${sgn.toFixed(2)}`);
  }
  const rules = S.categories.map(c => ({ c, kws: String(c.keywords || '').toLowerCase().split(',').map(s => s.trim()).filter(Boolean) })).filter(r => r.kws.length);

const escapeRe = s => String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').trim();

/* ---------- reconocer cuenta y categoría a partir de texto ---------- */
function matchAccount(str, isCard) {
  const q = norm(str); if (!q) return null;
  const list = activeAccounts();
  const alias = a => norm(a.cardAlias).split(',').map(x => x.trim()).filter(Boolean);
  return list.find(a => alias(a).includes(q)) || list.find(a => norm(a.name) === q)
    || list.find(a => alias(a).some(x => q.includes(x) || x.includes(q)))
    || list.find(a => q.includes(norm(a.name)) || norm(a.name).includes(q))
    || (isCard ? list.find(a => { const d = q.match(/\d{4}/); return d && (a.cardAlias || '').includes(d[0]); }) : null) || null;
}
function findCat(name, kind) {
  const q = norm(name); if (!q) return null;
  const list = S.categories.filter(c => !kind || c.kind === kind);
  return list.find(c => norm(c.name) === q) || list.find(c => norm(c.name).includes(q) || q.includes(norm(c.name))) || null;
}
function guessCat(text, kind) {
  const q = norm(text); if (!q) return null;
  const list = S.categories.filter(c => c.kind === kind && !c.hidden);
  // primero las subcategorías (más concretas)
  const ordered = [...list.filter(c => c.parentId), ...list.filter(c => !c.parentId)];
  for (const c of ordered) for (const k of norm(c.keywords).split(',').map(x => x.trim()).filter(Boolean)) if (q.includes(k)) return c;
  return ordered.find(c => norm(c.name).length > 2 && q.includes(norm(c.name))) || null;
}
function prevCatFor(note, type) {
  const n = norm(note); if (!n) return null;
  const prev = sortTx(S.txs).find(x => x.type === type && norm(x.note) === n && x.categoryId);
  return prev ? catById(prev.categoryId) : null;
}

// «12,50 mercadona», «+1680 nómina», «3 café efectivo ayer»
function parseQuick(txt) {
  let s = String(txt || '').trim(); if (!s) return null;
  let type = 'expense';
  if (/^\+/.test(s) || /\b(ingreso|cobro|n[oó]mina|me pagan|me han pagado|me devuelven)\b/i.test(s)) type = 'income';
  const m = s.match(/[-+]?\d[\d.,]*/);
  const amount = m ? Math.abs(parseMoney(m[0])) : 0;
  let rest = m ? s.slice(0, m.index) + ' ' + s.slice(m.index + m[0].length) : s;
  rest = rest.replace(/€|\beuros?\b|\beur\b/gi, ' ').replace(/^\s*\+/, ' ');
  let date = null;
  if (/\banteayer\b/i.test(rest)) { date = addDays(today(), -2); rest = rest.replace(/\banteayer\b/i, ' '); }
  else if (/\bayer\b/i.test(rest)) { date = addDays(today(), -1); rest = rest.replace(/\bayer\b/i, ' '); }
  else rest = rest.replace(/\bhoy\b/i, ' ');
  let accountId = null;
  for (const a of activeAccounts()) {
    const names = [a.name, ...String(a.cardAlias || '').split(',')].map(x => x.trim()).filter(x => x.length > 2);
    const hit = names.find(nm => norm(rest).includes(norm(nm)));
    if (hit) { accountId = a.id; rest = rest.replace(new RegExp('\\b(con|en|desde)?\\s*' + escapeRe(hit), 'i'), ' '); break; }
  }
  if (!accountId && /\befectivo\b/i.test(rest)) { const c = activeAccounts().find(a => a.type === 'efectivo'); if (c) { accountId = c.id; rest = rest.replace(/\b(en|con)?\s*efectivo\b/i, ' '); } }
  const note = rest.replace(/\s+/g, ' ').replace(/^(de|en|con)\s+/i, '').trim();
  const c = prevCatFor(note, type) || guessCat(note, type);
  return { type, amount, note: note ? cap(note) : '', accountId, date, categoryId: c ? c.id : '' };
}

/* ---------- enlaces mision:// (Atajos) y #nuevo?… en la web ---------- */
function parseLink(raw) {
  const m = String(raw || '').trim().replace(/^[a-z][\w+.-]*:\/\//i, '').replace(/^#\/?/, '');
  const qi = m.indexOf('?');
  const path = (qi < 0 ? m : m.slice(0, qi)).replace(/^\/+|\/+$/g, '').toLowerCase();
  const q = new URLSearchParams(qi < 0 ? '' : m.slice(qi + 1));
  return { path, q, get: (...k) => { for (const x of k) { const v = q.get(x); if (v != null && String(v).trim() !== '') return String(v).trim(); } return ''; } };
}
const LINK_PATHS = ['nuevo', 'gasto', 'ingreso', 'transferencia', 'add', 'new', 'rapido', 'quick', 'plantilla', 'template', 'abrir', 'open', 'importar'];
// mision://importar?d=<JSON en base64url>: añade cuentas, activos y recurrentes sin tocar lo que ya hay.
// Sirve para cargar datos personales sin meterlos en el código (el repositorio es público).
// Cuentas: se emparejan por nombre (si existe, no se toca su saldo). Activos: por símbolo dentro de su cuenta.
function importPatch(d) {
  const json = new TextDecoder().decode(Uint8Array.from(atob(d.replace(/-/g, '+').replace(/_/g, '/').padEnd(Math.ceil(d.length / 4) * 4, '=')), c => c.charCodeAt(0)));
  const P = JSON.parse(json); let na = 0, ns = 0, nr = 0;
  const accByName = n => S.accounts.find(a => norm(a.name) === norm(n));
  for (const a of P.accounts || []) {
    if (accByName(a.name)) continue;
    S.accounts.push(Object.assign({ id: 'a_' + uid(), currency: 'EUR', initial: 0, color: PALETTE[S.accounts.length % PALETTE.length], icon: ACC_ICONS[a.type] || ACC_ICONS.otro, includeInTotal: true, archived: false, order: S.accounts.length, cardAlias: '', note: '' }, a)); na++;
  }
  for (const x of P.assets || []) {
    const acc = accByName(x.account); if (!acc) continue;
    if (S.assets.some(a => a.accountId === acc.id && a.symbol === x.symbol)) continue;
    const a = Object.assign({ id: 's_' + uid(), provider: 'auto', quoteCcy: 'EUR', archived: false, color: PALETTE[(S.assets.length + 3) % PALETTE.length] }, x, { accountId: acc.id });
    delete a.account; a.ops = (x.ops || []).map(o => Object.assign({ id: uid(), fee: 0, ccy: 'EUR', date: today() }, o));
    S.assets.push(a); ns++;
  }
  for (const r of P.recurring || []) {
    const acc = accByName(r.account), asset = r.asset && S.assets.find(a => a.symbol === r.asset);
    if (!acc || S.recurring.some(x => x.name === r.name)) continue;
    const tpl = Object.assign({ tags: [] }, r.tpl, { accountId: acc.id }, asset ? { assetId: asset.id } : {});
    S.recurring.push({ id: 'r_' + uid(), name: r.name, tpl, freq: r.freq, interval: r.interval || 1, day: r.day, next: r.next, end: '', active: true }); nr++;
  }
  S.demo = false; saveNow(); go('home', { reset: true }); if (typeof restartFeeds === 'function') restartFeeds();
  toast(na + ns + nr ? `Importado: ${na} cuenta${na === 1 ? '' : 's'}, ${ns} activo${ns === 1 ? '' : 's'}${nr ? `, ${nr} recurrente${nr === 1 ? '' : 's'}` : ''}` : 'Ya lo tenías todo, no se ha cambiado nada');
}
const isAppLink = raw => LINK_PATHS.includes(parseLink(raw).path.split('/')[0]);
function handleLink(raw) {

  if (p === 'importar') {
