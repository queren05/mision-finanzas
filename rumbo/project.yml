name: Rumbo
options:
  bundleIdPrefix: es.david
  developmentLanguage: es
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  Rumbo:
    type: application
    platform: iOS
    sources: [Rumbo]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: es.david.rumbo
        PRODUCT_NAME: Rumbo
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_LANGUAGE: es
        INFOPLIST_KEY_CFBundleDisplayName: Rumbo
        INFOPLIST_KEY_CFBundleDevelopmentRegion: es
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Para que solo tú puedas abrir Rumbo."
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: "Para enseñarte tu agenda de hoy en el panel y en el briefing diario."
        INFOPLIST_KEY_NSCameraUsageDescription: "Para escanear tus documentos y guardarlos en tu segundo cerebro."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Para guardar fotos de documentos y referencias de tu marca."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
