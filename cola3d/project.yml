name: Cola3D
options:
  bundleIdPrefix: es.david
  developmentLanguage: es
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  Cola3D:
    type: application
    platform: iOS
    sources: [Cola3D]
    info:
      path: Cola3D/Info.plist
      properties:
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [es.david.cola3d.mirar]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: es.david.cola3d
        PRODUCT_NAME: Cola3D
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_LANGUAGE: es
        INFOPLIST_KEY_CFBundleDisplayName: Cola 3D
        INFOPLIST_KEY_CFBundleDevelopmentRegion: es
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Para subir fotos de cómo han quedado las piezas."
        INFOPLIST_KEY_NSCameraUsageDescription: "Para hacer fotos de cómo han quedado las piezas."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
