name: FinDeMes
options:
  bundleIdPrefix: es.david
  developmentLanguage: es
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.2"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  FinDeMes:
    type: application
    platform: iOS
    sources: [FinDeMes]
    info:
      path: FinDeMes/Info.plist
      properties:
        UIAppFonts: [LilitaOne-Regular.ttf, CourierPrime-Regular.ttf, CourierPrime-Bold.ttf]
        CADisableMinimumFrameDurationOnPhone: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: es.david.findemes
        PRODUCT_NAME: FinDeMes
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_LANGUAGE: es
        INFOPLIST_KEY_CFBundleDisplayName: "Fin de Mes"
        INFOPLIST_KEY_CFBundleDevelopmentRegion: es
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
