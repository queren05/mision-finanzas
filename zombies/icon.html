<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas,img{display:block;position:fixed;left:0;top:0}</style></head><body>
<!-- Icono: sirve la carpeta zombies/ con un servidor web, abre icon.html en un navegador con WebGL y guarda el render de 1024 px como resources/icon.png -->
<img src="/slow?s=14" style="width:1px;height:1px" onerror="this.remove()">
<script type="module">
import * as THREE from './www/lib/three.module.min.js';
import { GLTFLoader } from './www/lib/GLTFLoader.js';
import { Shrimp } from './www/modelos.js';
const S = 1024, r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); r.setPixelRatio(1); r.setSize(S, S); document.body.appendChild(r.domElement);
r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 1.2;
const sc = new THREE.Scene();
const c = document.createElement('canvas'); c.width = 4; c.height = 256; const x = c.getContext('2d'); const g = x.createLinearGradient(0, 0, 0, 256); g.addColorStop(0, '#12051c'); g.addColorStop(.55, '#5a0c1a'); g.addColorStop(1, '#ff4a2a'); x.fillStyle = g; x.fillRect(0, 0, 4, 256);
const bg = new THREE.CanvasTexture(c); bg.colorSpace = THREE.SRGBColorSpace; sc.background = bg;
sc.add(new THREE.HemisphereLight(0xb0a0ff, 0x401010, 1.6));
const key = new THREE.DirectionalLight(0xffe0c0, 3); key.position.set(2, 3, 5); sc.add(key);
const rim = new THREE.DirectionalLight(0xff3a3a, 4); rim.position.set(-3, 2, -4); sc.add(rim);
const green = new THREE.PointLight(0x3aff5a, 2, 2.5, 1.5); sc.add(green);
const moon = new THREE.Mesh(new THREE.CircleGeometry(.6, 48), new THREE.MeshBasicMaterial({ color: 0xffe6b0 })); moon.position.set(1.7, 2.2, -6); sc.add(moon);
const L = new GLTFLoader(), load = u => new Promise(ok => L.load(u, ok));
const [zom, gun, gamba] = await Promise.all([load('./www/models/k/character-zombie.glb'), load('./www/models/k/blaster-l.glb'), load('./www/models/char/gamba.glb')]);
for (const [px, pz, ry, s] of [[-1.05, -1.3, .5, 1], [1.15, -1.6, -.45, .95]]) {
  const o = zom.scene.clone(true); o.scale.setScalar(2.2 * s); o.position.set(px, -1.15, pz); o.rotation.y = ry; sc.add(o);
  const mx = new THREE.AnimationMixer(o); const a = mx.clipAction(zom.animations.find(a => a.name === 'walk')); a.play(); mx.update(.35);
  o.traverse(m => { if (m.name === 'arm-left' || m.name === 'arm-right') m.rotation.x = -1.4; });
}
const sh = new Shrimp({ gamba }); await sh.use('gamba'); const Lg = 1.45;
sh.cur.wrap.rotation.x = 1.42; sh.cur.wrap.position.set(0, Lg * .5, .05);
sh.root.scale.setScalar(1.55 / Lg); sh.root.position.set(-.05, -1.15, .6); sh.root.rotation.y = Math.PI - 1.05; sc.add(sh.root); sh.pose(0, 'idle', 0, .016);
const gm = gun.scene.clone(true); gm.scale.setScalar(1.5); gm.position.set(.42, -.22, 1.05); gm.rotation.set(-.1, -1.05, .05); sc.add(gm);
green.position.set(.2, -.1, 1.8);
const ground = new THREE.Mesh(new THREE.CircleGeometry(4.5, 48), new THREE.MeshStandardMaterial({ color: 0x2a1418, roughness: 1 })); ground.rotation.x = -Math.PI / 2; ground.position.set(0, -1.15, -.5); sc.add(ground);

const cam = new THREE.PerspectiveCamera(36, 1, .1, 50); cam.position.set(0, .35, 5.0); cam.lookAt(0, -.1, 0);
r.render(sc, cam);
const im = new Image(); im.src = r.domElement.toDataURL('image/png'); document.body.appendChild(im); document.title = 'LISTO';
</script></body></html>
