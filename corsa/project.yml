name: MiCorsa
options:
  bundleIdPrefix: es.david
  developmentLanguage: es
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  MiCorsa:
    type: application
    platform: iOS
    sources: [Corsa]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: es.david.corsa
        PRODUCT_NAME: MiCorsa
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_LANGUAGE: es
        INFOPLIST_KEY_CFBundleDisplayName: "Mi Corsa"
        INFOPLIST_KEY_CFBundleDevelopmentRegion: es
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
