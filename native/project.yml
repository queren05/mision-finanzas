name: Caudal
options:
  bundleIdPrefix: es.david
  developmentLanguage: es
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "3.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  Caudal:
    type: application
    platform: iOS
    sources: [Caudal, Shared]
    dependencies:
      - target: CaudalWidgets
    entitlements:
      path: Caudal/Caudal.entitlements
      properties:
        com.apple.security.application-groups: [group.es.david.caudal]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: es.david.caudal
        PRODUCT_NAME: Caudal
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Caudal
        INFOPLIST_KEY_CFBundleDevelopmentRegion: es
        DEVELOPMENT_LANGUAGE: es
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Para que solo tú puedas abrir Caudal."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
  CaudalWidgets:
    type: app-extension
    platform: iOS
    sources: [Widgets, Shared]
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Caudal
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/Widgets.entitlements
      properties:
        com.apple.security.application-groups: [group.es.david.caudal]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: es.david.caudal.widgets
        PRODUCT_NAME: CaudalWidgets
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        DEVELOPMENT_LANGUAGE: es
