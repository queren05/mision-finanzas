<body>
<header class="top" id="top">
  <div class="top-in">
    <button class="icon-btn back-btn" id="backBtn" data-action="back" aria-label="Volver" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <h1 id="viewTitle">Resumen</h1>
    <button class="live" id="liveBtn" data-action="price-status" aria-label="Estado de los precios"><i></i><span id="liveTxt">Precios</span></button>
    <button class="icon-btn" data-action="toggle-theme" aria-label="Cambiar tema" id="themeBtn"></button>
    <button class="icon-btn" data-action="privacy" aria-label="Ocultar importes" id="privacyBtn"></button>
  </div>
</header>
<div class="banner" id="demoBanner" hidden>
  <div><span><b>Datos de ejemplo.</b> Pruébalo todo y, cuando quieras, empieza con los tuyos.</span>
  <button class="btn sm" data-action="start-fresh">Empezar de cero</button></div>
</div>
<main id="view" aria-live="polite"></main>
<button class="fab" id="fab" data-action="add-tx" aria-label="Añadir movimiento">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>
<nav class="tabs" aria-label="Secciones">
  <div class="tabs-in">
    <button class="tab" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="4.5" rx="1.8"/><rect x="13.5" y="11" width="7" height="9.5" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/></svg>Resumen</button>
    <button class="tab" data-tab="txs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1.2" fill="currentColor"/><circle cx="4" cy="12" r="1.2" fill="currentColor"/><circle cx="4" cy="18" r="1.2" fill="currentColor"/></svg>Movimientos</button>
    <button class="tab" data-tab="inv"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5.5-5.5 4 4L21 7"/><path d="M15 7h6v6"/></svg>Inversiones</button>
    <button class="tab" data-tab="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 9 9h-9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg>Análisis</button>
    <button class="tab" data-tab="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="5" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="19" cy="12" r="1.6" fill="currentColor"/></svg>Más</button>
  </div>
</nav>
<div id="sheetWrap" hidden>
  <div class="scrim" data-action="close-sheet"></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-grip"></div>
    <div class="sheet-head"><h2 id="sheetTitle"></h2>
      <button class="icon-btn" data-action="close-sheet" aria-label="Cerrar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div id="sheetBody"></div>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="fileIn" hidden>
