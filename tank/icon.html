<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas,img{display:block;position:fixed;left:0;top:0}</style></head><body>
<!-- Icono: sirve la carpeta tank/ con un servidor web, abre icon.html en un navegador con WebGL y guarda el render de 1024 px como resources/icon.png -->
<img src="/slow?s=14" style="width:1px;height:1px" onerror="this.remove()">
<script type="module">
import * as THREE from './www/lib/three.module.min.js';
import { GLTFLoader } from './www/lib/GLTFLoader.js';
import { ShrimpActor } from './www/gambas.js';
import { SPECIES } from './www/datos.js';
const S = 1024, r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); r.setPixelRatio(1); r.setSize(S, S); document.body.appendChild(r.domElement);
r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.ACESFilmicToneMapping;
const sc = new THREE.Scene();
const c = document.createElement('canvas'); c.width = 256; c.height = 256; const x = c.getContext('2d'); const g = x.createRadialGradient(128, 70, 10, 128, 128, 200); g.addColorStop(0, '#7fe0ff'); g.addColorStop(.5, '#1f8ad0'); g.addColorStop(1, '#0b3a66'); x.fillStyle = g; x.fillRect(0, 0, 256, 256);
for (let i = 0; i < 5; i++) { x.fillStyle = 'rgba(255,255,255,.08)'; x.beginPath(); x.moveTo(60 + i * 40, 0); x.lineTo(90 + i * 40, 0); x.lineTo(40 + i * 50, 256); x.lineTo(20 + i * 50, 256); x.fill(); }
const bg = new THREE.CanvasTexture(c); bg.colorSpace = THREE.SRGBColorSpace; sc.background = bg;
sc.add(new THREE.HemisphereLight(0xffffff, 0x335577, 2)); const d = new THREE.DirectionalLight(0xffffff, 2.5); d.position.set(1, 3, 3); sc.add(d);
const gamba = await new Promise(ok => new GLTFLoader().load('./www/models/gamba.glb', ok));
const src = { gamba };
const a = new ShrimpActor(src, SPECIES[1], { uid: 1 }); a.root.position.set(.02, -.1, 0); a.root.rotation.y = -1.75; a.pose(.4, 0, true); sc.add(a.root);
const b2 = new ShrimpActor(src, SPECIES[2], { uid: 2 }); b2.root.position.set(-.3, .22, -.6); b2.root.rotation.y = 1.4; b2.pitchG.rotation.x = .3; b2.pose(1, 0, true); sc.add(b2.root);
const sand = new THREE.Mesh(new THREE.CircleGeometry(2, 40), new THREE.MeshStandardMaterial({ color: 0xf0d8a0 })); sand.rotation.x = -Math.PI / 2; sand.position.y = -.12; sc.add(sand);
for (let i = 0; i < 6; i++) { const geo = new THREE.PlaneGeometry(.06, .9, 1, 8); geo.translate(0, .45, 0); const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: [0x3aa85a, 0x2a9a4a, 0x5ac86a][i % 3], side: THREE.DoubleSide })); m.position.set((i < 3 ? -.55 : .5) + i * .04, -.12, -.3); m.rotation.z = (i % 2 ? .15 : -.12); sc.add(m); }
for (let i = 0; i < 9; i++) { const s = new THREE.Mesh(new THREE.SphereGeometry(.025 + Math.random() * .03, 16, 12), new THREE.MeshStandardMaterial({ color: 0xeaffff, transparent: true, opacity: .55, roughness: 0 })); s.position.set(.42 + Math.sin(i) * .06, .1 + i * .09, .1); sc.add(s); }
const cam = new THREE.PerspectiveCamera(30, 1, .01, 20); cam.position.set(0, .5, 2.7); cam.lookAt(0, .2, 0);
r.render(sc, cam); const im = new Image(); im.src = r.domElement.toDataURL(); document.body.appendChild(im); document.title = 'LISTO';
</script></body></html>
