name: Vitalidad
options:
  bundleIdPrefix: com.david
  developmentLanguage: es
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  Vitalidad:
    type: application
    platform: iOS
    sources: [Vitalidad, Shared]
    dependencies:
      - target: VitalidadWidgets
    entitlements:
      path: Vitalidad/Vitalidad.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
    info:
      path: Vitalidad/Info.plist
      properties:
        UIRequiredDeviceCapabilities: [healthkit]
        CFBundleURLTypes:
          - CFBundleURLName: com.david.salud
            CFBundleURLSchemes: [vitalidad]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.david.salud
        PRODUCT_NAME: Vitalidad
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_LANGUAGE: es
        INFOPLIST_KEY_CFBundleDisplayName: Vitalidad
        INFOPLIST_KEY_CFBundleDevelopmentRegion: es
        INFOPLIST_KEY_NSHealthShareUsageDescription: "Vitalidad lee tu sueño, tu pulso, tu actividad y lo que comes para explicarte cómo estás, comparándote siempre contigo mismo. Solo salen del iPhone si le preguntas al entrenador con IA."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "Vitalidad solo guarda en Salud las comidas y el agua que apuntas en la app."
        INFOPLIST_KEY_NSCameraUsageDescription: "Para escanear el código de barras de los alimentos y hacer fotos a tu plato."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Para elegir una foto de tu plato."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
  VitalidadWidgets:
    type: app-extension
    platform: iOS
    sources: [Widgets, Shared]
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Vitalidad
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.david.salud.widgets
        PRODUCT_NAME: VitalidadWidgets
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        DEVELOPMENT_LANGUAGE: es
