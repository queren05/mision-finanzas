<!doctype html>
<!-- Fuente del icono de Chibimon: se captura a 1024x1024 con firefox --headless --screenshot → resources/icon.png -->
<html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1024px;height:1024px;overflow:hidden;background:radial-gradient(60% 50% at 25% 20%,#ffd9e6,transparent 70%),radial-gradient(60% 50% at 85% 30%,#d9ecff,transparent 70%),radial-gradient(70% 60% at 50% 100%,#e2f7d9,transparent 70%),#fff4e6}
img{position:absolute;filter:drop-shadow(0 18px 18px rgba(74,50,38,.25))}
</style><script src="www/sprites.js"></script></head><body>
<script>
loadSprites('www/criaturas.jpg').then(() => {
  const P = [['hoja:1', 40, 520, 470], ['agua:1', 520, 560, 460], ['rayo:1', 110, 90, 420], ['fuego:1', 520, 70, 440]];
  for (const [id, x, y, w] of P) { const i = new Image(); i.src = SPRITES[id]; i.style.left = x + 'px'; i.style.top = y + 'px'; i.style.width = w + 'px'; document.body.appendChild(i); }
});
</script></body></html>
