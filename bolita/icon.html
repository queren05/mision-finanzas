<!doctype html>

<html><head><meta charset="utf-8"><style>

  <filter id="fur" x="-15%" y="-15%" width="130%" height="130%">

    <feComposite in="sh" in2="d" operator="in" result="sh2"/>
    <feGaussianBlur in="d" stdDeviation="2.2" result="halo"/><feMerge><feMergeNode in="halo"/><feMergeNode in="d"/><feMergeNode in="sh2"/><feMergeNode in="hl2"/></feMerge>

  <radialGradient id="ao" cx="50%" cy="100%" r="70%"><stop offset="0" stop-color="#000" stop-opacity=".28"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
