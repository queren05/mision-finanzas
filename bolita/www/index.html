<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Chibimon</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffe9d2">
<style>
/* Chibimon: mascota virtual que evoluciona. Capas: habitación ilustrada con su decoración (rooms.js)
   → criatura (sprites.js, ilustraciones de David) → interfaz de cristal líquido.
   Pantallas a pantalla completa aparte: #stage (huevo, evolución) y #game (6 minijuegos).
   Estado en localStorage ('chibimon.v2'). */
:root{
  --ink:#3d2447; --ink2:#8a6f93; --pink:#ff5fa2; --violet:#8f6bff; --sun:#ffc93c; --mint:#3fd0a4; --sky:#4db8ff; --bad:#ff5d6c;
  --grad:linear-gradient(135deg,#ff6fa8,#8f6bff);
  --glass:rgba(255,255,255,.40); --glass2:rgba(255,255,255,.66); --edge:rgba(255,255,255,.82); --shade:rgba(110,50,120,.18);
  --blur:saturate(1.9) blur(22px); --f:ui-rounded,"SF Pro Rounded","Nunito",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:#ffe9d2;color:var(--ink);font:700 15px/1.3 var(--f);overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
.glass{background:linear-gradient(180deg,var(--glass2),var(--glass));border:1px solid var(--edge);box-shadow:inset 0 1px 0 #fff,inset 0 -1px 0 rgba(255,255,255,.35),0 12px 30px var(--shade);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
#room{position:fixed;inset:0}
#room svg{width:100%;height:100%;display:block}
.dark{position:fixed;inset:0;background:radial-gradient(60% 40% at 50% 70%,rgba(40,20,90,.35),rgba(20,10,50,.78));opacity:0;pointer-events:none;transition:opacity .6s;z-index:1}
.dark.on{opacity:1}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:calc(env(safe-area-inset-top,0px) + 6px);z-index:2}
.top{display:flex;align-items:center;gap:10px;margin:0 12px;padding:8px 10px 8px 8px;border-radius:26px}
.avatar{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#fff,#ffe3f1);position:relative;flex:none;box-shadow:inset 0 0 0 2px #fff,0 4px 10px var(--shade)}
.avatar img{position:absolute;inset:2px;width:44px;height:44px;object-fit:contain}
.avatar .lv{position:absolute;right:-6px;bottom:-6px;min-width:26px;height:22px;padding:0 5px;border-radius:11px;background:var(--grad);color:#fff;font-size:12px;display:grid;place-items:center;border:2px solid #fff}
.who{flex:1;min-width:0;text-align:left}
.who b{display:block;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{display:block;font-size:11px;color:var(--ink2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xp{height:7px;border-radius:4px;background:rgba(61,36,71,.1);margin-top:4px;overflow:hidden}
.xp i{display:block;height:100%;background:var(--grad);border-radius:4px;transition:width .5s}
.coins{display:flex;align-items:center;gap:5px;padding:8px 12px;border-radius:999px;font-weight:900;font-variant-numeric:tabular-nums;background:linear-gradient(180deg,#fff7d6,#ffe79a);box-shadow:inset 0 1px 0 #fff,0 4px 10px rgba(255,190,40,.3)}
.coins.bump{animation:bump .35s}
@keyframes bump{50%{transform:scale(1.18)}}
.needs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:8px 12px 0;padding:8px;border-radius:24px}
.need{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--ink2)}
.ring{position:relative;width:44px;height:44px;display:grid;place-items:center;font-size:19px}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:5}
.ring .bg{stroke:rgba(61,36,71,.1)}
.ring .fg{stroke-linecap:round;transition:stroke-dashoffset .6s,stroke .6s}
.need.low .ring{animation:wig 1.2s infinite}
@keyframes wig{0%,100%{transform:rotate(0)}10%{transform:rotate(-9deg)}20%{transform:rotate(9deg)}30%{transform:rotate(0)}}
.scene{position:relative;flex:1;min-height:0}
.pet{position:absolute;left:50%;bottom:3%;width:min(80vw,350px);aspect-ratio:1;transform:translateX(-50%);touch-action:none}
.pet-b{width:100%;height:100%;animation:breathe 3.4s ease-in-out infinite;transform-origin:50% 94%}
@keyframes breathe{50%{transform:scale(1.025,.975)}}
.pet-s{width:100%;height:100%;transform-origin:50% 94%}
.pet-s.sq{animation:sq .28s}
@keyframes sq{40%{transform:scale(1.14,.86)}100%{transform:none}}
.pet-s.hop{animation:hop .55s}
@keyframes hop{30%{transform:translateY(-20%) scale(.94,1.08)}60%{transform:scale(1.08,.92)}100%{transform:none}}
.pet-s.spin{animation:spin2 .7s}
@keyframes spin2{50%{transform:translateY(-14%) rotate(180deg)}100%{transform:rotate(360deg)}}
.art-img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none;-webkit-user-drag:none}
.pet .art-img{transition:transform .3s,filter .4s;filter:drop-shadow(0 14px 12px rgba(80,30,80,.25))}
.pet.sleep .art-img{filter:brightness(.78) saturate(.8) drop-shadow(0 10px 12px rgba(80,30,80,.25))}
.pet.dirty .art-img{filter:sepia(.4) brightness(.93) drop-shadow(0 10px 12px rgba(80,30,80,.25))}
.pet .flies{position:absolute;right:8%;top:6%;font-size:24px;animation:wig 1.4s infinite}
.pet .shadowE{position:absolute;left:18%;right:18%;bottom:2%;height:8%;border-radius:50%;background:radial-gradient(closest-side,rgba(80,30,80,.3),transparent)}
.bubble{position:absolute;left:50%;top:2%;transform:translate(-50%,-6px) scale(.85);opacity:0;padding:9px 16px;border-radius:20px;font-weight:800;white-space:nowrap;transition:opacity .2s,transform .25s;pointer-events:none;z-index:5;max-width:88%;overflow:hidden;text-overflow:ellipsis}
.bubble.show{opacity:1;transform:translate(-50%,0) scale(1)}
.zzz{position:absolute;left:62%;top:22%;font-weight:900;font-size:26px;color:#fff;z-index:4;pointer-events:none;opacity:0;text-shadow:0 2px 8px rgba(0,0,0,.3)}
.zzz.on{animation:zzz 2.6s infinite}
@keyframes zzz{0%{opacity:0;transform:translate(0,0) scale(.6)}30%{opacity:1}100%{opacity:0;transform:translate(30px,-70px) scale(1.3)}}
.fx{position:fixed;inset:0;pointer-events:none;z-index:6;overflow:hidden}
.pop{position:absolute;font-size:22px;font-weight:900;animation:rise 1s forwards;text-shadow:0 2px 0 #fff,0 0 8px #fff}
@keyframes rise{to{transform:translateY(-70px);opacity:0}}
.heart{position:absolute;font-size:24px;animation:heart 1.2s forwards}
@keyframes heart{to{transform:translate(var(--dx),-110px) scale(1.4);opacity:0}}
.toyfly{position:absolute;font-size:46px;animation:toy 1.2s ease-in-out forwards;filter:drop-shadow(0 6px 6px rgba(0,0,0,.2))}
@keyframes toy{0%{transform:translate(0,0) rotate(0)}40%{transform:translate(var(--dx),-140px) rotate(200deg)}100%{transform:translate(0,0) rotate(360deg);opacity:0}}
.foam{position:absolute;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#eef7ff 55%,#c9e2f7);box-shadow:inset -2px -3px 5px rgba(120,160,210,.35);pointer-events:none;animation:foamIn .25s}
@keyframes foamIn{from{transform:scale(0)}}
.drop{position:absolute;width:4px;height:16px;border-radius:2px;background:linear-gradient(#cfeeff,#4db8ff);animation:fall .8s linear forwards}
@keyframes fall{to{transform:translateY(460px);opacity:.2}}
.drag-food{position:fixed;font-size:56px;pointer-events:none;z-index:50;transform:translate(-50%,-50%);filter:drop-shadow(0 8px 10px rgba(0,0,0,.25))}
.confetti{position:absolute;width:9px;height:14px;border-radius:2px;animation:conf 1.6s ease-in forwards}
@keyframes conf{to{transform:translate(var(--dx),110vh) rotate(720deg)}}
.tray{margin:0 12px 8px;padding:10px;border-radius:28px;display:flex;flex-direction:column;gap:8px}
.tray-h{display:flex;justify-content:space-between;align-items:center;padding:0 4px;font-size:12.5px;color:var(--ink2);gap:8px}
.tray-h b{color:var(--ink);font-size:15.5px;white-space:nowrap}
.scroller{display:flex;gap:9px;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.item{flex:none;width:72px;height:80px;border-radius:20px;background:linear-gradient(180deg,#fff,#fff4fa);border:1px solid #fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;position:relative;touch-action:none;box-shadow:0 5px 12px var(--shade)}
.item .e{font-size:32px;line-height:1.1}
.item .q{position:absolute;top:4px;right:5px;font-size:11px;font-weight:900;background:var(--grad);color:#fff;border-radius:999px;padding:1px 6px}
.item .p{font-size:11px;color:var(--ink2);font-weight:800;max-width:64px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item.cool{opacity:.45}
.item:active{transform:scale(.94)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:48px;padding:0 16px;border-radius:999px;background:linear-gradient(180deg,#fff,#fff3f9);border:1px solid #fff;font-weight:900;box-shadow:0 5px 14px var(--shade),inset 0 1px 0 #fff;white-space:nowrap}
.btn.big{min-height:54px;font-size:16.5px}
.btn.acc{background:var(--grad);color:#fff;border-color:rgba(255,255,255,.5);box-shadow:0 8px 22px rgba(160,80,220,.38),inset 0 1px 0 rgba(255,255,255,.5)}
.btn.sm{min-height:36px;padding:0 13px;font-size:13px}
.btn[disabled]{opacity:.45}
.btn:active{transform:scale(.95)}
.row{display:flex;gap:9px}
.row > *{flex:1}
.games{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-height:196px;overflow-y:auto}
.game{border-radius:20px;padding:9px 10px;background:linear-gradient(180deg,#fff,#fff6fb);border:1px solid #fff;text-align:left;display:flex;align-items:center;gap:9px;box-shadow:0 5px 12px var(--shade)}
.game .e{font-size:24px;width:40px;height:40px;border-radius:14px;display:grid;place-items:center;flex:none}
.game b{display:block;font-size:13.5px}
.game span{font-size:11px;color:var(--ink2)}
.game:active{transform:scale(.96)}
.hint{font-size:12.5px;color:var(--ink2);text-align:center;padding:4px 8px}
.nav{display:grid;grid-template-columns:repeat(5,1fr);margin:0 12px calc(8px + env(safe-area-inset-bottom,0px));padding:6px;border-radius:999px}
.nav button{height:52px;border-radius:999px;font-size:24px;display:grid;place-items:center;transition:background .25s;position:relative}
.nav button[aria-current="true"]{background:linear-gradient(180deg,#fff,#ffeaf5);box-shadow:0 4px 12px var(--shade),inset 0 1px 0 #fff}
.nav .dot{position:absolute;top:7px;right:20%;width:10px;height:10px;border-radius:50%;background:var(--bad);border:2px solid #fff;display:none}
.nav button.alert .dot{display:block}
.sheet-wrap{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;background:rgba(61,36,71,.25);opacity:0;pointer-events:none;transition:opacity .2s}
.sheet-wrap.open{opacity:1;pointer-events:auto}
.sheet{width:calc(100% - 16px);margin:0 8px calc(8px + env(safe-area-inset-bottom,0px));max-height:86vh;overflow:auto;border-radius:32px;padding:14px 16px 18px;transform:translateY(30px);transition:transform .28s cubic-bezier(.2,.8,.2,1);background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(255,244,250,.84))}
.sheet-wrap.open .sheet{transform:none}
.sheet h2{margin:2px 0 10px;font-size:21px;font-weight:900;display:flex;justify-content:space-between;align-items:center;gap:8px}
.tabsx{display:flex;gap:6px;overflow-x:auto;margin:0 -4px 10px;padding:2px 4px;scrollbar-width:none}
.tabsx::-webkit-scrollbar{display:none}
.tabsx button{padding:8px 13px;border-radius:999px;background:rgba(255,255,255,.8);border:1px solid #fff;font-size:13.5px;white-space:nowrap;box-shadow:0 3px 8px var(--shade)}
.tabsx button[aria-pressed="true"]{background:var(--grad);color:#fff}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.shop{border-radius:18px;padding:10px 4px;background:linear-gradient(180deg,#fff,#fff6fb);border:1.5px solid #fff;display:flex;flex-direction:column;align-items:center;gap:3px;box-shadow:0 3px 8px var(--shade);position:relative}
.shop .e{font-size:30px}
.shop .p{font-size:12px;font-weight:900;color:var(--pink)}
.shop .s{font-size:10.5px;color:var(--ink2);text-align:center}
.shop.own{border-color:#bfe8d4}
.shop.eq{border-color:var(--mint);background:#eafbf3}
.shop.lock{opacity:.5}
.shop .art{width:84px;height:84px}
.shop.locked .art img{filter:brightness(0) opacity(.18)}
.sec{font-size:13px;color:var(--ink2);margin:14px 0 8px;font-weight:900}
.toast{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top,0px));transform:translate(-50%,-90px);padding:11px 18px;border-radius:999px;font-weight:900;z-index:95;transition:transform .3s;white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis}
.toast.show{transform:translate(-50%,0)}
input.name-in{width:100%;font:900 20px var(--f);padding:13px 16px;border-radius:18px;border:1.5px solid #fff;background:rgba(255,255,255,.85);color:var(--ink);outline:none;text-align:center;-webkit-user-select:text;user-select:text}
.info-hero{display:flex;gap:12px;align-items:center}
.info-hero .art{width:130px;height:130px;flex:none;border-radius:28px;background:radial-gradient(circle at 50% 40%,#fff,#ffe6f3);box-shadow:inset 0 0 0 2px #fff}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{padding:5px 10px;border-radius:999px;background:#fff;font-size:12px;box-shadow:0 2px 6px var(--shade)}
.statrow{display:grid;grid-template-columns:90px 1fr 38px;align-items:center;gap:8px;font-size:13px;margin:6px 0}
.statrow .b{height:10px;border-radius:5px;background:rgba(61,36,71,.08);overflow:hidden}
.statrow .b i{display:block;height:100%;border-radius:5px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13.5px}
.kv dt{color:var(--ink2)} .kv dd{margin:0;text-align:right}
.rw{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:16px;background:#fff;margin-bottom:6px;box-shadow:0 2px 6px var(--shade)}
.rw .l{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:900;background:var(--grad);color:#fff;flex:none}
.rw.lock .l{background:#e8dcef;color:var(--ink2)}
.rw .t{flex:1;font-size:13.5px}
.rw .e{font-size:22px}

/* huevo, selector y evolución */
#stage{position:fixed;inset:0;z-index:80;display:none;flex-direction:column;align-items:center;background:radial-gradient(90% 60% at 20% 10%,#ffc9e2 0%,transparent 60%),radial-gradient(80% 60% at 90% 30%,#cfe3ff 0%,transparent 60%),radial-gradient(90% 70% at 50% 100%,#d6f5d0 0%,transparent 60%),#fff1e6;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(16px + env(safe-area-inset-bottom,0px))}
#stage.on{display:flex}
#stage h1{margin:4px 0 0;font-size:34px;font-weight:900;text-align:center;letter-spacing:-.01em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
#stage .sub{text-align:center;color:var(--ink2);margin:4px 0 14px}
.lines{flex:1;width:100%;max-width:520px;overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:4px 2px 10px;align-content:start}
.ln{border-radius:28px;padding:10px 8px 12px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;transition:transform .2s}
.ln .pair{display:flex;align-items:flex-end;justify-content:center;width:100%}
.ln .pair div{width:48%;aspect-ratio:1}
.ln b{font-size:16px}
.ln span{font-size:11.5px;color:var(--ink2)}
.ln[aria-pressed="true"]{box-shadow:0 0 0 3px var(--pink),0 10px 26px rgba(255,95,162,.35);transform:translateY(-2px)}
.stage-go{width:100%;max-width:520px;display:flex;flex-direction:column;gap:10px;padding-top:8px}
.egg-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;width:100%}
.egg{width:min(62vw,260px);aspect-ratio:1;touch-action:manipulation;position:relative}
.egg.wob{animation:wob .5s}
@keyframes wob{20%{transform:rotate(-10deg)}40%{transform:rotate(9deg)}60%{transform:rotate(-6deg)}80%{transform:rotate(3deg)}}
.egg.idle{animation:idle 2.4s ease-in-out infinite}
@keyframes idle{0%,86%,100%{transform:rotate(0)}90%{transform:rotate(-5deg)}95%{transform:rotate(5deg)}}
.flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:85}
.flash.go{animation:flash 1s}
@keyframes flash{30%{opacity:1}100%{opacity:0}}
.born{animation:born .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes born{from{transform:scale(.2);opacity:0}}
.rays{position:absolute;inset:-30%;background:repeating-conic-gradient(from 0deg,rgba(255,200,90,.4) 0 10deg,transparent 10deg 20deg);border-radius:50%;animation:spin 8s linear infinite;-webkit-mask:radial-gradient(closest-side,#000 40%,transparent);mask:radial-gradient(closest-side,#000 40%,transparent)}
@keyframes spin{to{transform:rotate(360deg)}}
.evo-art{position:relative;width:min(70vw,300px);aspect-ratio:1}
.evo-art .a{position:absolute;inset:0}
.evo-art.glow .a img{animation:evo 2.6s ease-in forwards}
@keyframes evo{0%{filter:brightness(1)}25%,100%{filter:brightness(0) invert(1) drop-shadow(0 0 22px #fff)}}

/* minijuegos */
#game{position:fixed;inset:0;z-index:70;display:none;touch-action:none;background:#fff4e6}
#game.on{display:block}
#game canvas{position:absolute;inset:0;width:100%;height:100%}
.ghud{position:absolute;left:12px;right:12px;top:calc(8px + env(safe-area-inset-top,0px));padding:8px 8px 8px 16px;border-radius:999px;display:flex;align-items:center;gap:10px;font-weight:900;font-size:17px;z-index:3}
.ghud .sp{flex:1}
.ghud button{width:40px;height:40px;border-radius:50%;background:#fff;font-size:18px}
.gstart{position:absolute;left:50%;top:62%;transform:translateX(-50%);text-align:center;padding:10px 18px;border-radius:999px;pointer-events:none;font-weight:900;animation:pulse 1.4s infinite;white-space:nowrap;z-index:3;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
@keyframes pulse{50%{opacity:.45}}
.gover{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(61,36,71,.28);z-index:5}
.gover.on{display:flex}
.gover .card{width:min(88vw,340px);border-radius:32px;padding:20px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.gover h3{margin:0;font-size:24px;font-weight:900}
.gover .big{font-size:46px;font-weight:900;line-height:1;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.gover .art{width:130px;height:130px}
#dom{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:90px 14px 30px}
#dom.on{display:flex}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;width:min(94vw,440px)}
.card3d{aspect-ratio:3/4;perspective:600px}
.card3d .in{position:relative;width:100%;height:100%;transition:transform .35s;transform-style:preserve-3d}
.card3d.up .in{transform:rotateY(180deg)}
.card3d .fa,.card3d .ba{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center}
.card3d .fa{background:var(--grad);border:3px solid #fff;box-shadow:0 4px 10px var(--shade);font-size:22px;color:#fff}
.card3d .ba{transform:rotateY(180deg);background:#fff;border:3px solid #fff;box-shadow:0 4px 10px var(--shade);padding:3px}
.card3d.done .ba{background:#eafbf3;border-color:#bfe8d4}
.holes{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;width:min(92vw,400px)}
.hole{aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 50% 70%,#6b4a37 0%,#9c7a5e 60%,#c9a88a 100%);position:relative;overflow:hidden;box-shadow:inset 0 6px 12px rgba(0,0,0,.35)}
.hole .who2{position:absolute;left:6%;right:6%;bottom:-86%;height:90%;transition:bottom .16s;display:grid;place-items:center;font-size:46px}
.hole.up .who2{bottom:4%}
.hole.hit .who2{filter:brightness(1.3);transform:scale(.9)}
.simon{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:min(86vw,360px)}
.pad{aspect-ratio:1;border-radius:32px;font-size:54px;display:grid;place-items:center;border:4px solid #fff;box-shadow:0 8px 18px var(--shade),inset 0 -8px 0 rgba(0,0,0,.08);transition:transform .1s,filter .1s}
.pad.lit{transform:scale(1.07);filter:brightness(1.25) saturate(1.3);box-shadow:0 0 0 6px rgba(255,255,255,.8),0 0 40px rgba(255,255,255,.9)}

</style>

<body>
<div id="room"></div>
<div class="dark" id="dark"></div>
<div id="app">
  <header class="top glass">
    <button class="avatar" id="avatarBtn" aria-label="Ficha"><span id="avatar"></span><span class="lv" id="lvl">1</span></button>

    <div class="coins" id="coins">🪙 <span id="coinN">0</span></div>
  </header>
  <div class="needs glass" id="needs"></div>
  <div class="scene" id="scene">
    <div class="pet" id="pet"><div class="shadowE"></div><div class="pet-b"><div class="pet-s" id="petS"><div id="petArt" style="width:100%;height:100%"></div></div></div></div>
    <div class="zzz" id="zzz">z z Z</div>
    <div class="bubble glass" id="bubble"></div>
  </div>
  <div class="tray glass" id="tray"></div>
  <nav class="nav glass" id="nav">
    <button data-room="kitchen" aria-label="Cocina">🍽️<i class="dot"></i></button>
    <button data-room="bath" aria-label="Baño">🛁<i class="dot"></i></button>
    <button data-room="bed" aria-label="Dormitorio">🌙<i class="dot"></i></button>
    <button data-room="play" aria-label="Juegos">🎮<i class="dot"></i></button>
    <button data-room="closet" aria-label="Armario">🎀<i class="dot"></i></button>
  </nav>
</div>
<div class="fx" id="fx"></div>
<div class="sheet-wrap" id="sheetWrap"><div class="sheet glass" id="sheet"></div></div>
<div class="toast glass" id="toast"></div>

<div id="game">
  <canvas id="cv"></canvas>
  <div id="dom"></div>
  <div class="ghud glass"><span id="gScore">0</span><span class="sp"></span><span id="gLives"></span><span id="gCoins">🪙 0</span><button id="gClose" aria-label="Salir">✕</button></div>
  <div class="gstart glass" id="gStart"></div>
  <div class="gover" id="gOver"><div class="card glass"><div class="art" id="goArt"></div><h3 id="goTitle">¡Fin!</h3><div class="big" id="goScore">0</div><div id="goInfo" class="hint"></div><div class="row" style="width:100%"><button class="btn" id="goExit">Salir</button><button class="btn acc" id="goAgain">Otra vez</button></div></div></div>
</div>
<script src="chars.js"></script>
<script src="sprites.js"></script>
<script src="rooms.js"></script>
<script>
'use strict';
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const today = () => new Date().toISOString().slice(0, 10);
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const Cap = window.Capacitor && window.Capacitor.Plugins;
function haptic(k) { try { if (Cap && Cap.Haptics) { k === 'heavy' ? Cap.Haptics.impact({ style: 'HEAVY' }) : k === 'ok' ? Cap.Haptics.notification({ type: 'SUCCESS' }) : Cap.Haptics.impact({ style: 'LIGHT' }); } } catch (e) { } }
let AC = null;
function tone(f, d = .12, type = 'sine', v = .14, slide = 0) {
  if (!S.sound) return;
  try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
    o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, f + slide), t + d);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(g).connect(AC.destination); o.start(t); o.stop(t + d + .02); } catch (e) { }
}
const SFX = {
  tap: () => tone(660, .08, 'sine', .12, 320), eat: () => { tone(260, .06, 'triangle', .12); setTimeout(() => tone(200, .06, 'triangle', .12), 90); setTimeout(() => tone(300, .08, 'triangle', .1), 180); },
  coin: () => { tone(988, .07, 'square', .06); setTimeout(() => tone(1319, .12, 'square', .06), 70); }, pop: () => tone(rnd(700, 1100), .05, 'sine', .08, -300),
  jump: () => tone(440, .12, 'sine', .1, 520), bad: () => tone(220, .25, 'triangle', .12, -120), flip: () => tone(820, .05, 'sine', .07, 200), crack: () => tone(180, .06, 'square', .1, -60),
  up: () => [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tone(f, .14, 'triangle', .1), i * 90)),
  evo: () => [392, 440, 494, 523, 587, 659, 784, 1047].forEach((f, i) => setTimeout(() => tone(f, .18, 'triangle', .1), i * 160)),
  pad: i => tone([330, 392, 494, 587][i], .3, 'triangle', .14),
};

/* ---------- catálogo ---------- */
const FOODS = [
  { id: 'apple', e: '🍎', n: 'Manzana', p: 4, food: 10 }, { id: 'banana', e: '🍌', n: 'Plátano', p: 5, food: 12 }, { id: 'carrot', e: '🥕', n: 'Zanahoria', p: 3, food: 8 },
  { id: 'straw', e: '🍓', n: 'Fresas', p: 6, food: 10, fun: 3 }, { id: 'bread', e: '🥐', n: 'Cruasán', p: 8, food: 16, fun: 2 }, { id: 'pizza', e: '🍕', n: 'Pizza', p: 14, food: 28, fun: 4 },
  { id: 'burger', e: '🍔', n: 'Hamburguesa', p: 16, food: 32, fun: 4 }, { id: 'sushi', e: '🍣', n: 'Sushi', p: 18, food: 26, fun: 6 }, { id: 'ramen', e: '🍜', n: 'Ramen', p: 15, food: 30, fun: 3 },
  { id: 'taco', e: '🌮', n: 'Taco', p: 12, food: 22, fun: 4 }, { id: 'cake', e: '🍰', n: 'Tarta', p: 12, food: 14, fun: 10 }, { id: 'ice', e: '🍦', n: 'Helado', p: 9, food: 8, fun: 10 },
  { id: 'donut', e: '🍩', n: 'Dónut', p: 7, food: 10, fun: 6 }, { id: 'milk', e: '🥛', n: 'Leche', p: 5, food: 6, energy: 6 }, { id: 'boba', e: '🧋', n: 'Bubble tea', p: 11, food: 6, fun: 8, energy: 12 },
];
const SPECIAL = [
  { id: 'candy', e: '🍬', n: 'Caramelo raro', p: 120, xp: 60, d: 'Mucha experiencia' }, { id: 'potion', e: '🧪', n: 'Poción', p: 40, food: 30, fun: 30, energy: 30, clean: 30, d: 'Recupera todo' },
  { id: 'soap', e: '🫧', n: 'Espuma mágica', p: 25, clean: 60, d: 'Limpia al instante' }, { id: 'coffee', e: '☕', n: 'Café', p: 10, energy: 25, d: 'Energía rápida' },
];
const EDIBLE = [...FOODS, ...SPECIAL];
// decoración: slot = dónde se coloca (techo, pared, estante, sueloI, sueloD)
const DECOR = [
  { id: 'lamp', e: '💡', n: 'Bombilla', slot: 'techo', p: 60 }, { id: 'lantern', e: '🏮', n: 'Farolillo', slot: 'techo', p: 90 }, { id: 'disco', e: '🪩', n: 'Bola disco', slot: 'techo', p: 150 }, { id: 'star', e: '⭐', n: 'Estrella', slot: 'techo', p: 110 },
  { id: 'frame', e: '🖼️', n: 'Cuadro', slot: 'pared', p: 70 }, { id: 'clock', e: '🕰️', n: 'Reloj', slot: 'pared', p: 80 }, { id: 'rainbow', e: '🌈', n: 'Arcoíris', slot: 'pared', p: 120 }, { id: 'flags', e: '🎏', n: 'Carpas', slot: 'pared', p: 90 },
  { id: 'plant', e: '🪴', n: 'Planta', slot: 'estante', p: 40 }, { id: 'teddy', e: '🧸', n: 'Osito', slot: 'estante', p: 70 }, { id: 'vase', e: '💐', n: 'Flores', slot: 'estante', p: 55 }, { id: 'books', e: '📚', n: 'Libros', slot: 'estante', p: 45 },
  { id: 'tree', e: '🌳', n: 'Arbolito', slot: 'sueloI', p: 130 }, { id: 'sofa', e: '🛋️', n: 'Sofá', slot: 'sueloI', p: 160 }, { id: 'tent', e: '⛺', n: 'Tienda', slot: 'sueloI', p: 140 }, { id: 'xmas', e: '🎄', n: 'Árbol de Navidad', slot: 'sueloI', p: 180 },
  { id: 'balloons', e: '🎈', n: 'Globos', slot: 'sueloD', p: 60 }, { id: 'fountain', e: '⛲', n: 'Fuente', slot: 'sueloD', p: 200 }, { id: 'cactus', e: '🌵', n: 'Cactus', slot: 'sueloD', p: 50 }, { id: 'robot', e: '🤖', n: 'Robot', slot: 'sueloD', p: 170 },
  { id: 'trophy', e: '🏆', n: 'Trofeo', slot: 'estante', p: 0, reward: true }, { id: 'crownd', e: '👑', n: 'Corona real', slot: 'estante', p: 0, reward: true }, { id: 'gold', e: '🌟', n: 'Estrella dorada', slot: 'techo', p: 0, reward: true },
];
const TOYS = [
  { id: 'ball', e: '⚽', n: 'Pelota', p: 50, fun: 12 }, { id: 'yoyo', e: '🪀', n: 'Yoyó', p: 60, fun: 14 }, { id: 'kite', e: '🪁', n: 'Cometa', p: 80, fun: 16 }, { id: 'balloon', e: '🎈', n: 'Globo', p: 30, fun: 8 },
  { id: 'guitar', e: '🎸', n: 'Guitarra', p: 140, fun: 22 }, { id: 'console', e: '🎮', n: 'Consola', p: 200, fun: 26 }, { id: 'skate', e: '🛹', n: 'Monopatín', p: 120, fun: 20 }, { id: 'dice', e: '🎲', n: 'Dados', p: 40, fun: 10 },
];
const byId = (list, id) => list.find(x => x.id === id);
const MAX_LV = 50;
// recompensas por nivel (además de las monedas de cada subida)
const REWARDS = { 3: { toy: 'balloon' }, 5: { decor: 'plant' }, 7: { item: ['candy', 1] }, 8: { toy: 'ball' }, 10: { decor: 'lamp', coins: 50 }, 12: { item: ['potion', 2] },
  15: { decor: 'frame' }, 16: { evo: true }, 18: { toy: 'yoyo' }, 20: { decor: 'lantern', coins: 100 }, 22: { item: ['candy', 2] }, 25: { toy: 'guitar' }, 28: { decor: 'disco' },
  30: { item: ['potion', 3], coins: 200 }, 33: { decor: 'xmas' }, 36: { evo: true }, 38: { toy: 'skate' }, 40: { decor: 'trophy' }, 45: { decor: 'crownd' }, 50: { decor: 'gold', egg: true } };
const lvCoins = l => 15 + l * 3;

/* ---------- estado ---------- */
const KEY = 'chibimon.v2', RATE = { food: 7, energy: 5, fun: 6, clean: 4 };
const fresh = () => ({ v: 3, line: '', name: '', named: false, coins: 100, xp: 0, lvl: 1, food: 80, energy: 90, fun: 75, clean: 90, sleep: false, t: Date.now(), born: today(),
  inv: { apple: 3, banana: 2, pizza: 1, cake: 1 }, decor: [], toys: [], place: {}, day: '', best: {}, plays: 0, fed: 0, sound: true, room: 'kitchen', seen: [], team: [], toyT: {} });
let S;
try { S = Object.assign(fresh(), JSON.parse(localStorage.getItem(KEY) || 'null') || {}); } catch (e) { S = fresh(); }
for (const k of ['decor', 'toys', 'seen', 'team']) if (!Array.isArray(S[k])) S[k] = [];
for (const k of ['place', 'best', 'toyT', 'inv']) if (!S[k] || typeof S[k] !== 'object') S[k] = {};
if (S.lvl > MAX_LV) S.lvl = MAX_LV;
let saveT; const save = () => { clearTimeout(saveT); saveT = setTimeout(() => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { } }, 150); };
const STAGE = [1, 16, 36];
const cur = () => formOf(S.line || 'hoja', S.lvl);
const CH = () => CHARS[cur()];
const nameNow = () => S.named && S.name ? S.name : CH().n;
const art = id => `<img class="art-img" src="${SPRITES[id] || ''}" alt="" draggable="false">`;
function tick() {
  const now = Date.now(); let h = (now - S.t) / 3600000; S.t = now; if (h <= 0) return; h = Math.min(h, 36);
  const k = S.sleep ? .35 : 1;
  S.food = clamp(S.food - RATE.food * h * k, 0, 100); S.fun = clamp(S.fun - RATE.fun * h * k, 0, 100); S.clean = clamp(S.clean - RATE.clean * h * k, 0, 100);
  S.energy = clamp(S.energy + (S.sleep ? 28 : -RATE.energy) * h, 0, 100);
  if (S.sleep && S.energy >= 100 && h > .01) { S.sleep = false; setTimeout(() => say('¡Buenos días! ☀️', 2500), 600); }
}
function mood() {
  if (S.sleep) return 'sleep'; if (S.food < 20) return 'hungry'; if (S.energy < 15) return 'tired'; if (S.clean < 20) return 'dirty'; if (S.fun < 20) return 'bored';
  return Math.min(S.food, S.energy, S.fun, S.clean) > 55 ? 'happy' : 'ok';
}
const MOOD_L = { happy: 'Feliz 😊', ok: 'Tranquilo 🙂', hungry: 'Con hambre 🥺', tired: 'Cansado 😴', dirty: 'Pegajoso 🫠', bored: 'Aburrido 😕', sleep: 'Durmiendo 💤' };

/* ---------- mascota ---------- */
let petForm = '', look = 0;
function drawPet() {
  if (!S.line) return;
  const m = mood(), P = $('#pet'), id = cur();
  if (petForm !== id) { $('#petArt').innerHTML = art(id); petForm = id; }
  const img = $('#petArt img'); if (img) img.style.transform = `translateX(${look * 6}px) rotate(${look * 4}deg)`;
  P.classList.toggle('sleep', m === 'sleep'); P.classList.toggle('dirty', S.clean < 30); $('#zzz').classList.toggle('on', m === 'sleep');
  const fl = P.querySelector('.flies'); if (S.clean < 20 && !fl) P.insertAdjacentHTML('beforeend', '<span class="flies">🪰</span>'); else if (S.clean >= 20 && fl) fl.remove();
}
let lookT;
document.addEventListener('pointermove', e => {
  if ($('#game').classList.contains('on') || $('#stage').classList.contains('on')) return;
  const r = $('#pet').getBoundingClientRect(); look = clamp((e.clientX - r.left - r.width / 2) / r.width, -1, 1); drawPet();
  clearTimeout(lookT); lookT = setTimeout(() => { look = 0; drawPet(); }, 1400);
});

/* ---------- HUD ---------- */
const NEEDS = [['food', '🍔', 'Comida'], ['energy', '⚡', 'Energía'], ['fun', '🎈', 'Diversión'], ['clean', '🫧', 'Higiene']];
const NCOL = { food: '#ff8a4c', energy: '#ffc93c', fun: '#ff5fa2', clean: '#4db8ff' };
$('#needs').innerHTML = NEEDS.map(([k, e, l]) => `<div class="need" id="n_${k}"><div class="ring"><svg viewBox="0 0 44 44"><circle class="bg" cx="22" cy="22" r="18.5"/><circle class="fg" cx="22" cy="22" r="18.5" stroke-dasharray="116.2"/></svg>${e}</div>${l}</div>`).join('');
const xpNeed = () => 30 + S.lvl * 12;
function nextEvo() { return S.lvl < STAGE[1] ? STAGE[1] : S.lvl < STAGE[2] ? STAGE[2] : null; }
function renderHud() {
  for (const [k] of NEEDS) { const v = S[k], el = $('#n_' + k), c = el.querySelector('.fg'); c.style.strokeDashoffset = 116.2 * (1 - v / 100); c.style.stroke = v > 25 ? NCOL[k] : '#ff5d6c'; el.classList.toggle('low', v < 20); }
  $('#coinN').textContent = Math.floor(S.coins); $('#lvl').textContent = S.lvl; $('#name').textContent = nameNow();
  const ne = nextEvo();
  $('#kind').textContent = `${LINES[S.line || 'hoja'].e} ${CH().t} · ${ne ? 'evoluciona al nv. ' + ne : S.lvl >= MAX_LV ? '¡nivel máximo!' : 'forma final'}`;
  $('#xpBar').style.width = (S.lvl >= MAX_LV ? 100 : S.xp / xpNeed() * 100) + '%';
  $('#avatar').innerHTML = S.line ? `<img src="${SPRITES[cur()]}" alt="">` : '';
  const al = { kitchen: S.food < 25, bath: S.clean < 25, bed: S.energy < 20, play: S.fun < 25, closet: S.lvl >= MAX_LV };
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('alert', !!al[b.dataset.room] && b.dataset.room !== S.room));
}
let evoPending = null;
function grant(r, silent) {
  const got = [];
  if (r.coins) { S.coins += r.coins; got.push('🪙 ' + r.coins); }
  if (r.item) { S.inv[r.item[0]] = (S.inv[r.item[0]] || 0) + r.item[1]; const it = byId(EDIBLE, r.item[0]); got.push(`${it.e} ${it.n} x${r.item[1]}`); }
  if (r.toy && !S.toys.includes(r.toy)) { S.toys.push(r.toy); const t = byId(TOYS, r.toy); got.push(`${t.e} ${t.n}`); }
  if (r.decor && !S.decor.includes(r.decor)) { S.decor.push(r.decor); const d = byId(DECOR, r.decor); got.push(`${d.e} ${d.n}`); }
  if (r.egg) got.push('🥚 Huevo nuevo');
  return got;
}
function addXp(n) {
  if (S.lvl >= MAX_LV || !S.line) return;
  const before = cur(); S.xp += n; const gained = [];
  while (S.xp >= xpNeed() && S.lvl < MAX_LV) {
    S.xp -= xpNeed(); S.lvl++; S.coins += lvCoins(S.lvl);
    const g = REWARDS[S.lvl] ? grant(REWARDS[S.lvl]) : []; gained.push({ lvl: S.lvl, got: ['🪙 ' + lvCoins(S.lvl), ...g] });
  }
  if (S.lvl >= MAX_LV) S.xp = 0;
  if (gained.length) { SFX.up(); haptic('ok'); confetti(); const last = gained[gained.length - 1]; toast(`¡Nivel ${last.lvl}! ${last.got.slice(0, 3).join(' · ')}`); renderTray(); }
  if (cur() !== before) evoPending = [before, cur()];
  if (!S.seen.includes(cur())) S.seen.push(cur());
  save();
  if (evoPending && !$('#game').classList.contains('on')) setTimeout(runEvolution, 1000);
  else if (gained.some(x => REWARDS[x.lvl] && !REWARDS[x.lvl].evo)) setTimeout(() => showLevelUp(gained), 900);
}
function showLevelUp(gained) {
  if ($('#game').classList.contains('on') || $('#stage').classList.contains('on')) return;
  const items = gained.flatMap(x => x.got.slice(1)); if (!items.length) return;
  openSheet(`<h2>🎁 ¡Recompensas!</h2><div class="hint" style="font-size:14px">Has subido al nivel ${gained[gained.length - 1].lvl}</div>${items.map(t => `<div class="rw"><span class="e">${t.split(' ')[0]}</span><span class="t">${esc(t.split(' ').slice(1).join(' '))}</span></div>`).join('')}<button class="btn big acc" style="width:100%;margin-top:8px" data-close>¡Genial!</button>`);
}
function bumpCoins() { const c = $('#coins'); c.classList.remove('bump'); void c.offsetWidth; c.classList.add('bump'); }
let bubT; function say(t, ms = 1900) { const b = $('#bubble'); b.textContent = t; b.classList.add('show'); clearTimeout(bubT); bubT = setTimeout(() => b.classList.remove('show'), ms); }
let toastT; function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 2600); }
function popFx(t, color) { const p = $('#pet').getBoundingClientRect(), el = document.createElement('div'); el.className = 'pop'; el.textContent = t; el.style.color = color || '#fff'; el.style.left = (p.left + p.width / 2 + rnd(-40, 30)) + 'px'; el.style.top = (p.top + p.height * .3) + 'px'; $('#fx').appendChild(el); setTimeout(() => el.remove(), 1000); }
function hearts(n = 4, el = $('#pet')) { const p = el.getBoundingClientRect(); for (let i = 0; i < n; i++) { const h = document.createElement('div'); h.className = 'heart'; h.textContent = pick(['💕', '💖', '✨', '💗']); h.style.left = (p.left + p.width * rnd(.3, .7)) + 'px'; h.style.top = (p.top + p.height * .35) + 'px'; h.style.setProperty('--dx', rnd(-50, 50) + 'px'); h.style.animationDelay = i * .08 + 's'; $('#fx').appendChild(h); setTimeout(() => h.remove(), 1500); } }
function confetti() { const cols = ['#ffc93c', '#ff5fa2', '#4db8ff', '#3fd0a4', '#8f6bff', '#ff8a4c']; for (let i = 0; i < 50; i++) { const c = document.createElement('i'); c.className = 'confetti'; c.style.left = rnd(0, 100) + '%'; c.style.top = '-20px'; c.style.background = pick(cols); c.style.setProperty('--dx', rnd(-80, 80) + 'px'); c.style.animationDelay = rnd(0, .4) + 's'; $('#fx').appendChild(c); setTimeout(() => c.remove(), 2200); } }
function squish(k = 'sq') { const s = $('#petS'); s.classList.remove('sq', 'hop', 'spin'); void s.offsetWidth; s.classList.add(k); }

/* ---------- habitaciones y decoración ---------- */
function roomHtml(r) {
  const deco = Object.entries(SLOTS[r]).map(([slot, [x, y, s]]) => { const id = (S.place[r] || {})[slot]; const d = id && byId(DECOR, id); return d ? `<text x="${x}" y="${y}" font-size="${s}" text-anchor="middle" dominant-baseline="middle" style="filter:drop-shadow(0 6px 5px rgba(0,0,0,.2))">${d.e}</text>` : ''; }).join('');
  return `<svg viewBox="0 0 400 700" preserveAspectRatio="xMidYMax slice">${ROOM_SVG[r]}${deco}</svg>`;
}
function goRoom(r) {
  S.room = r; save(); $('#room').innerHTML = roomHtml(r);
  document.querySelectorAll('#nav button').forEach(b => b.setAttribute('aria-current', b.dataset.room === r));
  $('#dark').classList.toggle('on', S.sleep && r === 'bed'); tool = null; renderTray(); renderHud();
}
$('#nav').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; SFX.tap(); haptic(); goRoom(b.dataset.room); });
let tool = null;
const GAMES = [['catch', '🍓', 'Lluvia de comida', '#ffe1ea'], ['jump', '☁️', 'Salto al cielo', '#e1f0ff'], ['fly', '🪽', 'Vuelo', '#fff1c9'], ['mem', '🃏', 'Parejas', '#efe4ff'], ['whack', '🐛', 'Caza bichos', '#e3f7dc'], ['simon', '🎵', 'Simón dice', '#ffe6d6']];

      <div class="row"><button class="btn" id="decBtn">🪴 Decorar</button><button class="btn" id="dexBtn">📖 Álbum</button></div>

/* ---------- comer ---------- */
function feed(id) {
  const f = byId(EDIBLE, id); if (!f || !(S.inv[id] > 0)) return;
  if (S.sleep) { say('Zzz… 😴'); return; }
  if (S.food >= 98 && !f.energy && !f.xp && !f.clean) { say('¡Estoy lleno! 🙅'); squish(); return; }
  S.inv[id]--; if (!S.inv[id]) delete S.inv[id];
  const fav = LINES[S.line].food === id;
  S.food = clamp(S.food + (f.food || 0), 0, 100); S.fun = clamp(S.fun + (f.fun || 0) + (fav ? 8 : 0), 0, 100);
  if (f.energy) S.energy = clamp(S.energy + f.energy, 0, 100); if (f.clean) S.clean = clamp(S.clean + f.clean, 0, 100);
  S.fed = (S.fed || 0) + 1; SFX.eat(); haptic(); squish(); setTimeout(() => squish(), 300);
  if (f.food) popFx('+' + f.food, '#ff8a4c'); if (fav) { hearts(); say('¡Mi comida favorita! 💖'); } else if (f.xp) say('¡Me siento más fuerte! ✨'); else say(pick(['¡Ñam! 😋', '¡Qué rico!', '¡Más, más!', 'Mmmm…']));
  addXp((f.xp || 0) + (fav ? 6 : 3)); save(); renderHud(); renderTray(); drawPet();
}
function bindFood(el) {
  let g = null, sx = null, sy = 0, mv = false;
  el.addEventListener('pointerdown', e => { sx = e.clientX; sy = e.clientY; mv = false; el.setPointerCapture(e.pointerId); });
  el.addEventListener('pointermove', e => {
    if (sx == null) return;
    if (!mv && Math.hypot(e.clientX - sx, e.clientY - sy) > 10) { mv = true; g = document.createElement('div'); g.className = 'drag-food'; g.textContent = el.querySelector('.e').textContent; document.body.appendChild(g); }
    if (g) { g.style.left = e.clientX + 'px'; g.style.top = e.clientY + 'px'; }
  });
  el.addEventListener('pointerup', e => { if (sx == null) return; sx = null; if (!mv) return feed(el.dataset.food); if (g) g.remove(); g = null; if (nearPet(e.clientX, e.clientY)) feed(el.dataset.food); });
  el.addEventListener('pointercancel', () => { sx = null; if (g) g.remove(); g = null; });
}
function nearPet(x, y) { const r = $('#pet').getBoundingClientRect(); return x > r.left && x < r.right && y > r.top && y < r.bottom; }

/* ---------- baño, sueño y juguetes ---------- */
let foam = 0, lastFoam = 0;
function addFoam(x, y) {
  const now = performance.now(); if (now - lastFoam < 45) return; lastFoam = now;
  const b = document.createElement('i'), s = rnd(16, 34); b.className = 'foam'; b.dataset.foam = 1; b.style.width = b.style.height = s + 'px'; b.style.left = (x - s / 2 + rnd(-10, 10)) + 'px'; b.style.top = (y - s / 2 + rnd(-10, 10)) + 'px';
  $('#fx').appendChild(b); foam = Math.min(foam + 1, 60); SFX.pop();
  if (foam % 12 === 0) { squish('hop'); say(pick(['¡Jiji, cosquillas!', '¡Burbujas! 🫧', 'Qué gustito'])); }
}
function shower() {
  SFX.jump(); haptic();
  for (let i = 0; i < 44; i++) { const d = document.createElement('i'); d.className = 'drop'; d.style.left = rnd(18, 82) + '%'; d.style.top = rnd(80, 200) + 'px'; d.style.animationDelay = rnd(0, .5) + 's'; $('#fx').appendChild(d); setTimeout(() => d.remove(), 1400); }
  setTimeout(() => { $('#fx').querySelectorAll('[data-foam]').forEach(b => b.remove()); const g = Math.round(foam * 1.6);
    if (g > 0) { S.clean = clamp(S.clean + g, 0, 100); popFx('+' + g, '#4db8ff'); say('¡Como nuevo! ✨'); squish('hop'); hearts(3); addXp(Math.ceil(g / 10)); } else say('Primero el jabón 🧼');
    foam = 0; save(); renderHud(); drawPet(); }, 700);
}
function toggleSleep() { S.sleep = !S.sleep; SFX.tap(); haptic(); $('#dark').classList.toggle('on', S.sleep); say(S.sleep ? 'Buenas noches… 🌙' : S.energy > 60 ? '¡A tope de energía!' : 'Aún tengo sueño…'); save(); drawPet(); renderHud(); renderTray(); }
function playToy(id) {
  const t = byId(TOYS, id); if (!t) return;
  if (S.sleep) { say('Zzz… 😴'); return; }
  if ((S.toyT[id] || 0) > Date.now()) { say('Ya he jugado con eso, ¡luego otra vez!'); return; }
  S.toyT[id] = Date.now() + 90000; S.fun = clamp(S.fun + t.fun, 0, 100); S.plays = (S.plays || 0) + 1;
  const p = $('#pet').getBoundingClientRect(), el = document.createElement('div'); el.className = 'toyfly'; el.textContent = t.e; el.style.left = (p.left + p.width * .6) + 'px'; el.style.top = (p.top + p.height * .5) + 'px'; el.style.setProperty('--dx', rnd(-80, 80) + 'px'); $('#fx').appendChild(el); setTimeout(() => el.remove(), 1300);
  squish('spin'); setTimeout(() => squish('hop'), 700); SFX.jump(); hearts(3); popFx('+' + t.fun, '#ff5fa2'); say(pick(['¡Qué divertido!', '¡Otra vez, otra vez!', '¡Jiji! 🎉']));
  addXp(3); save(); renderHud(); renderTray(); setTimeout(renderTray, 90500);
}

/* ---------- tocar ---------- */
let taps = [], down = null;
$('#pet').addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY }; if (S.room === 'bath' && tool === 'soap') { $('#pet').setPointerCapture(e.pointerId); addFoam(e.clientX, e.clientY); } });
$('#pet').addEventListener('pointermove', e => { if (down && S.room === 'bath' && tool === 'soap') addFoam(e.clientX, e.clientY); });
$('#pet').addEventListener('pointerup', e => {
  if (!down) return; const d = Math.hypot(e.clientX - down.x, e.clientY - down.y); down = null;
  if (S.room === 'bath' && tool === 'soap') return; if (d > 12) return;
  if (S.sleep) { say('Zzz… (déjame dormir)'); return; }
  const now = Date.now(); taps = taps.filter(t => now - t < 2500); taps.push(now); SFX.tap(); haptic();
  if (taps.length >= 7) { squish(); say('¡Ya vale! 😤'); return; }
  squish(taps.length % 3 === 0 ? 'hop' : 'sq');
  const L = { hungry: ['Tengo hambre… 🥺', '¿Me das algo?'], tired: ['Qué sueño…', 'Necesito dormir 😴'], dirty: ['Me siento pegajoso…', '¿Un bañito? 🛁'], bored: ['¿Jugamos? 🎮', 'Me aburro…'], ok: ['¡Hola!', '¿Qué hacemos?', 'Jiji'], happy: ['¡Jiji! 💕', '¡Te quiero!', '¡Qué bien estoy!', '✨'] };
  say(pick(L[mood()] || L.ok)); if (taps.length === 3) { S.fun = clamp(S.fun + 2, 0, 100); hearts(2); addXp(1); save(); renderHud(); }
});

function initWhack() {
  Wk = { score: 0, time: 30, holes: [] }; hud('0', null, 0);
  $('#dom').innerHTML = `<div style="display:flex;flex-direction:column;align-items:center;gap:18px"><div class="glass" style="padding:8px 18px;border-radius:999px;font-weight:900" id="wkT">⏱ 30 s</div><div class="holes">${Array.from({ length: 9 }, (_, i) => `<div class="hole" data-i="${i}"><div class="who2"></div></div>`).join('')}</div></div>`;
  Wk.holes = [...$('#dom').querySelectorAll('.hole')];
  Wk.holes.forEach(h => h.addEventListener('pointerdown', () => { if (!G.started) { start(); runWhack(); } else whackHit(h); }));
}
function runWhack() {
  G.iv = setInterval(() => { Wk.time--; const t = $('#wkT'); if (t) t.textContent = `⏱ ${Wk.time} s`; if (Wk.time <= 0) endGame(Wk.score, Math.floor(Wk.score / 2), Wk.score); }, 1000);
  const pop = () => { if (!G.on) return; const free = Wk.holes.filter(h => !h.classList.contains('up'));
    if (free.length) { const h = pick(free), friend = Math.random() < .2; h.dataset.kind = friend ? 'friend' : 'bug';
      h.querySelector('.who2').innerHTML = friend ? `<div style="width:100%;height:100%">${art(cur())}</div>` : pick(['🐛', '🐞', '🦟', '🪲', '🐜']);
      h.classList.add('up'); setTimeout(() => h.classList.remove('up', 'hit'), 900 - Math.min(500, (30 - Wk.time) * 14)); }
    G.to = setTimeout(pop, Math.max(330, 700 - (30 - Wk.time) * 14)); };
  pop();
}
function whackHit(h) {
  if (!h.classList.contains('up') || h.classList.contains('hit')) return; h.classList.add('hit');
  if (h.dataset.kind === 'friend') { Wk.score = Math.max(0, Wk.score - 3); SFX.bad(); haptic('heavy'); toast('¡A tu amigo no! 😣'); } else { Wk.score++; SFX.pop(); haptic(); }
  hud(String(Wk.score), null, Math.floor(Wk.score / 2)); setTimeout(() => h.classList.remove('up', 'hit'), 150);
}
/* 6 · Simón dice */
let Sm;
const PADS = [['🍓', '#ff7aa2'], ['⭐', '#ffc93c'], ['🍃', '#3fd0a4'], ['💧', '#4db8ff']];
function initSimon() {
  Sm = { seq: [], pos: 0, round: 0, busy: true }; hud('Ronda 0', null, 0);
  $('#dom').innerHTML = `<div style="display:flex;flex-direction:column;align-items:center;gap:18px"><div class="glass" style="padding:8px 18px;border-radius:999px;font-weight:900" id="smT">Mira y escucha…</div><div class="simon">${PADS.map(([e, c], i) => `<button class="pad" data-p="${i}" style="background:linear-gradient(180deg,${c},${c}cc)">${e}</button>`).join('')}</div></div>`;
  $('#dom').querySelectorAll('.pad').forEach(b => b.onclick = () => simonPress(+b.dataset.p));
  start(); setTimeout(simonNext, 700);
}
function lit(i, ms = 380) { const b = $('#dom').querySelector(`[data-p="${i}"]`); if (!b) return; b.classList.add('lit'); SFX.pad(i); setTimeout(() => b.classList.remove('lit'), ms); }
function simonNext() {
  if (!G.on) return; Sm.seq.push(Math.floor(Math.random() * 4)); Sm.pos = 0; Sm.busy = true; hud('Ronda ' + Sm.seq.length, null, Sm.round * 3);
  $('#smT').textContent = 'Mira y escucha…'; const sp = Math.max(260, 560 - Sm.seq.length * 20);
  Sm.seq.forEach((p, k) => setTimeout(() => lit(p, sp * .7), 400 + k * sp));
  setTimeout(() => { Sm.busy = false; if ($('#smT')) $('#smT').textContent = '¡Tu turno!'; }, 400 + Sm.seq.length * sp);
}
function simonPress(i) {
  if (!G.on || Sm.busy) return; lit(i, 220); haptic();
  if (i !== Sm.seq[Sm.pos]) { SFX.bad(); haptic('heavy'); endGame(Sm.round, Sm.round * 3, 'Ronda ' + Sm.round); return; }
  Sm.pos++; if (Sm.pos === Sm.seq.length) { Sm.round++; Sm.busy = true; SFX.coin(); setTimeout(simonNext, 700); }
}

/* ---------- arranque ---------- */
function daily() { if (S.day === today()) return; const first = !S.day; S.day = today(); if (!first) { S.coins += 30; bumpCoins(); setTimeout(() => toast('🎁 Regalo diario: +30 🪙'), 900); } save(); }
loadSprites().then(() => { tick(); daily(); goRoom(S.room || 'kitchen'); drawPet(); renderHud(); if (!S.line) openChoose(false); });
setInterval(() => { tick(); save(); renderHud(); drawPet(); }, 5000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { tick(); daily(); renderHud(); drawPet(); } else { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { } } });
setInterval(() => { const m = mood(); if (!G.on && !S.sleep && S.line && Math.random() < .35 && m !== 'happy' && m !== 'ok') say({ hungry: 'Tengo hambre… 🍎', tired: 'Estoy cansado… 😴', dirty: 'Necesito un baño 🛁', bored: '¿Jugamos? 🎮' }[m], 2500); }, 20000);
</script>
