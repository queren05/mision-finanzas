<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Chibimon</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#fff1dd">
<style>
/* Chibimon: mascota virtual que evoluciona. Capas: habitación ilustrada (rooms.js) → criatura (chars.js)
   → interfaz de cristal líquido. Capas a pantalla completa aparte para el huevo/evolución (#stage) y
   los minijuegos (#game). Todo se guarda en localStorage. */
:root{
  --ink:#4a3226; --ink2:#8a6e5e; --acc:#ff7f66; --acc2:#ffb347; --good:#5fc98a; --bad:#ff6b6b;
  --glass:rgba(255,255,255,.42); --glass2:rgba(255,255,255,.64); --edge:rgba(255,255,255,.78); --shade:rgba(120,80,50,.16);
  --blur:saturate(1.8) blur(22px); --f:ui-rounded,"SF Pro Rounded","Nunito",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:#fff1dd;color:var(--ink);font:700 15px/1.3 var(--f);overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
.glass{background:linear-gradient(180deg,var(--glass2),var(--glass));border:1px solid var(--edge);box-shadow:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(255,255,255,.3),0 10px 30px var(--shade);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
#room{position:fixed;inset:0}
#room svg{width:100%;height:100%;display:block}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:calc(env(safe-area-inset-top,0px) + 6px)}
.top{display:flex;align-items:center;gap:10px;margin:0 12px;padding:8px 10px 8px 8px;border-radius:26px}
.avatar{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.75);position:relative;flex:none}
.avatar span:first-child svg{position:absolute;inset:-3px;width:52px;height:52px}
.avatar .lv{position:absolute;right:-5px;bottom:-5px;min-width:24px;height:22px;padding:0 5px;border-radius:11px;background:var(--acc);color:#fff;font-size:12px;display:grid;place-items:center;border:2px solid #fff}
.who{flex:1;min-width:0;text-align:left}
.who b{display:block;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{display:block;font-size:11px;color:var(--ink2);margin-top:1px}
.xp{height:6px;border-radius:3px;background:rgba(74,50,38,.12);margin-top:4px;overflow:hidden}
.xp i{display:block;height:100%;background:linear-gradient(90deg,var(--acc2),var(--acc));border-radius:3px;transition:width .5s}
.coins{display:flex;align-items:center;gap:5px;padding:8px 12px;border-radius:999px;font-weight:900;font-variant-numeric:tabular-nums;background:rgba(255,255,255,.65)}
.coins.bump{animation:bump .35s}
@keyframes bump{50%{transform:scale(1.18)}}
.needs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:8px 12px 0;padding:8px;border-radius:24px}
.need{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--ink2)}
.ring{position:relative;width:44px;height:44px;display:grid;place-items:center;font-size:19px}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:4.5}
.ring .bg{stroke:rgba(74,50,38,.1)}
.ring .fg{stroke-linecap:round;transition:stroke-dashoffset .6s,stroke .6s}
.need.low .ring{animation:wig 1.2s infinite}
@keyframes wig{0%,100%{transform:rotate(0)}10%{transform:rotate(-9deg)}20%{transform:rotate(9deg)}30%{transform:rotate(0)}}
.scene{position:relative;flex:1;min-height:0}
.pet{position:absolute;left:50%;bottom:4%;width:min(78vw,340px);aspect-ratio:1;transform:translateX(-50%);touch-action:none}
.pet-b{width:100%;height:100%;animation:breathe 3.4s ease-in-out infinite;transform-origin:50% 94%}
@keyframes breathe{50%{transform:scale(1.03,.97)}}
.pet-s{width:100%;height:100%;transform-origin:50% 94%}
.pet-s.sq{animation:sq .28s}
@keyframes sq{40%{transform:scale(1.16,.84)}100%{transform:none}}
.pet-s.hop{animation:hop .55s}
@keyframes hop{30%{transform:translateY(-22%) scale(.94,1.08)}60%{transform:scale(1.1,.9)}100%{transform:none}}
.pet.sleep .pet-b{animation-duration:6s}
.bubble{position:absolute;left:50%;top:3%;transform:translate(-50%,-6px) scale(.85);opacity:0;padding:9px 16px;border-radius:20px;font-weight:800;white-space:nowrap;transition:opacity .2s,transform .25s;pointer-events:none;z-index:5;max-width:88%;overflow:hidden;text-overflow:ellipsis}
.bubble.show{opacity:1;transform:translate(-50%,0) scale(1)}
.dark{position:fixed;inset:0;background:radial-gradient(60% 40% at 50% 70%,rgba(30,20,60,.4),rgba(20,14,45,.78));opacity:0;pointer-events:none;transition:opacity .6s;z-index:1}
.dark.on{opacity:1}
#app>*:not(.scene){position:relative;z-index:2}
.scene{z-index:2}
.zzz{position:absolute;left:62%;top:24%;font-weight:900;font-size:24px;color:#fff;z-index:4;pointer-events:none;opacity:0;text-shadow:0 2px 8px rgba(0,0,0,.3)}
.zzz.on{animation:zzz 2.6s infinite}
@keyframes zzz{0%{opacity:0;transform:translate(0,0) scale(.6)}30%{opacity:1}100%{opacity:0;transform:translate(30px,-70px) scale(1.3)}}
.fx{position:fixed;inset:0;pointer-events:none;z-index:6;overflow:hidden}
.pop{position:absolute;font-size:22px;font-weight:900;animation:rise 1s forwards;text-shadow:0 2px 0 #fff,0 0 8px #fff}
@keyframes rise{to{transform:translateY(-70px);opacity:0}}
.heart{position:absolute;font-size:22px;animation:heart 1.2s forwards}
@keyframes heart{to{transform:translate(var(--dx),-110px) scale(1.4);opacity:0}}
.foam{position:absolute;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#eef7ff 55%,#c9e2f7);box-shadow:inset -2px -3px 5px rgba(120,160,210,.35);pointer-events:none;animation:foamIn .25s}
@keyframes foamIn{from{transform:scale(0)}}
.drop{position:absolute;width:4px;height:16px;border-radius:2px;background:linear-gradient(#cfeeff,#7cc0ff);animation:fall .8s linear forwards}
@keyframes fall{to{transform:translateY(460px);opacity:.2}}
.drag-food{position:fixed;font-size:56px;pointer-events:none;z-index:50;transform:translate(-50%,-50%);filter:drop-shadow(0 8px 10px rgba(0,0,0,.25))}
.confetti{position:absolute;width:9px;height:14px;border-radius:2px;animation:conf 1.6s ease-in forwards}
@keyframes conf{to{transform:translate(var(--dx),110vh) rotate(720deg)}}
.tray{margin:0 12px 8px;padding:10px;border-radius:28px;display:flex;flex-direction:column;gap:8px}
.tray-h{display:flex;justify-content:space-between;align-items:center;padding:0 4px;font-size:12.5px;color:var(--ink2)}
.tray-h b{color:var(--ink);font-size:15.5px}
.scroller{display:flex;gap:9px;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.item{flex:none;width:72px;height:80px;border-radius:20px;background:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;position:relative;touch-action:none;box-shadow:0 4px 10px var(--shade)}
.item .e{font-size:32px;line-height:1.1}
.item .q{position:absolute;top:4px;right:5px;font-size:11px;font-weight:900;background:var(--acc);color:#fff;border-radius:999px;padding:1px 6px}
.item .p{font-size:11px;color:var(--ink2);font-weight:800}
.item:active{transform:scale(.94)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:999px;background:rgba(255,255,255,.74);border:1px solid rgba(255,255,255,.95);font-weight:900;box-shadow:0 4px 12px var(--shade),inset 0 1px 0 #fff}
.btn.big{min-height:54px;font-size:16.5px}
.btn.acc{background:linear-gradient(180deg,#ff9a80,var(--acc));color:#fff;border-color:rgba(255,255,255,.5);box-shadow:0 8px 20px rgba(255,127,102,.4),inset 0 1px 0 rgba(255,255,255,.5)}
.btn.sm{min-height:36px;padding:0 14px;font-size:13px}
.btn[disabled]{opacity:.45}
.btn:active{transform:scale(.95)}
.row{display:flex;gap:9px}
.row > *{flex:1}
.games{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.game{border-radius:22px;padding:10px 11px;background:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.95);text-align:left;display:flex;align-items:center;gap:9px;box-shadow:0 4px 12px var(--shade)}
.game .e{font-size:26px;width:40px;height:40px;border-radius:14px;display:grid;place-items:center;flex:none}
.game b{display:block;font-size:13.5px}
.game span{font-size:11px;color:var(--ink2)}
.game:active{transform:scale(.96)}
.hint{font-size:12.5px;color:var(--ink2);text-align:center;padding:4px 8px}
.nav{display:grid;grid-template-columns:repeat(5,1fr);margin:0 12px calc(8px + env(safe-area-inset-bottom,0px));padding:6px;border-radius:999px}
.nav button{height:52px;border-radius:999px;font-size:24px;display:grid;place-items:center;transition:background .25s;position:relative}
.nav button[aria-current="true"]{background:rgba(255,255,255,.88);box-shadow:0 4px 12px var(--shade),inset 0 1px 0 #fff}
.nav .dot{position:absolute;top:7px;right:20%;width:9px;height:9px;border-radius:50%;background:var(--bad);border:2px solid #fff;display:none}
.nav button.alert .dot{display:block}
.sheet-wrap{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;background:rgba(74,50,38,.22);opacity:0;pointer-events:none;transition:opacity .2s}
.sheet-wrap.open{opacity:1;pointer-events:auto}
.sheet{width:calc(100% - 16px);margin:0 8px calc(8px + env(safe-area-inset-bottom,0px));max-height:84vh;overflow:auto;border-radius:32px;padding:14px 16px 18px;transform:translateY(30px);transition:transform .28s cubic-bezier(.2,.8,.2,1);background:linear-gradient(180deg,rgba(255,255,255,.88),rgba(255,248,240,.8))}
.sheet-wrap.open .sheet{transform:none}
.sheet h2{margin:2px 0 12px;font-size:21px;font-weight:900;display:flex;justify-content:space-between;align-items:center}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.shop{border-radius:18px;padding:10px 4px;background:rgba(255,255,255,.78);border:1.5px solid rgba(255,255,255,.95);display:flex;flex-direction:column;align-items:center;gap:3px;box-shadow:0 3px 8px var(--shade)}
.shop .e{font-size:30px}
.shop .p{font-size:12px;font-weight:900;color:var(--acc)}
.shop .s{font-size:10.5px;color:var(--ink2);text-align:center}
.shop.own{border-color:#bfe8cf}
.shop.eq{border-color:var(--good);background:#effbf3}
.shop .art{width:84px;height:84px}
.shop.locked .art{filter:brightness(0) opacity(.18)}
.sec{font-size:13px;color:var(--ink2);margin:14px 0 8px;font-weight:900}
.toast{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top,0px));transform:translate(-50%,-90px);padding:11px 18px;border-radius:999px;font-weight:900;z-index:95;transition:transform .3s;white-space:nowrap}
.toast.show{transform:translate(-50%,0)}
input.name-in{width:100%;font:900 20px var(--f);padding:13px 16px;border-radius:18px;border:1.5px solid rgba(255,255,255,.95);background:rgba(255,255,255,.82);color:var(--ink);outline:none;text-align:center;-webkit-user-select:text;user-select:text}

/* huevo, selector y evolución */
#stage{position:fixed;inset:0;z-index:80;display:none;flex-direction:column;align-items:center;background:radial-gradient(90% 60% at 20% 10%,#ffd9e6 0%,transparent 60%),radial-gradient(80% 60% at 90% 30%,#d9ecff 0%,transparent 60%),radial-gradient(90% 70% at 50% 100%,#e2f7d9 0%,transparent 60%),#fff4e6;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(16px + env(safe-area-inset-bottom,0px))}
#stage.on{display:flex}
#stage h1{margin:4px 0 0;font-size:32px;font-weight:900;text-align:center;letter-spacing:-.01em}
#stage .sub{text-align:center;color:var(--ink2);margin:4px 0 14px}
.lines{flex:1;width:100%;max-width:520px;overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:4px 2px 10px;align-content:start}
.ln{border-radius:28px;padding:10px 8px 12px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;transition:transform .2s}
.ln .pair{display:flex;align-items:flex-end;justify-content:center;width:100%}
.ln .pair div{width:48%;aspect-ratio:1}
.ln b{font-size:16px}
.ln span{font-size:11.5px;color:var(--ink2)}
.ln[aria-pressed="true"]{box-shadow:0 0 0 3px var(--acc),0 10px 26px rgba(255,127,102,.35);transform:translateY(-2px)}
.stage-go{width:100%;max-width:520px;display:flex;flex-direction:column;gap:10px;padding-top:8px}
.egg-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;width:100%}
.egg{width:min(62vw,260px);aspect-ratio:1;touch-action:manipulation;transition:transform .15s;position:relative}
.egg.wob{animation:wob .5s}
@keyframes wob{20%{transform:rotate(-10deg)}40%{transform:rotate(9deg)}60%{transform:rotate(-6deg)}80%{transform:rotate(3deg)}}
.egg.idle{animation:idle 2.4s ease-in-out infinite}
@keyframes idle{0%,86%,100%{transform:rotate(0)}90%{transform:rotate(-5deg)}95%{transform:rotate(5deg)}}
.flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:85}
.flash.go{animation:flash 1s}
@keyframes flash{30%{opacity:1}100%{opacity:0}}
.born{animation:born .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes born{from{transform:scale(.2);opacity:0}}
.rays{position:absolute;inset:-30%;background:repeating-conic-gradient(from 0deg,rgba(255,220,120,.35) 0 10deg,transparent 10deg 20deg);border-radius:50%;animation:spin 8s linear infinite;-webkit-mask:radial-gradient(closest-side,#000 40%,transparent);mask:radial-gradient(closest-side,#000 40%,transparent)}
@keyframes spin{to{transform:rotate(360deg)}}
.evo-art{position:relative;width:min(66vw,280px);aspect-ratio:1}
.evo-art .a{position:absolute;inset:0}
.evo-art.glow .a{animation:evo 2.6s ease-in forwards}
@keyframes evo{0%{filter:brightness(1)}20%,100%{filter:brightness(0) invert(1) drop-shadow(0 0 20px #fff)}}
.evo-art .a.swap{animation:swapA 2.6s steps(1) forwards}

/* minijuegos */
#game{position:fixed;inset:0;z-index:70;display:none;touch-action:none;background:#fff4e6}
#game.on{display:block}
#game canvas{position:absolute;inset:0;width:100%;height:100%}
.ghud{position:absolute;left:12px;right:12px;top:calc(8px + env(safe-area-inset-top,0px));padding:8px 8px 8px 16px;border-radius:999px;display:flex;align-items:center;gap:10px;font-weight:900;font-size:17px;z-index:3}
.ghud .sp{flex:1}
.ghud button{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.85);font-size:18px}
.gstart{position:absolute;left:50%;top:60%;transform:translateX(-50%);text-align:center;padding:10px 18px;border-radius:999px;pointer-events:none;font-weight:900;animation:pulse 1.4s infinite;white-space:nowrap;z-index:3;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
@keyframes pulse{50%{opacity:.45}}
.gover{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(74,50,38,.25);z-index:5}
.gover.on{display:flex}
.gover .card{width:min(88vw,340px);border-radius:32px;padding:20px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.gover h3{margin:0;font-size:24px;font-weight:900}
.gover .big{font-size:46px;font-weight:900;color:var(--acc);line-height:1}
.gover .art{width:120px;height:120px}
#dom{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:90px 14px 30px}
#dom.on{display:flex}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;width:min(94vw,440px)}
.card3d{aspect-ratio:3/4;perspective:600px}
.card3d .in{position:relative;width:100%;height:100%;transition:transform .35s;transform-style:preserve-3d}
.card3d.up .in{transform:rotateY(180deg)}
.card3d .fa,.card3d .ba{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center}
.card3d .fa{background:linear-gradient(135deg,#ffb4a2,#ff8f7a);border:3px solid #fff;box-shadow:0 4px 10px var(--shade);font-size:22px;color:#fff}
.card3d .ba{transform:rotateY(180deg);background:#fff;border:3px solid #fff;box-shadow:0 4px 10px var(--shade);padding:2px}
.card3d.done .ba{background:#effbf3;border-color:#bfe8cf}
.holes{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;width:min(92vw,400px)}
.hole{aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 50% 70%,#7a5a44 0%,#a07e62 60%,#c9a88a 100%);position:relative;overflow:hidden;box-shadow:inset 0 6px 12px rgba(0,0,0,.35)}
.hole .who2{position:absolute;left:6%;right:6%;bottom:-86%;height:90%;transition:bottom .16s;display:grid;place-items:center;font-size:46px}
.hole.up .who2{bottom:4%}
.hole.hit .who2{filter:brightness(1.3);transform:scale(.9)}
.art-img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none;-webkit-user-drag:none}
.pet .art-img{transition:transform .3s,filter .4s;filter:drop-shadow(0 10px 12px rgba(74,50,38,.22))}
.pet.sleep .art-img{filter:brightness(.8) saturate(.8) drop-shadow(0 10px 12px rgba(74,50,38,.22))}
.pet.dirty .art-img{filter:sepia(.4) brightness(.93) drop-shadow(0 10px 12px rgba(74,50,38,.22))}
.pet .flies{position:absolute;right:6%;top:8%;font-size:22px;animation:wig 1.4s infinite}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<div id="room"></div>
<div class="dark" id="dark"></div>
<div id="app">
  <header class="top glass">
    <button class="avatar" id="avatarBtn" aria-label="Cambiar nombre"><span id="avatar"></span><span class="lv" id="lvl">1</span></button>
    <button class="who" id="whoBtn"><b id="name">—</b><small id="kind"></small><div class="xp"><i id="xpBar"></i></div></button>
    <div class="coins" id="coins">🪙 <span id="coinN">0</span></div>
  </header>
  <div class="needs glass" id="needs"></div>
  <div class="scene" id="scene">
    <div class="pet" id="pet"><div class="pet-b"><div class="pet-s" id="petS"><div id="petArt" style="width:100%;height:100%"></div></div></div></div>
    <div class="zzz" id="zzz">z z Z</div>
    <div class="bubble glass" id="bubble"></div>
  </div>
  <div class="tray glass" id="tray"></div>
  <nav class="nav glass" id="nav">
    <button data-room="kitchen" aria-label="Cocina">🍽️<i class="dot"></i></button>
    <button data-room="bath" aria-label="Baño">🛁<i class="dot"></i></button>
    <button data-room="bed" aria-label="Dormitorio">🌙<i class="dot"></i></button>
    <button data-room="play" aria-label="Juegos">🎮<i class="dot"></i></button>
    <button data-room="closet" aria-label="Armario">🎀</button>
  </nav>
</div>
<div class="fx" id="fx"></div>
<div class="sheet-wrap" id="sheetWrap"><div class="sheet glass" id="sheet"></div></div>
<div class="toast glass" id="toast"></div>
<div id="stage"></div>
<div class="flash" id="flash"></div>
<div id="game">
  <canvas id="cv"></canvas>
  <div id="dom"></div>
  <div class="ghud glass"><span id="gScore">0</span><span class="sp"></span><span id="gLives"></span><span id="gCoins">🪙 0</span><button id="gClose" aria-label="Salir">✕</button></div>
  <div class="gstart glass" id="gStart"></div>
  <div class="gover" id="gOver"><div class="card glass"><div class="art" id="goArt"></div><h3 id="goTitle">¡Fin!</h3><div class="big" id="goScore">0</div><div id="goInfo" class="hint"></div><div class="row" style="width:100%"><button class="btn" id="goExit">Salir</button><button class="btn acc" id="goAgain">Otra vez</button></div></div></div>
</div>
<script src="chars.js"></script>
<script src="sprites.js"></script>
<script src="rooms.js"></script>
<script>
'use strict';
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const today = () => new Date().toISOString().slice(0, 10);
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const Cap = window.Capacitor && window.Capacitor.Plugins;
function haptic(k) { try { if (Cap && Cap.Haptics) { k === 'heavy' ? Cap.Haptics.impact({ style: 'HEAVY' }) : k === 'ok' ? Cap.Haptics.notification({ type: 'SUCCESS' }) : Cap.Haptics.impact({ style: 'LIGHT' }); } } catch (e) { } }
let AC = null;
function tone(f, d = .12, type = 'sine', v = .14, slide = 0) {

/* comer */
function feed(id) {
  const f = FOODS.find(x => x.id === id); if (!f || !(S.inv[id] > 0)) return;
  if (S.sleep) { say('Zzz… 😴'); return; }
  if (S.food >= 98 && !f.energy && !f.xp) { say('¡Estoy lleno! 🙅'); expr('x', 'flat', 900); return; }
  S.inv[id]--; if (!S.inv[id]) delete S.inv[id];
  const fav = LINES[S.line].food === id;
  S.food = clamp(S.food + (f.food || 0), 0, 100); S.fun = clamp(S.fun + (f.fun || 0) + (fav ? 8 : 0), 0, 100);
  if (f.energy) S.energy = clamp(S.energy + f.energy, 0, 100); if (f.clean) S.clean = clamp(S.clean + f.clean, 0, 100);
  SFX.eat(); haptic(); squish();
  let n = 0; const ch = setInterval(() => { face.mouth = n % 2 ? 'chew' : 'cat'; face.eyes = 'happy'; drawPet(); if (++n > 5) { clearInterval(ch); face.mouth = null; face.eyes = null; drawPet(); } }, 130);
  if (f.food) popFx('+' + f.food, '#5fc98a'); if (fav) { hearts(); say('¡Mi comida favorita! 💖'); } else if (f.xp) say('¡Me siento más fuerte! ✨'); else say(pick(['¡Ñam! 😋', '¡Qué rico!', '¡Más, más!', 'Mmmm…']));
  addXp((f.xp || 0) + (fav ? 6 : 3)); save(); renderHud(); renderTray();
}
function bindFood(el) {
  let g = null, sx = null, sy = 0, mv = false;
  el.addEventListener('pointerdown', e => { sx = e.clientX; sy = e.clientY; mv = false; el.setPointerCapture(e.pointerId); });
  el.addEventListener('pointermove', e => {
    if (sx == null) return;
    if (!mv && Math.hypot(e.clientX - sx, e.clientY - sy) > 10) { mv = true; g = document.createElement('div'); g.className = 'drag-food'; g.textContent = el.querySelector('.e').textContent; document.body.appendChild(g); }
    if (g) { g.style.left = e.clientX + 'px'; g.style.top = e.clientY + 'px'; const want = nearMouth(e.clientX, e.clientY) ? 'open' : null; if (face.mouth !== want) { face.mouth = want; face.eyes = want ? 'sparkle' : null; drawPet(); } }
  });
  el.addEventListener('pointerup', e => { if (sx == null) return; sx = null; if (!mv) return feed(el.dataset.food); if (g) g.remove(); g = null; face.mouth = null; face.eyes = null; drawPet(); if (nearMouth(e.clientX, e.clientY)) feed(el.dataset.food); });
  el.addEventListener('pointercancel', () => { sx = null; if (g) g.remove(); g = null; face.mouth = null; face.eyes = null; drawPet(); });
}

  Mm.moves++; const [a, b] = Mm.open; hud(Mm.moves + ' mov.', null, 0);

    if (Mm.found === 8) { const coins = Math.max(6, 40 - Mm.moves); setTimeout(() => endGame(Mm.moves, coins, Mm.moves + ' mov.', (x, y) => x < y), 500); } }
  else { Mm.lock = true; setTimeout(() => { a.classList.remove('up'); b.classList.remove('up'); Mm.open = []; Mm.lock = false; }, 750); }
}
let Wk;
function initWhack() {
  Wk = { score: 0, time: 30, holes: [] }; hud('0', null, 0);
  $('#dom').innerHTML = `<div style="display:flex;flex-direction:column;align-items:center;gap:18px"><div class="glass" style="padding:8px 18px;border-radius:999px;font-weight:900" id="wkT">⏱ 30 s</div><div class="holes">${Array.from({ length: 9 }, (_, i) => `<div class="hole" data-i="${i}"><div class="who2"></div></div>`).join('')}</div></div>`;
  Wk.holes = [...$('#dom').querySelectorAll('.hole')];
  Wk.holes.forEach(h => h.addEventListener('pointerdown', () => { if (!G.started) { start(); runWhack(); } else whackHit(h); }));
}
function runWhack() {
  G.iv = setInterval(() => { Wk.time--; $('#wkT').textContent = `⏱ ${Wk.time} s`; if (Wk.time <= 0) endGame(Wk.score, Math.floor(Wk.score / 2), Wk.score); }, 1000);
  const pop = () => { if (!G.on) return; const free = Wk.holes.filter(h => !h.classList.contains('up'));
    if (free.length) { const h = pick(free), friend = Math.random() < .2; h.dataset.kind = friend ? 'friend' : 'bug';
      h.querySelector('.who2').innerHTML = friend ? `<div style="width:100%;height:100%">${art(cur())}</div>` : pick(['🐛', '🐞', '🦟', '🪲', '🐜']);
      h.classList.add('up'); setTimeout(() => h.classList.remove('up', 'hit'), 900 - Math.min(500, (30 - Wk.time) * 14)); }
    G.to = setTimeout(pop, Math.max(330, 700 - (30 - Wk.time) * 14)); };
  pop();
}
function whackHit(h) {
  if (!h.classList.contains('up') || h.classList.contains('hit')) return; h.classList.add('hit');
  if (h.dataset.kind === 'friend') { Wk.score = Math.max(0, Wk.score - 3); SFX.bad(); haptic('heavy'); toast('¡A tu amigo no! 😣'); } else { Wk.score++; SFX.pop(); haptic(); }
  hud(String(Wk.score), null, Math.floor(Wk.score / 2)); setTimeout(() => h.classList.remove('up', 'hit'), 150);
}

/* arranque */
function daily() { if (S.day === today()) return; const first = !S.day; S.day = today(); if (!first) { S.coins += 25; bumpCoins(); setTimeout(() => toast('Regalo diario: +25 🪙'), 900); } save(); }
loadSprites().then(() => { tick(); daily(); goRoom(S.room || 'kitchen'); drawPet(); renderHud(); if (!S.line) openChoose(false); });
setInterval(() => { tick(); save(); renderHud(); drawPet(); }, 5000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { tick(); daily(); renderHud(); drawPet(); } else { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { } } });
setInterval(() => { const m = mood(); if (!G.on && !S.sleep && S.line && Math.random() < .35 && m !== 'happy' && m !== 'ok') say({ hungry: 'Tengo hambre… 🍎', tired: 'Estoy cansado… 😴', dirty: 'Necesito un baño 🛁', bored: '¿Jugamos? 🎮' }[m], 2500); }, 20000);
</script>
