# Genera un .ipa SIN FIRMAR (para firmarlo después con Sideloadly, AltStore, TrollStore, etc.).
# No necesita cuenta ni secrets de Apple. Lánzalo desde Actions → "IPA sin firmar" → Run workflow.
name: IPA sin firmar

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      BUNDLE_ID: ${{ vars.BUNDLE_ID || 'es.david.mision' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Construir la web
        run: sh build.sh

      - name: Crear el proyecto iOS (Capacitor)
        working-directory: ios-app
        run: |
          sed -i '' "s/es.david.mision/${BUNDLE_ID}/" capacitor.config.json
          npm install
          npx cap add ios
          npx --yes @capacitor/assets generate --ios --iconBackgroundColor '#0e0c11' || echo "Iconos: se usa el por defecto"
          npx cap sync ios
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" ios/App/App/Info.plist || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Caudal" ios/App/App/Info.plist || true
          # Enlaces mision:// para Atajos de iPhone
          PL=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :CFBundleURLTypes" $PL 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" $PL
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" $PL
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLName string ${BUNDLE_ID}" $PL
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" $PL
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string mision" $PL
          /usr/libexec/PlistBuddy -c "Add :UIStatusBarStyle string UIStatusBarStyleLightContent" $PL || true
          /usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes" $PL

      - name: Compilar sin firma
        run: |
          cd ios-app/ios/App
          if [ -d App.xcworkspace ]; then SRC="-workspace App.xcworkspace"; else SRC="-project App.xcodeproj"; fi
          xcodebuild $SRC -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION=2.1.${{ github.run_number }} CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            build | tail -40

      - name: Empaquetar el .ipa
        run: |
          APP=$(find "$RUNNER_TEMP/dd/Build/Products" -maxdepth 2 -name 'App.app' -type d | head -1)
          test -d "$APP"
          mkdir -p "$RUNNER_TEMP/pkg/Payload" out
          cp -R "$APP" "$RUNNER_TEMP/pkg/Payload/"
          (cd "$RUNNER_TEMP/pkg" && zip -qry "$GITHUB_WORKSPACE/out/Mision-sin-firmar.ipa" Payload)
          ls -la out

      - name: Fuente para KSign (formato AltStore)
        # KSign lee este repo.json y avisa de actualización cuando cambia "version".
        # URL fija de la fuente: https://github.com/<usuario>/<repo>/releases/download/ipa-latest/repo.json
        env:
          RUN: ${{ github.run_number }}
          REPO: ${{ github.repository }}
        run: |
          cp dist/icon-512.png out/icon.png
          BASE="https://github.com/$REPO/releases/download/ipa-latest"
          SIZE=$(stat -f%z out/Mision-sin-firmar.ipa)
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          MSG=$(git log -1 --pretty=%s | tr -d '"\\')
          cat > out/repo.json <<JSON
          {
            "name": "Caudal",
            "identifier": "${BUNDLE_ID}.repo",
            "subtitle": "Tus finanzas",
            "iconURL": "$BASE/icon.png",
            "tintColor": "e4b3cb",
            "apps": [{
              "name": "Caudal",
              "bundleIdentifier": "${BUNDLE_ID}",
              "developerName": "David",
              "subtitle": "Cuentas, objetivos, ETF y cripto en tiempo real",
              "localizedDescription": "App de finanzas personales.",
              "iconURL": "$BASE/icon.png",
              "tintColor": "e4b3cb",
              "category": "utilities",
              "versions": [{
                "version": "2.1.$RUN",
                "buildVersion": "$RUN",
                "date": "$DATE",
                "downloadURL": "$BASE/Mision-sin-firmar.ipa",
                "size": $SIZE,
                "localizedDescription": "$MSG",
                "minOSVersion": "14.0"
              }]
            }]
          }
          JSON
          python3 -m json.tool out/repo.json > /dev/null
          cat out/repo.json

      - name: Publicar el .ipa y la fuente
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view ipa-latest >/dev/null 2>&1 || gh release create ipa-latest --title "Caudal" --notes "Última compilación"
          gh release upload ipa-latest out/Mision-sin-firmar.ipa out/repo.json out/icon.png --clobber
          gh release edit ipa-latest --title "Caudal 2.1.${{ github.run_number }}" --notes "Fuente para KSign: https://github.com/${{ github.repository }}/releases/download/ipa-latest/repo.json"
          # también en la fuente común (todas las apps en una sola fuente de KSign)
          BASE="https://github.com/${{ github.repository }}/releases/download/ipa-latest"
          sh scripts/fuente.sh caudal "Caudal" "$BUNDLE_ID" "2.1.${{ github.run_number }}" "${{ github.run_number }}" \
            "$BASE/Mision-sin-firmar.ipa" "$(stat -f%z out/Mision-sin-firmar.ipa)" "$BASE/icon.png" "Cuentas, objetivos, ETF y cripto en tiempo real"
