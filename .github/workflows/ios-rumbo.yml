# Rumbo (app nativa en SwiftUI: panel de vida, segundo cerebro, revisión, biblioteca y kit de marca): compila un .ipa SIN FIRMAR (para instalar con KSign, Sideloadly…) y lo publica
# como descarga directa en la release «rumbo-latest». Se lanza solo al cambiar rumbo/ en la rama caudal.
name: Rumbo (IPA)

on:
  push:
    branches: [caudal]
    paths: ["rumbo/**", ".github/workflows/ios-rumbo.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: "Usar el Xcode más reciente (SDK de iOS 26, Liquid Glass)"
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1); [ -n "$X" ] || X=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$X"; xcodebuild -version

      - name: Generar el proyecto (XcodeGen)
        working-directory: rumbo
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Compilar sin firma
        working-directory: rumbo
        run: |
          set -o pipefail
          xcodebuild -project Rumbo.xcodeproj -scheme Rumbo -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            build 2>&1 | tee "$RUNNER_TEMP/build.log" | grep -E "error:|warning: unre|BUILD" || true
          grep -q "BUILD SUCCEEDED" "$RUNNER_TEMP/build.log" || { grep -E "error:" "$RUNNER_TEMP/build.log" | head -60; exit 1; }

      - name: Empaquetar el .ipa
        run: |
          APP=$(find "$RUNNER_TEMP/dd/Build/Products" -maxdepth 2 -name 'Rumbo.app' -type d | head -1)
          test -d "$APP"
          mkdir -p "$RUNNER_TEMP/pkg/Payload" out
          cp -R "$APP" "$RUNNER_TEMP/pkg/Payload/"
          (cd "$RUNNER_TEMP/pkg" && zip -qry "$GITHUB_WORKSPACE/out/Rumbo.ipa" Payload)
          ls -la out

      - name: Capturas en el simulador
        working-directory: rumbo
        continue-on-error: true
        run: |
          DEV=$(xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];l=[x for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone') and 'Pro' in x['name'] and 'Max' not in x['name']];print(l[-1]['udid'])")
          xcodebuild -project Rumbo.xcodeproj -scheme Rumbo -configuration Debug -destination "id=$DEV" -derivedDataPath "$RUNNER_TEMP/sim" build -quiet
          xcrun simctl boot "$DEV"; sleep 15
          xcrun simctl status_bar "$DEV" override --time "9:41" --batteryState charged --batteryLevel 100 || true
          APP=$(find "$RUNNER_TEMP/sim/Build/Products" -name 'Rumbo.app' -type d | head -1)
          xcrun simctl install "$DEV" "$APP"
          mkdir -p "$GITHUB_WORKSPACE/out"
          shot() { xcrun simctl terminate "$DEV" es.david.rumbo 2>/dev/null || true; xcrun simctl launch "$DEV" es.david.rumbo "$@" >/dev/null || true; sleep 9; }
          shot -demo;              xcrun simctl io "$DEV" screenshot "$GITHUB_WORKSPACE/out/1-hoy.png"
          shot -demo -tab brain;   xcrun simctl io "$DEV" screenshot "$GITHUB_WORKSPACE/out/2-cerebro.png"
          shot -demo -tab review;  xcrun simctl io "$DEV" screenshot "$GITHUB_WORKSPACE/out/3-revision.png"
          shot -demo -tab library; xcrun simctl io "$DEV" screenshot "$GITHUB_WORKSPACE/out/4-biblioteca.png"
          shot -demo -tab brand;   xcrun simctl io "$DEV" screenshot "$GITHUB_WORKSPACE/out/5-marca.png"
          ls -la "$GITHUB_WORKSPACE/out"

      - name: Publicar el .ipa como descarga directa
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete rumbo-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create rumbo-latest out/Rumbo.ipa $(ls out/*.png 2>/dev/null) --target "$GITHUB_SHA" --title "Rumbo · IPA sin firmar" \
            --notes "Build ${{ github.run_number }} · instálala con KSign o Sideloadly"
