# Caudal 3 (app nativa en SwiftUI): compila un .ipa SIN FIRMAR (para instalar con KSign, Sideloadly…) y lo publica
# como descarga directa en la release «caudal-latest». Se lanza solo al cambiar native/ en la rama caudal.
name: Caudal nativa (IPA)

on:
  push:
    branches: [caudal]
    paths: ["native/**", ".github/workflows/ios-native.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: "Usar el Xcode más reciente (SDK de iOS 26, Liquid Glass)"
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1); [ -n "$X" ] || X=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$X"; xcodebuild -version

      - name: Generar el proyecto (XcodeGen)
        working-directory: native
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Compilar sin firma
        working-directory: native
        run: |
          set -o pipefail
          xcodebuild -project Caudal.xcodeproj -scheme Caudal -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            build 2>&1 | tee "$RUNNER_TEMP/build.log" | grep -E "error:|warning: unre|BUILD" || true
          grep -q "BUILD SUCCEEDED" "$RUNNER_TEMP/build.log" || { grep -E "error:" "$RUNNER_TEMP/build.log" | head -60; exit 1; }

      - name: Empaquetar el .ipa
        run: |
          APP=$(find "$RUNNER_TEMP/dd/Build/Products" -maxdepth 2 -name 'Caudal.app' -type d | head -1)
          test -d "$APP"
          mkdir -p "$RUNNER_TEMP/pkg/Payload" out
          cp -R "$APP" "$RUNNER_TEMP/pkg/Payload/"
          P="$RUNNER_TEMP/pkg/Payload/Caudal.app"
          for X in "$P"/PlugIns/*.appex; do codesign -f -s - --entitlements native/Widgets/Widgets.entitlements "$X"; done
          codesign -f -s - --entitlements native/Caudal/Caudal.entitlements "$P"
          codesign -d --entitlements - "$P" 2>&1 | tail -5; ls "$P/PlugIns"
          (cd "$RUNNER_TEMP/pkg" && zip -qry "$GITHUB_WORKSPACE/out/Caudal.ipa" Payload)
          ls -la out

      - name: Capturas en el simulador
        working-directory: native
        continue-on-error: true
        run: |
          DEV=$(xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];l=[x for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone') and 'Pro' in x['name'] and 'Max' not in x['name']];print(l[-1]['udid'])")
          xcodebuild -project Caudal.xcodeproj -scheme Caudal -configuration Debug -destination "id=$DEV" -derivedDataPath "$RUNNER_TEMP/sim" build -quiet
          xcrun simctl boot "$DEV"; sleep 15
          xcrun simctl status_bar "$DEV" override --time "9:41" --batteryState charged --batteryLevel 100 || true
          APP=$(find "$RUNNER_TEMP/sim/Build/Products" -name 'Caudal.app' -type d | head -1)
          xcrun simctl install "$DEV" "$APP"
          mkdir -p "$GITHUB_WORKSPACE/out"
          shot() { xcrun simctl terminate "$DEV" es.david.caudal 2>/dev/null || true; xcrun simctl launch "$DEV" es.david.caudal "$@" >/dev/null || true; sleep 9; }
          shot -tab home;   xcrun simctl io "$DEV" screenshot "$GITHUB_WORKSPACE/out/1-inicio.png"
          shot -tab txs;    xcrun simctl io "$DEV" screenshot "$GITHUB_WORKSPACE/out/2-movimientos.png"
          shot -tab txs -askdelete; xcrun simctl io "$DEV" screenshot "$GITHUB_WORKSPACE/out/3-eliminar.png"
          shot -tab home -new -amount 123,45; xcrun simctl io "$DEV" screenshot "$GITHUB_WORKSPACE/out/4-apuntar.png"
          shot -tab invest; xcrun simctl io "$DEV" screenshot "$GITHUB_WORKSPACE/out/5-inversiones.png"
          shot -tab debts -demodebts;  xcrun simctl io "$DEV" screenshot "$GITHUB_WORKSPACE/out/6-cuentas.png"
          shot -tab home -work; xcrun simctl io "$DEV" screenshot "$GITHUB_WORKSPACE/out/8-horas.png"
          shot -tab home -work -newshift; xcrun simctl io "$DEV" screenshot "$GITHUB_WORKSPACE/out/9-turno.png"
          shot -tab more;   xcrun simctl io "$DEV" screenshot "$GITHUB_WORKSPACE/out/7-mas.png"
          shot -tab home -customize; xcrun simctl io "$DEV" screenshot "$GITHUB_WORKSPACE/out/10-personalizar.png"
          shot -tab more -widgets; xcrun simctl io "$DEV" screenshot "$GITHUB_WORKSPACE/out/11-widgets.png"
          ls -la "$GITHUB_WORKSPACE/out"

      - name: Publicar el .ipa como descarga directa
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete caudal-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create caudal-latest out/Caudal.ipa $(ls out/*.png 2>/dev/null) --target "$GITHUB_SHA" --title "Caudal 3 (nativa) · IPA sin firmar" \
            --notes "Build ${{ github.run_number }} · instálala con KSign o Sideloadly"
