# Fin de Mes (juego de romper huchas para pagar facturas, nativo en SwiftUI): compila un .ipa SIN FIRMAR (para instalar con KSign, Sideloadly…) y lo publica
# como descarga directa en la release «findemes-latest». Se lanza solo al cambiar findemes/ en la rama caudal.
name: Fin de Mes (IPA)

on:
  push:
    branches: [caudal]
    paths: ["findemes/**", ".github/workflows/ios-findemes.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: "Usar el Xcode más reciente (SDK de iOS 26, Liquid Glass)"
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1); [ -n "$X" ] || X=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$X"; xcodebuild -version

      - name: Generar el proyecto (XcodeGen)
        working-directory: findemes
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Compilar sin firma
        working-directory: findemes
        run: |
          set -o pipefail
          xcodebuild -project FinDeMes.xcodeproj -scheme FinDeMes -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            build 2>&1 | tee "$RUNNER_TEMP/build.log" | grep -E "error:|warning: unre|BUILD" || true
          grep -q "BUILD SUCCEEDED" "$RUNNER_TEMP/build.log" || { grep -E "error:" "$RUNNER_TEMP/build.log" | head -60; exit 1; }

      - name: Empaquetar el .ipa
        run: |
          APP=$(find "$RUNNER_TEMP/dd/Build/Products" -maxdepth 2 -name 'FinDeMes.app' -type d | head -1)
          test -d "$APP"
          mkdir -p "$RUNNER_TEMP/pkg/Payload" out
          cp -R "$APP" "$RUNNER_TEMP/pkg/Payload/"
          (cd "$RUNNER_TEMP/pkg" && zip -qry "$GITHUB_WORKSPACE/out/FinDeMes.ipa" Payload)
          ls -la out

      - name: Capturas en el simulador
        working-directory: findemes
        continue-on-error: true
        run: |
          DEV=$(xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];l=[x for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone') and 'Pro' in x['name'] and 'Max' not in x['name']];print(l[-1]['udid'])")
          xcodebuild -project FinDeMes.xcodeproj -scheme FinDeMes -configuration Debug -destination "id=$DEV" -derivedDataPath "$RUNNER_TEMP/sim" build -quiet
          xcrun simctl boot "$DEV"; sleep 15
          xcrun simctl status_bar "$DEV" override --time "9:41" --batteryState charged --batteryLevel 100 || true
          APP=$(find "$RUNNER_TEMP/sim/Build/Products" -name 'FinDeMes.app' -type d | head -1)
          xcrun simctl install "$DEV" "$APP"
          mkdir -p "$GITHUB_WORKSPACE/out"
          shot() { xcrun simctl terminate "$DEV" es.david.findemes 2>/dev/null || true; xcrun simctl launch "$DEV" es.david.findemes "$@" >/dev/null || true; sleep 9; }
          shot;                      xcrun simctl io "$DEV" screenshot "$GITHUB_WORKSPACE/out/1-primera-vez.png"
          shot -demo;                xcrun simctl io "$DEV" screenshot "$GITHUB_WORKSPACE/out/2-cocina.png"
          shot -demo -play;          xcrun simctl io "$DEV" screenshot "$GITHUB_WORKSPACE/out/3-mesa.png"
          shot -demo -play; sleep 3; xcrun simctl io "$DEV" screenshot "$GITHUB_WORKSPACE/out/4-mesa-luego.png"
          shot -demo -tree;          xcrun simctl io "$DEV" screenshot "$GITHUB_WORKSPACE/out/5-corcho.png"
          shot -demo -tree -treestyle 1; xcrun simctl io "$DEV" screenshot "$GITHUB_WORKSPACE/out/5b-columnas.png"
          shot -demo -tree -treestyle 2; xcrun simctl io "$DEV" screenshot "$GITHUB_WORKSPACE/out/5c-cajones.png"
          shot -demo -hammers;       xcrun simctl io "$DEV" screenshot "$GITHUB_WORKSPACE/out/6-martillos.png"
          shot -demo -jewelry;       xcrun simctl io "$DEV" screenshot "$GITHUB_WORKSPACE/out/7-joyero.png"
          shot -demo -coins;         xcrun simctl io "$DEV" screenshot "$GITHUB_WORKSPACE/out/8-monedas.png"
          shot -demo -report;        xcrun simctl io "$DEV" screenshot "$GITHUB_WORKSPACE/out/9-ticket.png"
          shot -demo -collector;     xcrun simctl io "$DEV" screenshot "$GITHUB_WORKSPACE/out/10-cobrador.png"
          shot -demo -skins;         xcrun simctl io "$DEV" screenshot "$GITHUB_WORKSPACE/out/11-personajes.png"
          shot -demo -play -zoo;     xcrun simctl io "$DEV" screenshot "$GITHUB_WORKSPACE/out/12-cerditos.png"
          shot -demo -play -zoo -skin gamba;      xcrun simctl io "$DEV" screenshot "$GITHUB_WORKSPACE/out/13-gambas.png"
          shot -demo -play -zoo -skin langostino; xcrun simctl io "$DEV" screenshot "$GITHUB_WORKSPACE/out/14-langostinos.png"
          shot -demo -play -zoo -skin vaca;       xcrun simctl io "$DEV" screenshot "$GITHUB_WORKSPACE/out/15-vacas.png"
          shot -demo -logros;      xcrun simctl io "$DEV" screenshot "$GITHUB_WORKSPACE/out/16-logros.png"
          shot -demo -huchario;    xcrun simctl io "$DEV" screenshot "$GITHUB_WORKSPACE/out/17-huchario.png"
          shot -demo -daily;       xcrun simctl io "$DEV" screenshot "$GITHUB_WORKSPACE/out/18-premio-diario.png"
          shot -demo -nivel;       xcrun simctl io "$DEV" screenshot "$GITHUB_WORKSPACE/out/19-nivel.png"
          shot -demo -nueva;       xcrun simctl io "$DEV" screenshot "$GITHUB_WORKSPACE/out/20-hucha-nueva.png"
          shot -demo -sobres;      xcrun simctl io "$DEV" screenshot "$GITHUB_WORKSPACE/out/21-cocina-sobres.png"
          shot -demo -intro;       xcrun simctl io "$DEV" screenshot "$GITHUB_WORKSPACE/out/22-historia.png"
          ls -la "$GITHUB_WORKSPACE/out"

      - name: Publicar el .ipa como descarga directa
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete findemes-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create findemes-latest out/FinDeMes.ipa $(ls out/*.png 2>/dev/null) --target "$GITHUB_SHA" --title "Fin de Mes · IPA sin firmar" \
            --notes "Build ${{ github.run_number }} · instálala con KSign o Sideloadly"
