# Compila la app de iPhone en un Mac de GitHub y la sube a TestFlight (o genera un .ipa Ad Hoc).
# Lánzalo desde la pestaña Actions → "App de iPhone" → Run workflow.
name: App de iPhone

on:
  workflow_dispatch:
    inputs:
      destino:
        description: "testflight (recomendado) o adhoc (.ipa para dispositivos registrados)"
        type: choice
        default: testflight
        options: [testflight, adhoc]

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      BUNDLE_ID: ${{ vars.BUNDLE_ID || 'es.david.mision' }}
      KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Construir la web
        run: sh build.sh

      - name: Crear el proyecto iOS (Capacitor)
        working-directory: ios-app
        run: |
          sed -i '' "s/es.david.mision/${BUNDLE_ID}/" capacitor.config.json
          npm install
          npx cap add ios
          npx --yes @capacitor/assets generate --ios --iconBackgroundColor '#0e0c11' || echo "Iconos: se usa el por defecto"
          npx cap sync ios
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" ios/App/App/Info.plist || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Misión" ios/App/App/Info.plist || true
          # Enlaces mision:// para Atajos de iPhone
          PL=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :CFBundleURLTypes" $PL 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" $PL
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" $PL
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLName string ${BUNDLE_ID}" $PL
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" $PL
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string mision" $PL
          /usr/libexec/PlistBuddy -c "Add :UIStatusBarStyle string UIStatusBarStyleLightContent" $PL || true
          /usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes" $PL

      - name: Clave de App Store Connect
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/private_keys
          printf '%s\n' "$ASC_KEY_P8" > ~/private_keys/AuthKey_${KEY_ID}.p8

      - name: Compilar y firmar (Archive)
        run: |
          cd ios-app/ios/App
          if [ -d App.xcworkspace ]; then SRC="-workspace App.xcworkspace"; else SRC="-project App.xcodeproj"; fi
          xcodebuild $SRC -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${KEY_ID}.p8 \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            MARKETING_VERSION=2.0 CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            archive | tail -40

      - name: Exportar / subir a TestFlight
        run: |
          if [ "${{ inputs.destino }}" = "adhoc" ]; then METHOD=release-testing; DEST=export; else METHOD=app-store-connect; DEST=upload; fi
          cat > "$RUNNER_TEMP/opts.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>${METHOD}</string>
            <key>destination</key><string>${DEST}</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/out" -exportOptionsPlist "$RUNNER_TEMP/opts.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${KEY_ID}.p8 \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID"
          ls -la "$RUNNER_TEMP/out" || true

      - name: Guardar el .ipa
        if: inputs.destino == 'adhoc'
        uses: actions/upload-artifact@v4
        with:
          name: Mision-ipa
          path: ${{ runner.temp }}/out/*.ipa
