# Compila una de las apps pequeñas (carpeta con www/, capacitor.config.json, package.json y resources/icon.png)
# como .ipa SIN FIRMAR y la publica en la release "<app>-latest" y en la fuente común de KSign.
# Lánzalo desde Actions → "Mini app (IPA sin firmar)" → Run workflow → elige la app.
name: Mini app (IPA sin firmar)

# También se lanza sola al hacer push a la rama "app" que toque la carpeta de una app
# (los workflow_dispatch solo se pueden lanzar a mano si el workflow está en la rama principal).
on:
  push:
    branches: [app]
    paths: ['bolita/**', 'coche/**', 'cuentas/**', 'tung/**', 'gambi/**', 'road/**', 'hill/**', 'merge/**', 'tank/**', 'brainrot/**']
  workflow_dispatch:
    inputs:
      app:
        description: "Carpeta de la app"
        type: choice
        options: [bolita, coche, cuentas, tung, gambi, road, hill, merge, tank, brainrot]

permissions:
  contents: write

concurrency:
  group: miniapp-fuente   # la fuente común se reescribe entera: nunca dos a la vez
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.d.outputs.apps }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: d
        run: |
          if [ -n "${{ inputs.app }}" ]; then L="${{ inputs.app }}"
          else L=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" 2>/dev/null | cut -d/ -f1 | grep -xE 'bolita|coche|cuentas|tung|gambi|road|hill|merge|tank|brainrot' | sort -u)
               [ -n "$L" ] || L=$(git show --name-only --pretty= HEAD | cut -d/ -f1 | grep -xE 'bolita|coche|cuentas|tung|gambi|road|hill|merge|tank|brainrot' | sort -u); fi
          echo "apps=$(printf '%s\n' $L | jq -R . | jq -sc 'map(select(length>0))')" >> "$GITHUB_OUTPUT"

  ipa:
    needs: detect
    if: needs.detect.outputs.apps != '[]'
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      max-parallel: 1
      matrix:
        app: ${{ fromJSON(needs.detect.outputs.apps) }}
    env:
      APP: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Crear el proyecto iOS (Capacitor)
        working-directory: ${{ matrix.app }}
        run: |
          NAME=$(jq -r .appName capacitor.config.json)
          npm install
          npx cap add ios
          npx --yes @capacitor/assets generate --ios --iconBackgroundColor "$(jq -r .backgroundColor capacitor.config.json)" || echo "Iconos: se usa el por defecto"
          npx cap sync ios
          sh ../scripts/sin-barra-scroll.sh
          PL=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName $NAME" $PL || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string $NAME" $PL
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" $PL || true
          # orientación: vertical salvo que capacitor.config.json diga "orientation": "landscape"
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" $PL || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" $PL
          if [ "$(jq -r '.orientation // "portrait"' capacitor.config.json)" = landscape ]; then
            /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationLandscapeRight" $PL
            /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:1 string UIInterfaceOrientationLandscapeLeft" $PL
            /usr/libexec/PlistBuddy -c "Add :UIRequiresFullScreen bool true" $PL || true
            /usr/libexec/PlistBuddy -c "Add :UIStatusBarHidden bool true" $PL || true
            /usr/libexec/PlistBuddy -c "Add :UIViewControllerBasedStatusBarAppearance bool false" $PL || /usr/libexec/PlistBuddy -c "Set :UIViewControllerBasedStatusBarAppearance false" $PL
          else
            /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationPortrait" $PL
          fi
          /usr/libexec/PlistBuddy -c "Add :UIStatusBarStyle string UIStatusBarStyleLightContent" $PL || true

      - name: Compilar sin firma
        working-directory: ${{ matrix.app }}/ios/App
        run: |
          if [ -d App.xcworkspace ]; then SRC="-workspace App.xcworkspace"; else SRC="-project App.xcodeproj"; fi
          xcodebuild $SRC -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION=1.0.${{ github.run_number }} CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            build | tail -40

      - name: Empaquetar el .ipa
        run: |
          APPDIR=$(find "$RUNNER_TEMP/dd/Build/Products" -maxdepth 2 -name 'App.app' -type d | head -1)
          test -d "$APPDIR"
          mkdir -p "$RUNNER_TEMP/pkg/Payload" out
          cp -R "$APPDIR" "$RUNNER_TEMP/pkg/Payload/"
          (cd "$RUNNER_TEMP/pkg" && zip -qry "$GITHUB_WORKSPACE/out/$APP.ipa" Payload)
          cp "$APP/resources/icon.png" "out/$APP-icon.png"
          ls -la out

      - name: Publicar el .ipa y actualizar la fuente de KSign
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$APP-latest"
          NAME=$(jq -r .appName "$APP/capacitor.config.json")
          BUNDLE=$(jq -r .appId "$APP/capacitor.config.json")
          DESC=$(jq -r '.description // ""' "$APP/package.json")
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$NAME" --notes "Última compilación de $NAME"
          gh release upload "$TAG" "out/$APP.ipa" "out/$APP-icon.png" --clobber
          BASE="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          sh scripts/fuente.sh "$APP" "$NAME" "$BUNDLE" "1.0.${{ github.run_number }}" "${{ github.run_number }}" \
            "$BASE/$APP.ipa" "$(stat -f%z out/$APP.ipa)" "$BASE/$APP-icon.png" "$DESC"
