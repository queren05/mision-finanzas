# Fin de Mes para Android: APK de prueba (firmado con la clave de pruebas) y AAB para Google Play.
# Se lanza al cambiar findemes-android/ en la rama caudal (o a mano).
name: Fin de Mes Android

on:
  push:
    branches: [caudal]
    paths: ["findemes-android/**", ".github/workflows/findemes-android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: findemes-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: SDK de Android (API 37 para compilar)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.1.0" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Clave de subida a Play (secretos de GitHub, si están)
        env:
          KEYSTORE_B64: ${{ secrets.FDM_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/fdm.jks"
            echo "FDM_KEYSTORE_PATH=$RUNNER_TEMP/fdm.jks" >> "$GITHUB_ENV"
          fi

      - name: Compilar
        env:
          VERSION_CODE: ${{ github.run_number }}
          FDM_KEYSTORE_PASSWORD: ${{ secrets.FDM_KEYSTORE_PASSWORD }}
          FDM_KEY_ALIAS: ${{ secrets.FDM_KEY_ALIAS }}
          FDM_KEY_PASSWORD: ${{ secrets.FDM_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease :app:bundleRelease
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/FinDeMes.apk
          cp app/build/outputs/bundle/release/*.aab out/FinDeMes.aab

      - uses: actions/upload-artifact@v4
        with:
          name: findemes-android-${{ github.run_number }}
          path: findemes-android/out/

      - name: Publicar el APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete findemes-android-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create findemes-android-latest out/FinDeMes.apk --target "$GITHUB_SHA" --title "Fin de Mes · APK para Android" \
            --notes "Build ${{ github.run_number }}"
