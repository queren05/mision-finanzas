<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Shrimp Merge</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a4f8a">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<link rel="stylesheet" href="estilo.css">
<link rel="stylesheet" href="merge.css">
</head>
<body>
<canvas id="cv"></canvas>
<div id="top">
  <div class="glass scoreBox"><small>PUNTOS</small><b id="score">0</b></div>
  <div class="glass scoreBox"><small>RÉCORD</small><b id="best">0</b></div>
  <span class="sp"></span>
  <div class="glass nextBox"><small>SIGUIENTE</small><canvas id="nextCv" width="120" height="120"></canvas></div>
  <button class="glass round" id="menuBtn" aria-label="Menú"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/></svg></button>
</div>
<div id="chain" class="glass chain"></div>
<div id="bonus" class="bonus"></div>

<div id="start" class="screen dim">
  <div class="logo"><span>SHRIMP</span><b>MERGE</b></div>
  <div class="muted helpTxt">Suelta los bichos en la pecera. Cuando dos iguales se tocan, se juntan y crecen. ¡Llega hasta la ballena sin que la pecera rebose!</div>
  <button class="btn" id="startBtn">¡JUGAR!</button>
</div>
<div id="paused" class="screen dim" hidden>
  <div class="logo small"><b>PAUSA</b></div>
  <button class="btn" id="resume">SEGUIR</button>
  <button class="btn sec" id="restart">Empezar de nuevo</button>
  <label class="glass row tog"><span>Sonido</span><input type="checkbox" id="optSfx"><i class="sw"></i></label>
  <label class="glass row tog"><span>Música</span><input type="checkbox" id="optMusic"><i class="sw"></i></label>
</div>
<div id="over" class="screen dim" hidden>
  <div class="logo small"><span>¡SE DESBORDÓ!</span></div>
  <div class="glass card"><div class="newRec" id="oRec" hidden>¡NUEVO RÉCORD!</div><small class="muted">PUNTOS</small><div class="big" id="oScore">0</div>
    <div class="stats"><div><small>Mejor bicho</small><b id="oTop">—</b></div><div><small>Récord</small><b id="oBest">0</b></div></div></div>
  <button class="btn" id="again">OTRA VEZ</button>
</div>
<img id="shotImg" alt="">
<script type="module" src="game.js"></script>
</body>
</html>
