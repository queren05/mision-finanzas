<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas,img{display:block;position:fixed;left:0;top:0}#i{position:fixed;left:0;bottom:0;font:11px monospace;background:#fff;color:#000;z-index:9}</style></head><body>
<script>onerror=(m)=>{document.getElementById('i').textContent='ERR '+m}</script>
<script type="module">
import * as THREE from './www/lib/three.module.min.js';
import { GLTFLoader } from './www/lib/GLTFLoader.js';
import * as M from './www/modelos.js';
const S = 1024, q = new URLSearchParams(location.search.replace(/^\?/, '').length ? location.search : '?fov=30&cx=.3&cy=1.85&cz=-3.6&lx=0&ly=1.85');
M.BEND.y.value = 0;
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
r.setPixelRatio(1); r.setSize(S, S); document.body.appendChild(r.domElement);
const sc = new THREE.Scene();
// fondo: atardecer de selva
sc.background = M.canvasTex(S, S, (c, w, h) => {
  const g = c.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#1d0f45'); g.addColorStop(.35, '#7a2a6b'); g.addColorStop(.62, '#e0566a'); g.addColorStop(.82, '#ffb35a'); g.addColorStop(1, '#3a1a2c');
  c.fillStyle = g; c.fillRect(0, 0, w, h);
  const sx = w * .5, sy = h * .55;
  const glow = c.createRadialGradient(sx, sy, 0, sx, sy, w * .55); glow.addColorStop(0, 'rgba(255,240,170,.95)'); glow.addColorStop(.25, 'rgba(255,200,110,.6)'); glow.addColorStop(1, 'rgba(255,140,60,0)');
  c.fillStyle = glow; c.fillRect(0, 0, w, h);
  c.fillStyle = '#fff2b8'; c.beginPath(); c.arc(sx, sy, w * .2, 0, 7); c.fill();
  // colinas de selva en capas
  for (const [col, base, amp, fq, ph] of [['#3b1a48', .72, 60, 2.3, 1], ['#26103a', .8, 50, 3.7, 3], ['#170a26', .88, 40, 5.1, 5]]) {
    c.fillStyle = col; c.beginPath(); c.moveTo(0, h);
    for (let x = 0; x <= w; x += 8) c.lineTo(x, h * base - amp * (.5 + .5 * Math.sin(x / w * Math.PI * fq + ph)) - amp * .4 * Math.sin(x / w * 17 + ph * 2));
    c.lineTo(w, h); c.fill();
  }
  c.fillStyle = '#0f0818'; c.fillRect(0, h * .9, w, h * .1);
}, false);
sc.add(new THREE.HemisphereLight(0xffe2c0, 0x40204a, 1.5));
const key = new THREE.DirectionalLight(0xfff0d8, 2.6); key.position.set(-2, 2.5, -3); sc.add(key);
const rim = new THREE.DirectionalLight(0xff8a4a, 2.2); rim.position.set(2.5, 2, 3); sc.add(rim);
const gl = await new Promise((ok, ko) => new GLTFLoader().load('./www/models/tung.glb', ok, undefined, ko));
const t = new M.Tung(gl); sc.add(t.root); t.root.rotation.y = Math.PI;
t.pose(0, 'idle', +(q.get('t') || .6), .016);
t.root.updateMatrixWorld(true);
const cam = new THREE.PerspectiveCamera(+(q.get('fov') || 43), 1, .1, 50);
cam.position.set(+(q.get('cx') || .35), +(q.get('cy') || 1.6), +(q.get('cz') || -3.7));
cam.lookAt(+(q.get('lx') || .1), +(q.get('ly') || 1.55), 0);
r.render(sc, cam);
const im = new Image(); im.src = r.domElement.toDataURL('image/png'); document.body.appendChild(im);
document.getElementById('i').textContent = 'LISTO';
</script></body></html>
